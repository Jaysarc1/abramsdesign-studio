<!--
ALIGNMENT NOTES
The studio's viewing room: the studio mark on the site's own left edge (its logo and headline), the three views centred on the page, the tier's name on the right edge, all on one line.
The stage below takes the rest of the screen, inset by the same 16px as the bar.
-->
<style>

:root{
  --room:#E9E2D6;--room-ink:#6E665B;--pill:#D8CEBE;--pill-ink:#4A433A;--room-on:#1F1C18;--room-on-ink:#FAF7F2;
  --sheet:#FAF7F2;--plaster:#F1EBE1;--graphite:#1F1C18;--faint:#857C70;--rule:rgba(31,28,24,.14);--patina:#2E5149;
  --ink:#1F1C18;--shadow:0 1px 2px rgba(20,18,15,.10),0 22px 56px -22px rgba(20,18,15,.34);
  --text:"Newsreader",Georgia,"Times New Roman",serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --lock:Montserrat,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--room:#141311;--room-ink:#A39C91;--pill:#2B2722;--pill-ink:#C9C1B4;--room-on:#ECE7DE;--room-on-ink:#141311;--ink:#ECE7DE;--faint:#8F877B;--rule:rgba(236,231,222,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 22px 56px -22px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--room:#141311;--room-ink:#A39C91;--pill:#2B2722;--pill-ink:#C9C1B4;--room-on:#ECE7DE;--room-on-ink:#141311;--ink:#ECE7DE;--faint:#8F877B;--rule:rgba(236,231,222,.14);--shadow:0 1px 2px rgba(0,0,0,.4),0 22px 56px -22px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--room);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.room{max-width:1360px;margin:0 auto;padding:clamp(40px,7vw,88px) max(16px,env(safe-area-inset-right,0px)) clamp(56px,8vw,104px) max(16px,env(safe-area-inset-left,0px));padding-inline:max(clamp(16px,4vw,56px),env(safe-area-inset-left,0px))}

.lock{font-size:clamp(34px,4.2vw,52px);line-height:1;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.lock svg{display:block;height:1em;width:2.994em}
.lock .rl{display:block;width:4.03em;height:1px;margin-top:.39em;background:currentColor;opacity:.62}
.lock .nm{display:block;margin-top:.8em;font-family:var(--lock);font-weight:400;font-size:.236em;letter-spacing:.335em;text-indent:.335em;text-transform:uppercase;white-space:nowrap}

h1{margin:clamp(40px,5.4vw,72px) 0 0;text-align:center;font-family:var(--serif);font-weight:300;font-variation-settings:"opsz" 144;font-size:clamp(34px,4.6vw,64px);line-height:1.04;letter-spacing:-.012em;text-wrap:balance}
h1 em{font-style:italic}

.mono{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1}

/* three columns on one grid; every card reserves the bar row so all three previews start on the same line */
.tiers{list-style:none;margin:clamp(44px,6vw,80px) 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:28px repeat(6,auto);column-gap:clamp(16px,2.2vw,32px)}
.tier{grid-row:span 7;display:grid;grid-template-rows:subgrid;align-content:start;cursor:pointer;outline:none;opacity:0;transform:translateY(22px);transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1)}
.in .tier{opacity:1;transform:none}
.in .tier:nth-child(2){transition-delay:.18s}
.in .tier:nth-child(3){transition-delay:.36s}
.bar{display:flex;align-items:center;justify-content:center;background:var(--room-on);color:var(--room-on-ink)}
.bar .mono{letter-spacing:.3em;text-indent:.3em;font-size:10px}
.tier:not(.rec) .bar{visibility:hidden}

.frame{position:relative;aspect-ratio:var(--ar,16/10);overflow:hidden;background:#12152A;box-shadow:var(--shadow);transition:transform .9s cubic-bezier(.2,.7,.2,1),box-shadow .9s ease}
.tier:not(.rec) .frame{border-radius:0}
.frame iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none;background:transparent}
.frame .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(10,10,14,.0));transition:background .9s ease}
.frame .open{position:absolute;right:14px;bottom:14px;padding:10px 15px;border-radius:999px;background:rgba(250,247,242,.94);color:#1F1C18;opacity:0;transform:translateY(6px);transition:opacity .6s ease,transform .6s ease}
.tier:hover .frame,.tier:focus-visible .frame{transform:translateY(-6px)}
.tier:hover .open,.tier:focus-visible .open{opacity:1;transform:none}
.tier:focus-visible .frame{outline:2px solid var(--patina);outline-offset:4px}

.ex{display:flex;flex-wrap:wrap;gap:6px;padding-top:14px;min-height:42px}
@media (max-width:900px){.ex:empty{display:none}}
.ex{gap:22px}
.ex button,.views button{appearance:none;border:0;background:none;color:var(--faint);font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:8px 0 7px;border-bottom:1px solid transparent;cursor:pointer;transition:color .45s ease,border-color .45s ease}
.ex button:hover,.views button:hover{color:var(--ink)}
.ex button[aria-pressed="true"],.views button[aria-pressed="true"]{color:var(--ink);border-bottom-color:currentColor}
.ex button:focus-visible,.views button:focus-visible{outline:2px solid var(--patina);outline-offset:3px}
.frame iframe.out{opacity:0;transition:opacity .6s ease}

/* the outline under each preview: numeral, name, price, line, then what the tier adds */
.t-top{padding-top:26px}
.t-hd{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:12px}
.t-hd h2{margin:0;font-family:var(--serif);font-weight:300;font-variation-settings:"opsz" 144;font-size:clamp(30px,2.8vw,40px);line-height:1;letter-spacing:-.01em}
.t-price{font-family:var(--serif);font-weight:300;font-variation-settings:"opsz" 144;font-size:clamp(22px,1.9vw,27px);line-height:1;letter-spacing:-.015em;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.t-price .pre{font-size:10px;margin-right:8px;vertical-align:.32em}
.up b{white-space:nowrap}.up b .pre{font-size:10px;margin-right:8px;vertical-align:.26em}
.t-line{margin:12px 0 0;font-family:var(--text);font-style:italic;font-weight:300;font-size:18px;line-height:1.3;color:var(--room-ink)}
.t-list{margin:22px 0 0;padding:18px 0 0;border-top:1px solid var(--rule);list-style:none;display:flex;flex-direction:column;gap:9px;font-family:var(--text);font-size:16.5px;line-height:1.35}
.t-list .mono{color:var(--faint);margin-bottom:5px}
.t-list li.inc{color:var(--room-ink);font-style:italic}
.t-up{margin-top:22px}
.up{padding:16px 18px 17px;background:var(--plaster);display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:9px;column-gap:16px}
.up .mono{color:var(--ink)}
.up b{font-family:var(--serif);font-weight:300;font-variation-settings:"opsz" 144;font-size:22px;line-height:1;letter-spacing:-.015em;font-variant-numeric:lining-nums tabular-nums}
.up p{grid-column:1/-1;margin:0;font-family:var(--text);font-size:15.5px;line-height:1.35;color:var(--room-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .up{background:#1F1D1A}}
:root[data-theme="dark"] .up{background:#1F1D1A}

/* full view */
.view{position:fixed;inset:0;z-index:10;display:grid;grid-template-rows:auto 1fr;background:var(--room);opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.view.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.vbar{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));padding-top:max(12px,env(safe-area-inset-top,0px))}
/* the studio mark starts on the site's own left edge, so it lines up with the farm's logo and headline below.
   That edge is the site's .wrap inside a stage 32px narrower than the view: max(--side, (stage - 1312px)/2), --side = clamp(24px, 4.4vw, 64px) */
.vbar .who{grid-row:1;justify-self:start;margin-left:max(clamp(24px,calc((100vw - 32px) * .044),64px),calc((100vw - 32px - 1312px) / 2));color:var(--ink);display:flex;align-items:center;gap:10px}
.tierbar{grid-row:1;grid-column:2}
.vbar .who svg{height:15px;width:45px;display:block}
/* one track, one thumb: the four ways to buy read as a single progression */
.seg{position:relative;display:flex;align-items:center;padding:4px;border-radius:999px;background:var(--pill)}
.seg .thumb{position:absolute;left:0;top:4px;bottom:4px;width:0;border-radius:999px;background:var(--room-on);transition:transform .55s cubic-bezier(.3,.7,.2,1),width .55s cubic-bezier(.3,.7,.2,1)}
.seg.still .thumb{transition:none}
.seg button{position:relative;appearance:none;border:0;background:none;color:var(--pill-ink);font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:11px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .45s ease}
.seg button:hover{color:var(--room-on)}
.seg button[aria-selected="true"]{color:var(--room-on-ink)}
.seg button .plus{display:inline-block;margin:0 .45em;font-size:1.25em;line-height:0;vertical-align:-.06em;opacity:.6}
.seg button:focus-visible,.x:focus-visible{outline:2px solid var(--patina);outline-offset:2px}
.x{appearance:none;border:0;background:var(--pill);color:var(--pill-ink);border-radius:999px;cursor:pointer;transition:color .45s ease}
.x:hover{color:var(--room-on)}
/* second row: the views inside a tier, only when a tier has more than one */
.views{grid-column:2;grid-row:2;display:flex;justify-content:center;gap:22px;height:0;overflow:hidden;opacity:0;transition:height .45s ease,opacity .35s ease}
.views.on{height:38px;opacity:1;transition:height .45s ease,opacity .45s ease .12s}
.views button{padding-top:12px}
.x{grid-row:1;grid-column:3;justify-self:end;width:38px;height:38px;padding:0;display:grid;place-items:center}
.x svg{width:12px;height:12px}
.stagewrap{position:relative;margin:0 max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden;box-shadow:var(--shadow);background:#12152A}
.stagewrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .7s ease}
.stagewrap iframe.shown{opacity:1}

@media (max-width:900px){
  .tiers{grid-template-columns:1fr;gap:56px;max-width:520px;margin-inline:auto}
  .tiers{grid-template-rows:none}
  .tier{grid-row:auto;grid-template-rows:none}
  .tier:not(.rec) .bar{display:none}
  .frame .open{opacity:1;transform:none}
}
@media (max-width:560px){
  .vbar{grid-template-columns:1fr auto;padding-inline:max(12px,env(safe-area-inset-left,0px))}
  .vbar .who{display:none}
  .tierbar{justify-self:start;min-width:0}
  .seg button{padding:10px 10px;letter-spacing:.08em;font-size:10px}
  .seg .lg{display:none}
  .views{grid-column:1/-1;justify-content:flex-start;padding-left:14px}
  .stagewrap{margin:0}
  .view{grid-template-rows:auto 1fr}
}
@media (prefers-reduced-motion:reduce){.tier,.frame,.view,.stagewrap iframe{transition:none}}

html,body{height:100%;overflow:hidden}
body{background:var(--room)}
.view{opacity:1;visibility:visible}
.stagewrap{background:#13284D}
.vbar .tn{grid-row:1;grid-column:3;justify-self:end;color:var(--room-ink);padding-right:6px}
.seg button .nd{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:#C29A5B;animation:hhP 2.4s infinite}
@keyframes hhP{0%,100%{box-shadow:0 0 0 0 rgba(194,154,91,.6)}60%{box-shadow:0 0 0 7px rgba(194,154,91,0)}}
.stagewrap iframe{visibility:hidden}
.stagewrap iframe.shown{visibility:visible}
@media (max-width:560px){.vbar .tn{display:none}.tierbar{justify-self:center}.vbar{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.seg button .nd{animation:none}}
</style>
</head>

    if (!p) return;
    thumb.style.width = p.offsetWidth + 'px';
    thumb.style.transform = 'translateX(' + p.offsetLeft + 'px)';
  }
  function dot(on){
    const b = pills.find(p => p.dataset.k === 'office');
    let d = b.querySelector('.nd');
    if (on && !d){ d = document.createElement('i'); d.className = 'nd'; b.appendChild(d); }
    if (!on && d) d.remove();
  }
  // the office and the site stay open side by side, so an inquiry sent on the site is waiting in the office; the game only runs while it is shown
  function show(k, path){
    if (!SRC[k]) return;
    if (frames[k] && path){ frames[k].src = path; }
    if (!frames[k]){
      const ifr = document.createElement('iframe');
      ifr.src = path || SRC[k];
      ifr.title = 'Harris Hill Farm, ' + k;
      ifr.setAttribute('allow','fullscreen; autoplay');
      stage.appendChild(ifr);
      frames[k] = ifr;
    }
    requestAnimationFrame(() => Object.entries(frames).forEach(([n,f]) => f.classList.toggle('shown', n === k)));
    if (k !== 'game' && frames.game){ const g = frames.game; delete frames.game; setTimeout(() => g.remove(), 700); }
    pills.forEach(p => p.setAttribute('aria-selected', String(p.dataset.k === k)));
    if (k === 'office') dot(false);
    current = k;
    slide();
    try { history.replaceState(null, '', '#' + k); } catch(e){}
  }
  HHRelay.oninq = () => { if (current !== 'office') dot(true); };
  HHRelay.ongo = (k, path) => show(k, path);
  pills.forEach(p => p.addEventListener('click', () => show(p.dataset.k)));
  addEventListener('keydown', e => {
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && document.activeElement && document.activeElement.closest('.seg')){
      const ks = ['office','site','game'], i = ks.indexOf(current);
      const n = ks[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3];
      show(n); pills.find(p => p.dataset.k === n).focus();
    }
  });
  addEventListener('resize', () => { seg.classList.add('still'); slide(); requestAnimationFrame(() => seg.classList.remove('still')); });
  document.fonts && document.fonts.ready.then(slide);
  let h = ''; try { h = (location.hash || '').slice(1); } catch(e){}
  seg.classList.add('still');
  show(SRC[h] ? h : 'site');
  // the office loads quietly behind the site, so an inquiry sent on the site is waiting there
  if (current !== 'office') setTimeout(() => { if (!frames.office){ const ifr = document.createElement('iframe'); ifr.src = SRC.office; ifr.title = 'Harris Hill Farm, office'; ifr.setAttribute('allow','fullscreen; autoplay'); stage.insertBefore(ifr, stage.firstChild); frames.office = ifr; } }, 1800);
  requestAnimationFrame(() => requestAnimationFrame(() => seg.classList.remove('still')));
})();
</script>
</body>
