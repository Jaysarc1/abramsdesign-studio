<!doctype html><meta charset="utf-8"><title>dbg3</title>
<style>body{margin:0;background:#777;display:flex;flex-wrap:wrap;gap:10px;padding:10px;align-items:flex-start}iframe{border:0;background:#fff;flex:none}</style>
<body><script>
var q=new URLSearchParams(location.search),w=+(q.get('w')||1440),h=+(q.get('h')||900),ys=(q.get('ys')||'').split(',').filter(Boolean),ts=ys.length?ys.map(function(){return q.get('t')||'40';}):(q.get('t')||'19').split(','),s=+(q.get('s')||0.5),y=+(q.get('y')||0);
fetch('index.html').then(function(r){return r.text();}).then(function(src){
  ts.forEach(function(t,ix){var yy=ys.length?ys[ix]:y;var J=(+t)*1000;
    var inj='<base href="'+location.origin+'/"><script>(function(){var o=window.setTimeout,t0=performance.now();window.setTimeout=function(f,ms){var a=[].slice.call(arguments,2);if(performance.now()-t0<1500&&ms>0){if(ms>'+J+')return 0;ms=0;}return o.apply(window,[f,ms].concat(a));};})();<\/script>';
    var doc=src.replace(/<head[^>]*>/i,function(m){return m+inj;});
    var box=document.createElement('div');box.style.cssText='width:'+(w*s)+'px;height:'+(h*s)+'px;overflow:hidden;position:relative';
    var f=document.createElement('iframe');f.width=w;f.height=h;f.style.cssText='transform:scale('+s+');transform-origin:0 0;position:absolute;left:0;top:0';
    f.srcdoc=doc;if(yy)f.onload=function(){var go=function(){var d=f.contentDocument,p=String(yy).split('@'),v=+(p[1]||0);if(isNaN(+p[0])){var e=d.querySelector(p[0]);if(e)v+=e.getBoundingClientRect().top+f.contentWindow.scrollY;}else v+=+p[0];d.documentElement.style.scrollBehavior='auto';f.contentWindow.scrollTo(0,v);};setTimeout(go,900);setTimeout(go,2500);};box.appendChild(f);document.body.appendChild(box);});
});
</script>
