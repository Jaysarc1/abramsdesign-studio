<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bascule</title><meta name="description" content="Bascule, a 38-floor tower on the water, in 3D.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@400;500;600&display=swap">
<style>
/* Layout: the tower full bleed at dusk on the water; the wordmark and modes ride the top edge on one 44px line,
   the floor stops hang on the left gutter at their true heights, the readout sits on the bottom gutter.
   Black and champagne, Bascule's own palette. Every control is a 12px-radius pill inside a 16px glass tray (4px inset). */
:root{
  --black:#0A0A0C; --ink:#141418; --glass:rgba(12,12,15,.52); --glass-2:rgba(12,12,15,.74);
  --rule:rgba(243,238,230,.14); --champ:#D8C3A0; --champ-2:#B89D74; --ivory:#F3EEE6; --ivory-2:rgba(243,238,230,.74); --mute:#A49E95;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Manrope,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --g:32px; --top:max(24px,env(safe-area-inset-top,0px)); --bot:max(28px,calc(env(safe-area-inset-bottom,0px) + 16px));
  --gl:max(var(--g),env(safe-area-inset-left,0px)); --gr:max(var(--g),env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--black);color:var(--ivory);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
canvas#c.walk{cursor:crosshair}
canvas#c.lock{cursor:default}
canvas#c:active{cursor:grabbing}
button{appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:1.5px solid var(--champ);outline-offset:2px}

.veil{position:fixed;inset:0;background:var(--black);opacity:0;pointer-events:none;z-index:3;transition:opacity .45s ease}
.veil.on{opacity:1}
.veil.ex{opacity:.9;pointer-events:auto}
.frame{position:fixed;z-index:1;pointer-events:none;box-shadow:0 0 0 1px rgba(216,195,160,.38);display:none}
.frame.on{display:block}
.frame i{position:absolute;width:14px;height:14px;border-color:var(--champ);border-style:solid;border-width:0}
.frame i:nth-child(1){left:-1px;top:-1px;border-left-width:1.5px;border-top-width:1.5px}
.frame i:nth-child(2){right:-1px;top:-1px;border-right-width:1.5px;border-top-width:1.5px}
.frame i:nth-child(3){left:-1px;bottom:-1px;border-left-width:1.5px;border-bottom-width:1.5px}
.frame i:nth-child(4){right:-1px;bottom:-1px;border-right-width:1.5px;border-bottom-width:1.5px}

.load{position:fixed;inset:0;z-index:9;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity 1.2s ease,visibility 1.2s}
.load.done{opacity:0;visibility:hidden}
.load .w{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase}
.load .b{width:160px;height:1px;background:var(--rule);overflow:hidden}
.load .b i{display:block;height:100%;width:0;background:var(--champ);transition:width 1.6s cubic-bezier(.3,.7,.2,1)}
.load .b i.go{width:72%}.load .b i.full{width:100%;transition-duration:.5s}
.load .e{display:none;font-size:14px;color:var(--mute);text-align:center;max-width:300px;line-height:1.6}
.load.err .b{display:none}.load.err .e{display:block}

.ui>*{position:fixed;z-index:4;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.ui>.on{opacity:1;visibility:visible;transition:opacity .9s ease,visibility 0s}

/* the top line */
.mark{left:var(--gl);top:var(--top);height:44px;display:flex;align-items:center;font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.42em;text-transform:uppercase;text-shadow:0 1px 20px rgba(0,0,0,.4);pointer-events:none}
.tray{display:flex;align-items:center;gap:2px;padding:4px;border-radius:16px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);box-shadow:inset 0 0 0 1px var(--rule)}
.pill{height:36px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px 0 calc(16px + .14em);border-radius:12px;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;line-height:1;color:var(--ivory-2);white-space:nowrap;transition:background .45s,color .45s}
.pill:hover{color:var(--ivory)}
.pill[aria-pressed="true"]{background:var(--ivory);color:var(--black)}
.modes{left:50%;top:var(--top);transform:translateX(-50%)}
.save{right:var(--gr);top:var(--top)}
.save .pill svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* the floor stops, at their true heights on the tower */
.rail{left:var(--gl);top:50%;transform:translateY(-50%);height:min(340px,46vh);width:220px}
.rail .tk{position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--rule)}
.rail .tk b{position:absolute;left:-1px;width:3px;height:var(--h,0%);bottom:0;background:var(--champ);transition:height 1.6s cubic-bezier(.4,.1,.2,1)}
.rail button{position:absolute;left:0;top:var(--y);transform:translateY(-50%);display:flex;align-items:center;gap:16px;height:36px;padding:0 14px 0 0;border-radius:12px;color:var(--ivory-2);transition:color .45s}
.rail button i{width:11px;height:11px;border-radius:50%;background:var(--black);box-shadow:inset 0 0 0 1px var(--mute);transition:background .45s,box-shadow .45s}
.rail button b{font-family:var(--serif);font-weight:500;font-size:24px;width:28px;font-variant-numeric:lining-nums tabular-nums;line-height:1}
.rail button span{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.rail button:hover{color:var(--ivory)}
.rail button[aria-pressed="true"]{color:var(--champ)}
.rail button[aria-pressed="true"] i{background:var(--champ);box-shadow:0 0 0 4px rgba(216,195,160,.18)}

/* the readout */
.read{left:var(--gl);bottom:var(--bot);max-width:420px;text-shadow:0 1px 24px rgba(0,0,0,.55);pointer-events:none}
.read .eb:empty{display:none}
.read .eb{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--champ)}
.read h1{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1.02;margin-top:12px;letter-spacing:-.005em;text-wrap:balance}
.read .d{margin-top:12px;font-size:15px;line-height:1.5;color:var(--ivory)}
.read .v{margin-top:2px;font-size:15px;line-height:1.5;color:var(--mute)}
.read>*{transition:opacity .6s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.read.swap>*{opacity:0;transform:translateY(6px)}

/* the residence stops */
.wstops{left:50%;bottom:var(--bot);transform:translateX(-50%)}

/* views */
.vpanel{left:var(--gl);top:calc(var(--top) + 68px);width:232px;max-height:calc(100% - var(--top) - 68px - var(--bot) - 70px);overflow-y:auto;scrollbar-width:none;flex-direction:column;align-items:stretch;gap:2px}
.vpanel::-webkit-scrollbar{display:none}
.vpanel.on{display:flex}
.vpanel h2{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:12px 12px 8px}
.vpanel h2:not(:first-child){margin-top:4px;border-top:1px solid var(--rule);padding-top:14px}
.vpanel .pill{justify-content:space-between;padding:0 8px 0 12px;letter-spacing:.12em}
.vpanel .pill .n{display:flex;align-items:center;gap:12px}
.vpanel .pill .k{width:20px;text-align:left;color:var(--mute);font-variant-numeric:tabular-nums;transition:color .45s}
.vpanel .pill[aria-pressed="true"] .k{color:rgba(10,10,12,.5)}
.vpanel .pill .x{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.vpanel .pill .x:hover{color:var(--ivory);background:rgba(243,238,230,.1)}
.vpanel .pill[aria-pressed="true"] .x{color:rgba(10,10,12,.55)}
.vpanel .pill .x svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.vbar{bottom:var(--bot);left:50%;transform:translateX(-50%);gap:4px}
.vbar .grp{display:flex;align-items:center;gap:4px}
.vbar .sep{width:1px;height:20px;background:var(--rule);margin:0 6px;flex:none}
.vbar .pill.ex{color:var(--champ)}
.vbar .pill.ex:hover{color:var(--ivory)}
.vbar .pill.ex.busy{pointer-events:none;color:var(--ivory)}
.vbar .pill .pc{font-variant-numeric:tabular-nums}

.toast{left:50%;top:calc(var(--top) + 64px);transform:translateX(-50%);height:40px;display:flex;align-items:center;padding:0 18px 0 calc(18px + .14em);border-radius:12px;background:var(--glass-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--rule);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;pointer-events:none}

@media (max-width:899px){
  :root{--g:16px;--top:max(16px,env(safe-area-inset-top,0px));--bot:max(16px,calc(env(safe-area-inset-bottom,0px) + 10px))}
  .mark{left:50%;transform:translateX(-50%);height:40px;font-size:19px;padding-left:.42em}
  .save{top:var(--top)}
  .save .pill{width:40px;height:40px;padding:0}
  .save .pill span{display:none}
  .save.tray{padding:0;border-radius:12px}
  .modes{top:calc(var(--top) + 52px);left:var(--gl);right:var(--gr);transform:none}
  .modes .pill{flex:1;padding:0 0 0 .1em;letter-spacing:.1em}
  .modes .pill,.wstops .pill,.vbar .pill{min-width:0}
  .rail{top:auto;left:var(--gl);right:var(--gr);bottom:var(--bot);transform:none;width:auto;height:auto;display:flex;padding:4px;gap:2px;border-radius:16px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--rule)}
  .rail .tk{display:none}
  .rail button{position:static;transform:none;flex:1;min-width:0;height:56px;padding:0;flex-direction:column;justify-content:center;gap:5px}
  .rail button i{display:none}
  .rail button b{width:auto;font-size:22px}
  .rail button span{font-size:12px;letter-spacing:.02em;text-transform:none}
  .rail button[aria-pressed="true"]{background:var(--ivory);color:var(--black)}
  .read{left:var(--gl);right:var(--gr);max-width:none;text-align:center;bottom:calc(var(--bot) + 76px)}
  .read h1{font-size:36px;margin-top:10px}
  .read .d,.read .v{font-size:14px}
  .read.walk{bottom:calc(var(--bot) + 56px)}
  .wstops{left:var(--gl);right:var(--gr);transform:none}
  .wstops .pill{flex:1;padding:0 0 0 .08em;letter-spacing:.08em}
  .vpanel{top:auto;left:var(--gl);right:var(--gr);bottom:calc(var(--bot) + 100px);width:auto;max-height:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:2px}
  .vpanel h2{display:none}
  .vpanel .pill{flex:none;padding:0 14px 0 calc(14px + .12em)}
  .vpanel .pill .k{display:none}
  .vpanel .pill .x{margin-right:-8px}
  .vbar{left:var(--gl);right:var(--gr);transform:none;flex-wrap:wrap;justify-content:center;row-gap:4px}
  .vbar .grp{display:flex;gap:2px;flex:1 1 100%}
  .vbar .grp .pill{flex:1;padding:0 0 0 .1em;letter-spacing:.1em}
  .vbar #aspects [data-a]{flex:0 0 54px}
  .vbar .sep{display:none}
  .toast{top:calc(var(--top) + 104px)}
}
@media (prefers-reduced-motion:reduce){.ui>*,.read>*,.rail .tk b{transition-duration:.01s!important}}
</style>
</head><body>

<canvas id="c" aria-label="Bascule, a 38-floor tower on the Intracoastal, in 3D"></canvas>
<div class="frame" id="frame"><i></i><i></i><i></i><i></i></div>
<div class="veil" id="veil"></div>
<div class="load" id="load"><div class="w">Bascule</div><div class="b"><i id="lbar"></i></div><p class="e">This model needs WebGL. Open it in a current version of Safari, Chrome or Firefox.</p></div>

<div class="ui" id="ui">
  <div class="mark" id="mark">Bascule</div>
  <nav class="tray modes" id="modes" aria-label="Mode">
    <button class="pill" data-m="tower" aria-pressed="true">Tower</button>

  </nav>
  <div class="tray save" id="save"><button class="pill" id="saveBtn" aria-label="Save this view"><svg viewBox="0 0 14 14"><path d="M3 1.5h8v11L7 9.8 3 12.5z"/></svg><span>Save view</span></button></div>
  <aside class="rail" id="rail" aria-label="Floors"><div class="tk"><b id="railFill"></b></div></aside>
  <section class="read" id="read" aria-live="polite"><p class="eb"></p><h1></h1><p class="d"></p><p class="v"></p></section>
  <nav class="tray wstops" id="wstops" aria-label="Rooms"></nav>
  <aside class="tray vpanel" id="vpanel" aria-label="Saved views"></aside>
  <div class="tray vbar" id="vbar">
    <div class="grp" id="passes">
      <button class="pill" data-p="render" aria-pressed="true">Render</button>
      <button class="pill" data-p="clay" aria-pressed="false">Clay</button>

      <button class="pill" data-a="1x1" aria-pressed="false">1:1</button>
      <span class="sep"></span>
      <button class="pill ex" id="exOne">Export</button>
      <button class="pill ex" id="exAll">Export all</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const clamp=x=>Math.max(0,Math.min(1,x)),sine=t=>-(Math.cos(Math.PI*t)-1)/2,lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const VIEW=(()=>{
  const rnd=s=>()=>(s=(s*16807)%2147483647)/2147483647;
  const R=rnd(4242);
  const SH=560,BK=860;                          /* Palm Beach: the shore on the Intracoastal, and the beach */
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  const css=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const HZ=hex('#E6BC9C'),ROSE=hex('#C99C98'),MAUVE=hex('#7F7C9A'),DUSK=hex('#3B4566'),HIGH=hex('#161E33'),TOP=hex('#080C17');
  const SIL=hex('#161A26'),ROOF=hex('#3A3F52');

  /* the island: houses, a few condominiums, palms and sea grape, one band deep */
  const isl=[];
  for(let X=-7000;X<7000;){const k=R(),fx=Math.abs(X);
    if(k<.075&&fx>220){const w=26+R()*34,h=28+R()*34,o={t:'c',X,D:SH+50+R()*170,w,d:22,h,win:[]};
      for(let z=3;z<h-2;z+=3.3)for(let u=.06;u<.96;u+=.11)if(R()<.42)o.win.push([u,z,R()]);isl.push(o);X+=w+40+R()*90}
    else if(k<.66){const w=12+R()*22,h=6+R()*7,o={t:'h',X,D:SH+16+R()*140,w,d:9+R()*12,h,win:[]};
      for(let z=2.2;z<h-1.5;z+=3.4)for(let u=.1;u<.92;u+=.16+R()*.1)if(R()<.4)o.win.push([u,z,R()]);isl.push(o);X+=w+5+R()*18}
    else X+=10+R()*24}
  for(let X=-7000;X<7000;X+=3+R()*8){const p=R()<.42;isl.push({t:p?'p':'g',X,D:SH+6+R()*(BK-SH-30),h:p?13+R()*11:5+R()*7,r:p?3.4+R()*1.6:4+R()*6,a:R()*6.28})}
  isl.sort((a,b)=>b.D-a.D);
  const shoreL=[];for(let X=-7000;X<7000;X+=22+R()*34)shoreL.push([X,SH+3,4+R()*2,.45+R()*.55]);
  const groundL=[];for(let i=0;i<900;i++)groundL.push([(R()-.5)*14000,SH+20+R()*(BK-SH-40),.3+R()*.7]);

  /* water: fine ripples on the Intracoastal and the ocean */
  const rip=[];for(let i=0;i<2600;i++){const D=26+(SH-26)*Math.pow(R(),1.5);rip.push([(R()-.5)*D*5.4,D,2+R()*7,R()*6.28])}
  const orip=[];for(let i=0;i<1400;i++){const D=BK*Math.pow(9000/BK,R());orip.push([(R()-.5)*D*5.4,D,6+R()*26,R()*6.28])}
  const stars=[];for(let i=0;i<90;i++)stars.push([(R()-.5)*3.4,.16+Math.pow(R(),.8)*.9,R(),R()*6.28]);
  const clouds=[[-.62,.045,.42,.012],[.08,.07,.5,.01],[.5,.032,.36,.009],[-.15,.11,.3,.008],[.82,.085,.4,.01],[-1.1,.06,.5,.011],[1.25,.05,.45,.01]];

  /* the bascule bridge: leaves the near shore to the north and runs out to the island */
  const N0=[-150,30],N1=[-64,SH-6],BL=Math.hypot(N1[0]-N0[0],N1[1]-N0[1]),U=[(N1[0]-N0[0])/BL,(N1[1]-N0[1])/BL],PV=[U[1],-U[0]];
  const H1=292,H2=338,DECK=10.6,HW=9;
  const bAt=s=>[N0[0]+U[0]*s,N0[1]+U[1]*s];

  /* marina: two docks, yachts moored on their far side */
  const boats=[];for(const [dk,ox] of [[64,0],[104,30]]){let X=-180+ox*R();while(X<180){const len=13+R()*16;boats.push({X,D:dk+3,len,hs:1.9+len*.05,dir:R()<.5?1:-1,fly:len>21,lit:R()});X+=len+9+R()*16}}
  const palms=[{X:-15,D:33,h:22.4,a:.2},{X:6.5,D:40,h:20.6,a:1.4},{X:18,D:34,h:23.2,a:2.6},{X:-29,D:37,h:21,a:3.1},{X:32,D:41,h:20,a:4.4},{X:-4,D:47,h:19.5,a:5.1}];
  const markers=[[-30,210,0],[40,300,1],[-10,420,0],[95,470,1],[150,250,0]];

  function draw(c,W,H,o){
    const {alt,f,hy,cx,t,cyl}=o,open=o.open||0,sail=o.sail||0,dpr=o.dpr||1;
    c.setTransform(dpr,0,0,dpr,0,0);
    const rr=(X,D)=>cyl?Math.hypot(X,D):D;
    const sx=(X,D)=>cyl?cx+f*Math.atan2(X,D):cx+f*X/D;
    const sy=(X,D,Z)=>hy+f*(alt-Z)/rr(X,D);
    const dip=f*Math.sqrt(2*alt/6.371e6),hz=hy+dip;
    const ang=x=>(x-cx)/f;                       /* screen x to direction */
    const skyX=a=>cyl?cx+f*a:cx+f*Math.tan(a);
    /* sky */
    let g=c.createLinearGradient(0,hy-f*.62,0,hz);
    g.addColorStop(0,css(TOP));g.addColorStop(.42,css(HIGH));g.addColorStop(.7,css(DUSK));g.addColorStop(.86,css(MAUVE));g.addColorStop(.95,css(ROSE));g.addColorStop(1,css(HZ));
    c.fillStyle=g;c.fillRect(0,0,W,hz+1);
    /* stars */
    for(const [a,e,b,ph] of stars){const x=skyX(a),y=hy-f*e;if(x<0||x>W||y<0)continue;const k=(.35+.65*b)*(.7+.3*Math.sin(t*.0011+ph))*Math.min(1,e*3.2-.4);c.fillStyle=`rgba(236,232,224,${(k*.75).toFixed(3)})`;c.fillRect(x,y,b>.85?1.6:1,b>.85?1.6:1)}
    /* moon rising over the ocean, and its halo */
    const ma=.1,me=.058,mx=skyX(ma),my=hy-f*me,mr=Math.max(5,f*.0105);
    g=c.createRadialGradient(mx,my,0,mx,my,mr*14);g.addColorStop(0,'rgba(255,236,206,.42)');g.addColorStop(.25,'rgba(240,210,190,.12)');g.addColorStop(1,'rgba(240,210,190,0)');
    c.fillStyle=g;c.fillRect(mx-mr*14,my-mr*14,mr*28,mr*28);
    /* low cloud, lit from beneath by the set sun behind you */

let dl=null;(async()=>{try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){dl=null}if(!dl){$('#exOne').hidden=true;$('#exAll').hidden=true}})();

function snap(v,ps,w,h){ecam.position.set(...v.pos);ecam.fov=v.fov;ecam.aspect=w/h;ecam.lookAt(V(...v.look));ecam.updateProjectionMatrix();

      for(const ps of PASSES){btn.innerHTML=`<span class="pc">${++n} / ${tot}</span>`;await new Promise(r=>requestAnimationFrame(r));dir.file(`${base}_${ps}.png`,await snap(v,ps,w,h))}}

/* ---------- the loop ---------- */
let tp=0,t0=0;const fw=V(0,0,0),rt=V(0,0,0);
const INTRO=RM?0:3400;
let exporting=false;
function frame(n){requestAnimationFrame(frame);if(exporting){tp=n;return}const dt=Math.min(64,n-(tp||n));tp=n;
  if(mode==='intro'){const t=n-t0,k=clamp(t/INTRO||1),e=1-Math.pow(1-k,3);
    Wd.setFloors(RM?N+1:(N+1)*sine(clamp((t-150)/2350)));Wd.setLit(Math.round(SOLD*sine(clamp((t-1500)/2000))),t);
    const nf=innerWidth<innerHeight,a1=-.55,a=a1-.5+.5*e,r=lerp(nf?78:60,nf?131:106.7,e)*1,yy=lerp(.55,7,Math.pow(e,1.25)),l=lerp(10.5,19,e);
    place(V(Math.sin(a)*r*Math.cos(0),yy,Math.cos(a)*r),V(0,l,0),towerFov());
    if(k>=1){Wd.setFloors(N+1);Wd.setLit(SOLD,1e6);Object.assign(orb,orbFrom(camera.position,look));Object.assign(goal,orb);mode='tower';syncUI()}}
  else if(move){move.t+=dt;const k=clamp(move.t/move.dur);move.step(k);if(k>=1){const m=move;move=null;m.done();if(mode!=='views')syncUI()}}
  else if(mode==='tower'){idle+=dt;if(idle>9000&&tier<0&&!RM)goal.az+=dt*.000022;
    const f=1-Math.exp(-dt/tau);orb.az+=(goal.az-orb.az)*f;orb.el+=(goal.el-orb.el)*f;orb.dist+=(goal.dist-orb.dist)*f;orb.ty+=(goal.ty-orb.ty)*f;orb.tx+=(goal.tx-orb.tx)*f;orb.tz+=(goal.tz-orb.tz)*f;
    if(tau<650)tau=Math.min(650,tau+dt*.4);
    const p=orbPos(orb);if(p.y<.45)p.y=.45;place(p,V(orb.tx,orb.ty,orb.tz),lerp(fovC,towerFov(),1-Math.exp(-dt/400)))}
  else if(mode==='walk'){
    if(glide){glide.t+=dt;const k=clamp(glide.t/glide.dur),e=sine(k);me.x=lerp(glide.a.x,glide.b.x,e);me.z=lerp(glide.a.z,glide.b.z,e);me.yaw=lerp(glide.a.yaw,glide.b.yaw,e);me.pitch=lerp(glide.a.pitch,glide.b.pitch,e);if(k>=1)glide=null}
    let f=0,s=0;if(keys.has('w')||keys.has('arrowup'))f++;if(keys.has('s')||keys.has('arrowdown'))f--;if(keys.has('d'))s++;if(keys.has('a'))s--;
    if(keys.has('arrowleft')||keys.has('q'))me.yaw+=dt*.0016;if(keys.has('arrowright')||keys.has('e'))me.yaw-=dt*.0016;
    if(f||s){glide=null;if(roomId){roomId=null;syncUI()}const sp=dt*.0014,dx=(Math.sin(me.yaw)*f-Math.cos(me.yaw)*s)*sp,dz=(Math.cos(me.yaw)*f+Math.sin(me.yaw)*s)*sp;
      if(free(me.x+dx,me.z))me.x+=dx;if(free(me.x,me.z+dz))me.z+=dz}
    place(mePos(),meLook(),lerp(fovC,walkFov(),1-Math.exp(-dt/400)))}
  /* the band */
  ringY+=(ringGoalY-ringY)*(1-Math.exp(-dt/520));ringO+=((mode==='tower'?ringGoalO:0)-ringO)*(1-Math.exp(-dt/300));
  ring.position.set(0,ringY,0);ring.rotation.y=ringY*TW;ring.mat.opacity=ringO;ring.visible=ringO>.01;
  if(tapT>0){const k=(n-tapT)/1100;tapM.visible=k<1;tapM.material.opacity=.85*(1-k);tapM.scale.setScalar(1+k*.6);if(k>=1)tapT=-1}
  camera.aspect=vrect?vrect[2]/vrect[3]:innerWidth/innerHeight;
  env(camera.position,camera,n);
  draw(camera,mode==='views'?pass:'render',vrect)}

buildPanel();

  if(location.hash==='#residence'){Wd.setFloors(N+1);Wd.setLit(SOLD,1e6);const r=ROOMS[0];Object.assign(me,{x:r.x,z:r.z,yaw:r.yaw,pitch:r.pitch});place(mePos(),meLook(),walkFov());mode='walk';syncUI()}

function flyFrames(n=15,fov=45){const L=(d,y)=>O.clone().add(V(-.24,0,0)).addScaledVector(dg,d).setY(y),W=(x,y,z)=>toFloor(V(x,y,z));
