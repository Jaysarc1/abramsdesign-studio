<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0;padding:0}</style>
<title>Baila con Destany</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Bellota+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: Barragán walls. Full-bleed planes of flat Mexican colour stacked like courtyard walls,
   strung with papel picado; lotería cards for classes; a Talavera tile floor for the step game. */
:root{
  --rosa:#D81E7A; --rosa-hi:#F39AC4; --rosa-ink:#5E0C34; --rosa-soft:#F7B6D2;
  --cempa:#F4A300; --cempa-deep:#C97700;
  --talavera:#1C3A96; --talavera-ink:#0E2160; --azulejo:#F6F8FD;
  --nopal:#2E6E4A; --nopal-hi:#5C9C76;
  --buganvilia:#6E2A82;
  --cacao:#2A1216; --cacao-2:#3B1D22; --cacao-3:#5A3138;
  --cal:#FBE6E6; --blanco:#FFF9F6;
  --display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --body:"Bellota Text","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:12px;
  --ease:cubic-bezier(.2,.7,.15,1);
  color-scheme:light;
}
*{box-sizing:border-box}
/* Bodoni Moda's optical size follows font size; cap it so display hairlines stay visible (phones pin lower, below) */
*,*::before,*::after{font-optical-sizing:none;font-variation-settings:"opsz" 22}
html{scroll-behavior:smooth}
body{background:var(--cacao);color:var(--cacao);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rosa-hi)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wall{position:relative;padding-block:clamp(64px,8vw,104px)}
:focus-visible{outline:3px solid var(--cempa);outline-offset:3px;border-radius:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:var(--r);border:1.5px solid transparent;font-weight:700;font-size:15px;letter-spacing:.04em;text-decoration:none;cursor:pointer;transition:transform .35s var(--ease),background .35s,color .35s,border-color .35s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}

/* credit band */
.credit{display:block;text-align:center;background:var(--rosa-hi);color:var(--rosa-ink);font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px))}
.credit:hover{text-decoration:underline;text-underline-offset:3px}

/* papel picado */
.picado{position:relative;display:flex;justify-content:center;gap:var(--pg,10px);height:var(--ph,120px);pointer-events:none}
.picado::before{content:"";position:absolute;left:0;right:0;top:3px;height:2px;background:var(--cord,rgba(255,249,246,.75))}
.flag{width:var(--fw,64px);flex:none;transform-origin:50% 0;animation:sway var(--dur,4.6s) ease-in-out var(--del,0s) infinite alternate}
.flag svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(42,18,22,.18))}
.flag.drop{animation:drop 1.4s var(--ease) var(--in,0s) both, sway var(--dur,4.6s) ease-in-out calc(var(--in,0s) + 1.4s) infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--amp,2.4deg) * -1))}to{transform:rotate(var(--amp,2.4deg))}}
@keyframes drop{from{transform:translateY(-110%) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}

/* header + hero */
.hero{background:var(--rosa);overflow:hidden;color:var(--blanco)}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:22px 0;position:relative;z-index:3}
.mark{font-family:var(--display);font-style:italic;font-weight:600;font-size:26px;letter-spacing:-.01em;text-decoration:none;color:var(--blanco);line-height:1}
.mark b{font-style:normal;font-weight:500;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-family:var(--body);display:block;margin-top:6px;color:var(--rosa-soft)}
.nav{display:flex;align-items:center;gap:30px}
.nav a{font-size:14px;font-weight:700;letter-spacing:.08em;text-decoration:none;color:var(--blanco)}
.nav a:not(.btn){position:relative}
.nav a:not(.btn)::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--cempa);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.nav a:not(.btn):hover::after{transform:scaleX(1)}
.nav .btn{min-height:44px;background:var(--blanco);color:var(--rosa-ink)}
.hero .picado{margin-top:18px;--ph:clamp(78px,9vw,118px);--fw:clamp(44px,5.4vw,70px)}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;align-items:end;gap:24px;position:relative}
.hero-copy{padding-block:clamp(16px,3vw,40px) clamp(64px,8vw,112px);position:relative;z-index:2}
.hero h1{font-size:clamp(76px,12.4vw,182px);line-height:.84;font-style:italic;font-weight:500;letter-spacing:-.035em}
.hero h1 span{display:block}
.hero h1 .l2{color:var(--cacao);padding-left:.42em}
.hero-sub{margin-top:30px;max-width:30em;font-size:19px;line-height:1.55;color:var(--blanco)}
.hero-sub strong{font-weight:700}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.cta .b1{background:var(--cacao);color:var(--blanco)}
.cta .b1:hover{background:var(--cacao-2)}
.cta .b2{border-color:rgba(255,249,246,.8);color:var(--blanco);background:transparent}
.cta .b2:hover{background:rgba(255,249,246,.12)}
.stage{position:relative;height:clamp(520px,50vw,660px);align-self:end}
.sun{position:absolute;left:50%;top:6%;width:min(88%,470px);aspect-ratio:1;border-radius:50%;background:var(--cempa);transform:translateX(-50%)}
.sun::after{content:"";position:absolute;inset:9%;border-radius:50%;border:2px solid rgba(255,249,246,.55)}
.stairs{position:absolute;left:-2%;bottom:0;width:62%;height:44%;background:var(--talavera);clip-path:polygon(0 100%,0 66%,25% 66%,25% 44%,50% 44%,50% 22%,75% 22%,75% 0,100% 0,100% 100%)}
.wallv{position:absolute;right:-4%;bottom:0;width:26%;height:72%;background:var(--buganvilia)}
.photo{position:absolute;bottom:0;left:50%;height:96%;width:auto;max-width:none;transform:translateX(-50%);z-index:1;filter:drop-shadow(0 30px 40px rgba(42,18,22,.28))}

/* load sequence */
.ld{animation:rise 1.3s var(--ease) var(--d,0s) both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.sun.ld{animation:sunup 1.8s var(--ease) .2s both}
@keyframes sunup{from{opacity:0;transform:translateX(-50%) translateY(40%) scale(.7)}to{opacity:1;transform:translateX(-50%)}}
.photo.ld{animation:photoin 1.6s var(--ease) .55s both}
@keyframes photoin{from{opacity:0;transform:translateX(-50%) translateY(6%)}to{opacity:1;transform:translateX(-50%)}}
.stairs.ld,.wallv.ld{animation:slab 1.5s var(--ease) var(--d,.35s) both}
@keyframes slab{from{transform:translateY(100%)}to{transform:none}}

/* scroll reveals: visible at rest, only below-the-fold items are primed by script */
[data-reveal].pre{opacity:0;transform:translateY(34px)}
[data-reveal].rv{transition:opacity 1.2s var(--ease) var(--d,0s),transform 1.2s var(--ease) var(--d,0s)}

/* section heads */
.head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;margin-bottom:clamp(36px,4vw,52px)}
.head h2{font-size:clamp(52px,7.4vw,104px);line-height:.9;font-style:italic;letter-spacing:-.03em}
.head p{max-width:24em;font-size:18px}

/* classes / lotería */
.classes{background:var(--cempa)}
.classes .head h2{color:var(--cacao)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{position:relative;background:var(--blanco);border-radius:var(--r);padding:12px;box-shadow:0 18px 40px -22px rgba(90,40,0,.55);display:flex;flex-direction:column;transition:transform .6s var(--ease)}
.card:hover{transform:translateY(-4px) rotate(-.4deg)}
.card-in{border:1.5px solid var(--cacao);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px;flex:1}
.card-top{display:flex;justify-content:space-between;align-items:baseline}
.num{font-family:var(--display);font-weight:700;font-size:44px;line-height:.8;font-variant-numeric:lining-nums}
.dow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.art{position:relative;border-radius:4px;aspect-ratio:5/4;display:grid;place-items:center;overflow:hidden}
.art svg{width:68%;height:auto;overflow:visible}
.art.banda{background:var(--rosa)}
.art.cumbia{background:var(--nopal)}
.art.salsa{background:var(--talavera)}
.art::after{content:"";position:absolute;inset:7px;border:1px solid rgba(255,249,246,.45);border-radius:2px;pointer-events:none}
.name{font-family:var(--display);font-style:italic;font-size:30px;line-height:1;text-align:center;border-top:1.5px solid var(--cacao);border-bottom:1.5px solid var(--cacao);padding:10px 0 12px}
.meta{display:grid;gap:4px;text-align:center}
.meta .when{font-weight:700;font-size:17px}
.meta .what,.meta .where{font-size:15px}
.meta .where{color:#6B3B42}
.signups{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.signups.one{grid-template-columns:1fr}
.signups .btn{min-height:46px;padding:0 10px;font-size:13px;background:var(--cacao);color:var(--blanco)}
.signups .btn.alt{background:transparent;border-color:var(--cacao);color:var(--cacao)}
.signups .btn.alt:hover{background:var(--cacao);color:var(--blanco)}
.badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--rosa);color:var(--blanco);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:var(--r);white-space:nowrap;z-index:2}
.card.past{opacity:.55}
.card.past .badge{background:var(--cacao-3)}
.venues{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.venue{display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1.5px solid var(--cacao);padding-top:18px}
.venue h3{font-size:26px;font-style:italic}
.venue p{font-size:15px;user-select:text}
.venue .btn{min-height:44px;font-size:13px;border-color:var(--cacao);color:var(--cacao);flex:none}
.venue .btn:hover{background:var(--cacao);color:var(--cempa)}

/* welcome */
.welcome{background:var(--blanco);text-align:center;padding-block:clamp(56px,7vw,88px)}
.rebozo{position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,var(--rosa) 0 18px,var(--cempa) 18px 24px,var(--talavera) 24px 34px,var(--blanco) 34px 37px,var(--nopal) 37px 46px,var(--rosa-soft) 46px 52px,var(--buganvilia) 52px 60px,var(--blanco) 60px 63px)}
.rebozo.t{top:0}.rebozo.b{bottom:0}
.welcome h2{font-size:clamp(46px,7vw,96px);font-style:italic;color:var(--rosa);line-height:.95;letter-spacing:-.03em}
.welcome p{max-width:34em;margin:22px auto 0;font-size:19px}

/* game */
.learn{background:var(--talavera);color:var(--blanco)}
.learn .head h2{color:var(--blanco)}
.learn .head p{color:#DCE3FA}
.game{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,5vw,72px);align-items:center}
.panel{display:grid;gap:26px;min-width:0}
.ctl{display:grid;gap:10px}
.ctl .label{color:#B9C6F2}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:46px;padding:0 18px;border-radius:var(--r);border:1.5px solid rgba(246,248,253,.35);background:transparent;color:var(--blanco);font-weight:700;font-size:14px;letter-spacing:.03em;cursor:pointer;transition:background .35s,border-color .35s,color .35s}
.seg button:hover{border-color:var(--azulejo)}
.seg button[aria-pressed="true"]{background:var(--azulejo);color:var(--talavera-ink);border-color:var(--azulejo)}
.seg.steps button[aria-pressed="true"]{background:var(--cempa);border-color:var(--cempa);color:var(--cacao)}
.tip{font-size:16px;color:#E7ECFC;max-width:30em;min-height:3.1em}
.go{display:grid;justify-items:center;gap:10px}
.go .btn{background:var(--rosa);color:var(--blanco);min-width:180px}
.go .btn.stop{background:var(--blanco);color:var(--talavera-ink)}
.score{font-size:15px;color:#DCE3FA;font-variant-numeric:tabular-nums;min-height:1.4em}
.board{display:grid;justify-items:center;gap:18px;min-width:0}
.floor{position:relative;display:grid;gap:6px;padding:10px;background:#DCE2F4;border-radius:var(--r);box-shadow:0 30px 60px -30px rgba(5,14,50,.9),inset 0 0 0 1px rgba(14,33,96,.15);touch-action:manipulation;--tile:clamp(84px,9.4vw,124px)}
.tile{width:var(--tile);height:var(--tile);border:0;padding:0;border-radius:3px;background:var(--azulejo) var(--talav) center/100% 100%;cursor:pointer;position:relative;transition:transform .25s var(--ease),box-shadow .35s}
.tile:active{transform:scale(.97)}
.tile.target{box-shadow:0 0 0 4px var(--cempa),0 0 28px 6px rgba(244,163,0,.65);animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 3px var(--cempa),0 0 14px 2px rgba(244,163,0,.45)}to{box-shadow:0 0 0 5px var(--cempa),0 0 30px 8px rgba(244,163,0,.75)}}
.tile.flash{box-shadow:0 0 0 4px var(--rosa)}
.tile.nope{animation:nope .4s}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ring{position:absolute;inset:-12px;border:3px solid var(--cempa);border-radius:10px;pointer-events:none;opacity:0}
.ring.run{animation:ring var(--rt,.6s) linear forwards}
@keyframes ring{from{opacity:.95;transform:scale(1.3)}to{opacity:.95;transform:scale(.86)}}
.foot{position:absolute;left:0;top:0;width:calc(var(--tile) * .36);pointer-events:none;transition:transform .32s var(--ease),opacity .3s;z-index:2}
.foot svg{display:block;width:100%;height:auto;overflow:visible}
.foot .sole{transition:fill .3s}
.foot.L .sole{fill:var(--rosa)}
.foot.R .sole{fill:var(--cempa-deep)}
.foot .heel,.foot .toe{fill:var(--blanco);opacity:0;transition:opacity .2s}
.foot.heel .heel,.foot.toe .toe{opacity:.95}
.foot .tag{font-family:var(--body);font-weight:700;font-size:18px;fill:var(--blanco)}
.foot.ghost{opacity:0;z-index:1}
.foot.ghost.show{opacity:.42}
.counts{display:flex;gap:6px}
.counts span{width:38px;height:38px;display:grid;place-items:center;border-radius:var(--r);font-family:var(--display);font-weight:700;font-size:18px;color:#B9C6F2;border:1.5px solid rgba(246,248,253,.22);transition:background .2s,color .2s,transform .2s}
.counts span.rest{border-style:dashed;color:rgba(185,198,242,.6)}
.counts span.on{background:var(--cempa);color:var(--cacao);border-color:var(--cempa);transform:translateY(-3px)}
.say{min-height:30px;text-align:center;font-family:var(--display);font-style:italic;font-size:24px;line-height:1.2;color:var(--blanco)}
.say small{display:block;font-family:var(--body);font-style:normal;font-size:15px;color:#DCE3FA}
.pop{animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.85);opacity:.2}to{transform:none;opacity:1}}

/* story */
.story{background:var(--cal)}
.story .head h2{color:var(--buganvilia)}
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;position:relative}
.timeline::before{content:"";position:absolute;left:0;right:0;top:34px;height:2px;background:var(--rosa-soft)}
.era{position:relative;display:grid;gap:12px;align-content:start;min-width:0}
.era .yr{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--rosa);background:var(--cal);justify-self:start;padding-right:14px;position:relative}
.era .yr::after{content:"";position:absolute;right:-2px;top:28px;width:10px;height:10px;border-radius:50%;background:var(--rosa)}
.era h3{font-size:22px;font-style:italic;line-height:1.15}
.era p{font-size:16px;color:#4A2A30}
.band{margin-top:clamp(44px,5vw,64px);display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;border-top:1.5px solid var(--rosa-soft);padding-top:28px}
.band h3{font-size:28px;font-style:italic;color:var(--buganvilia)}
.band h3 small{display:block;font-family:var(--body);font-style:normal;font-size:15px;color:#4A2A30;margin-top:6px}
.inst{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.inst button{display:grid;gap:2px;justify-items:start;text-align:left;padding:14px 14px 13px;border-radius:var(--r);border:1.5px solid var(--buganvilia);background:transparent;color:var(--buganvilia);cursor:pointer;transition:background .35s,color .35s,transform .35s var(--ease)}
.inst button b{font-family:var(--display);font-style:italic;font-weight:600;font-size:19px;line-height:1.1}
.inst button span{font-size:13px;color:#4A2A30;transition:color .35s}
.inst button:hover,.inst button.hit{background:var(--buganvilia);color:var(--blanco)}
.inst button:hover span,.inst button.hit span{color:#EBD7F1}
.inst button.hit{transform:translateY(-3px)}

/* avisos */
.news{background:var(--nopal);color:var(--blanco)}
.news .head h2{color:var(--blanco)}
.news .head p{color:#DCEBDF}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.note{background:var(--blanco);color:var(--cacao);border-radius:var(--r);padding:26px 24px 24px;display:grid;gap:10px;position:relative;overflow:hidden}
.note::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c,var(--rosa))}
.note .label{color:var(--c2,var(--rosa))}
.note h3{font-size:26px;font-style:italic;line-height:1.1}
.note p{font-size:16px;color:#4A2A30}

/* reserve */
.reserve{background:var(--cacao);color:var(--blanco)}
.res{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(28px,5vw,72px);align-items:start}
.res h2{font-size:clamp(52px,7.4vw,104px);font-style:italic;line-height:.9;letter-spacing:-.03em;color:var(--rosa-soft)}
.res .lead{margin-top:20px;font-size:18px;color:#EAD8DA;max-width:24em}
form{display:grid;gap:18px}
.field{display:grid;gap:8px}
.field label,.fs legend{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#D9B7BD}
.field input,.field textarea{width:100%;min-height:52px;padding:14px 16px;border-radius:var(--r);border:1.5px solid var(--cacao-3);background:var(--cacao-2);color:var(--blanco);font-size:16px}
.field textarea{min-height:120px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#9C7A80}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--rosa-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fs{border:0;padding:0;margin:0;display:grid;gap:10px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{position:relative}
.pick input{position:absolute;opacity:0;inset:0;cursor:pointer}
.pick span{display:grid;gap:2px;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--cacao-3);background:var(--cacao-2);transition:border-color .3s,background .3s}
.pick b{font-family:var(--display);font-style:italic;font-weight:600;font-size:20px}
.pick small{font-size:13px;color:#D9B7BD}
.pick input:checked+span{border-color:var(--rosa-soft);background:#4A2329;box-shadow:inset 0 0 0 1px var(--rosa-soft)}
.pick input:focus-visible+span{outline:3px solid var(--cempa);outline-offset:2px}
.pick.past{opacity:.45}
.check{display:flex;align-items:center;gap:12px;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--rosa)}
.submit{background:var(--rosa);color:var(--blanco);width:100%}
.done{display:grid;gap:16px;padding:26px;border-radius:var(--r);background:var(--cacao-2);border:1.5px solid var(--cacao-3)}
.done h3{font-size:34px;font-style:italic;color:var(--rosa-soft)}
.sum{display:grid;gap:8px;font-size:16px}
.sum div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--cacao-3);padding-bottom:8px}
.sum dt{color:#D9B7BD}
.sum dd{margin:0;font-weight:700;text-align:right}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay .btn{background:var(--blanco);color:var(--cacao)}
.pay .btn.alt{background:transparent;border-color:var(--cacao-3);color:var(--blanco)}

/* faq */
.faq{background:var(--cal)}
.faq .head h2{color:var(--rosa)}
.faq-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,5vw,72px);align-items:start}
.qs{display:grid}
details{border-top:1.5px solid var(--rosa-soft)}
details:last-child{border-bottom:1.5px solid var(--rosa-soft)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;font-family:var(--display);font-size:23px;font-weight:500;line-height:1.25}
summary::-webkit-details-marker{display:none}
summary i{flex:none;width:30px;height:30px;border-radius:var(--r);border:1.5px solid var(--rosa);position:relative}
summary i::before,summary i::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;background:var(--rosa);transform:translate(-50%,-50%);transition:transform .4s var(--ease)}
summary i::after{transform:translate(-50%,-50%) rotate(90deg)}
details[open] summary i::after{transform:translate(-50%,-50%) rotate(0)}
.ans{padding:0 0 24px;display:grid;gap:14px;justify-items:start;font-size:17px;max-width:36em}
.ask-btn{min-height:42px;font-size:13px;border-color:var(--rosa);color:var(--rosa);background:transparent}
.ask-btn:hover{background:var(--rosa);color:var(--blanco)}
.ask{background:var(--blanco);border-radius:var(--r);padding:clamp(22px,3vw,32px);display:grid;gap:18px;box-shadow:0 24px 50px -30px rgba(94,12,52,.45)}
.ask h3{font-size:34px;font-style:italic;color:var(--rosa)}
.ask .field label{color:#8A4A5E}
.ask .field input,.ask .field textarea{background:var(--cal);border-color:#EFC6D3;color:var(--cacao)}
.ask .field input::placeholder,.ask .field textarea::placeholder{color:#A9808C}
.ask .field input:focus,.ask .field textarea:focus{border-color:var(--rosa)}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics button{min-height:40px;padding:0 14px;border-radius:var(--r);border:1.5px solid #EFC6D3;background:transparent;color:#8A4A5E;font-weight:700;font-size:13px;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.topics button[aria-pressed="true"]{background:var(--rosa);border-color:var(--rosa);color:var(--blanco)}
.ask .submit{background:var(--cacao)}
.thanks{font-family:var(--display);font-style:italic;font-size:28px;color:var(--rosa)}

/* footer */
.foot-wall{background:var(--rosa);color:var(--blanco);text-align:center;overflow:hidden}
.foot-wall .picado{--ph:clamp(64px,7vw,92px);--fw:clamp(38px,4.4vw,56px)}
.fin{padding-block:30px 56px;display:grid;gap:18px;justify-items:center}
.fin .big{font-family:var(--display);font-style:italic;font-size:clamp(48px,7vw,92px);line-height:.95;letter-spacing:-.03em}
.fin p{font-size:16px;color:#FFE3EF}
.fin nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px}
.fin nav a{font-weight:700;font-size:14px;letter-spacing:.08em;text-decoration:none}
.fin nav a:hover{text-decoration:underline;text-underline-offset:4px}

/* sound toggle */
.mute{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--r);border:0;background:var(--cacao);color:var(--blanco);font-weight:700;font-size:13px;letter-spacing:.06em;cursor:pointer;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);transition:opacity .5s,transform .5s var(--ease)}
.mute[hidden]{display:none}
.mute svg{width:18px;height:18px}
.mute .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.mute .bars i{width:3px;background:var(--cempa);border-radius:1px;animation:eq .9s ease-in-out infinite alternate}
.mute .bars i:nth-child(2){animation-delay:.2s}.mute .bars i:nth-child(3){animation-delay:.45s}
.mute.off .bars i{animation:none;height:3px!important;background:#9C7A80}
@keyframes eq{from{height:3px}to{height:14px}}

/* tablet */
@media (max-width:1040px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .inst{grid-template-columns:repeat(3,minmax(0,1fr))}
  .band{grid-template-columns:1fr}
  .timeline{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:40px}
  .timeline::before{display:none}
}
/* phone: centred by default */
@media (max-width:760px){
  /* Bodoni Moda's optical size follows font size, so big type gets hairlines too thin for a phone; pin a text-size cut */
  *,*::before,*::after{font-optical-sizing:none;font-variation-settings:"opsz" 14}
  body{font-size:16px}
  .wrap{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .top{justify-content:center;padding-top:20px}
  .mark{text-align:center}
  .nav{display:none}
  .hero .picado{margin-top:16px}
  .hero-grid{grid-template-columns:1fr;gap:0}
  .hero-copy{text-align:center;padding-block:8px 34px}
  .hero h1 .l2{padding-left:0}
  .hero-sub{margin-inline:auto;font-size:17px;margin-top:22px}
  .cta{justify-content:center;margin-top:26px}
  .cta .btn{flex:1 1 100%;max-width:340px}
  .stage{height:430px;width:100%}
  .sun{width:min(86%,360px);top:4%}
  .head{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px}
  .head p{margin-inline:auto;font-size:17px}
  .cards{grid-template-columns:minmax(0,360px);justify-content:center;gap:28px}
  .art{aspect-ratio:2/1}
  .venues{grid-template-columns:1fr;justify-items:center;max-width:360px;margin-inline:auto}
  .venue{flex-direction:column;text-align:center;gap:12px;width:100%}
  .welcome p{font-size:17px}
  .game{grid-template-columns:1fr}
  .panel{justify-items:center;text-align:center;gap:22px}
  .seg{justify-content:center}
  .seg button{padding:0 13px}
  .tip{margin-inline:auto;min-height:0}
  .board{order:-1}
  .counts span{width:32px;height:32px;font-size:16px}
  .timeline{grid-template-columns:1fr;justify-items:center;text-align:center;max-width:420px;margin-inline:auto}
  .era{justify-items:center}
  .era .yr{justify-self:center;padding:0 14px}
  .era .yr::after{display:none}
  .band{justify-items:center;text-align:center}
  .inst{grid-template-columns:repeat(2,minmax(0,1fr));width:100%;max-width:420px}
  .inst button{justify-items:center;text-align:center}
  .notes{grid-template-columns:1fr;max-width:420px;margin-inline:auto}
  .note{text-align:center;justify-items:center}
  .res,.faq-grid{grid-template-columns:1fr}
  .res>div:first-child{text-align:center}
  .res .lead{margin-inline:auto}
  .row2,.picks{grid-template-columns:1fr}
  .pick span{text-align:center}
  .check{justify-content:center}
  .done{text-align:center}
  summary{font-size:20px}
  .ask{text-align:center}
  .topics{justify-content:center}
  .ans{justify-items:center;text-align:center;margin-inline:auto}
  .mute{width:44px;padding:0;justify-content:center}
  .mute #muteLbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}
@media (max-width:380px){
  .floor{--tile:78px}
  .counts span{width:29px;height:29px}
}
/* ---------- her books: Las cuentas ---------- */
body.books-open>.hero,body.books-open>main,body.books-open>.foot-wall{display:none}
.books[hidden]{display:none}
.books{background:var(--cal);min-height:100vh;font-variant-numeric:lining-nums tabular-nums}
.bk-top{background:var(--rosa);color:var(--blanco);overflow:hidden}
.bk-top .picado{--ph:clamp(58px,6vw,84px);--fw:clamp(34px,4vw,52px);margin-top:12px}
.bk-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px}
.bk-back{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:700;letter-spacing:.08em;text-decoration:none;color:var(--blanco)}
.bk-back svg{width:18px;height:18px;transition:transform .4s var(--ease)}
.bk-back:hover svg{transform:translateX(-4px)}
.bk-sample{display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1.5px solid rgba(255,249,246,.55);background:transparent;color:var(--blanco);font-weight:700;font-size:13px;letter-spacing:.06em;cursor:pointer}
.bk-sample i{width:34px;height:20px;border-radius:10px;background:rgba(255,249,246,.3);position:relative;transition:background .35s}
.bk-sample i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--blanco);transition:transform .35s var(--ease)}
.bk-sample[aria-pressed="true"] i{background:var(--cempa)}
.bk-sample[aria-pressed="true"] i::after{transform:translateX(14px)}
.bk-head{padding-block:clamp(20px,3vw,36px) clamp(48px,6vw,80px);display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px}
.bk-head h1{font-size:clamp(64px,10vw,150px);line-height:.86;font-style:italic;letter-spacing:-.035em}
.bk-head h1 span{color:var(--cacao)}
.bk-head p{font-size:18px;max-width:22em;color:#FFE3EF;text-align:right}
.bk-head p b{display:block;font-family:var(--display);font-style:italic;font-weight:600;font-size:28px;color:var(--blanco);line-height:1.1;margin-bottom:6px}

.bk-sum{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:18px;margin-top:-36px;position:relative;z-index:2}
.tot{border-radius:var(--r);padding:22px 24px 24px;display:grid;gap:6px;box-shadow:0 22px 40px -26px rgba(42,18,22,.55);position:relative;overflow:hidden}
.tot .label{opacity:.85}
.tot h2{font-size:clamp(34px,3.4vw,46px);font-style:italic;font-weight:600;line-height:1}
.tot .amt{font-family:var(--display);font-weight:500;font-size:clamp(40px,4.6vw,64px);line-height:1;letter-spacing:-.02em;margin-top:10px}
.tot.in{background:var(--nopal);color:var(--blanco)}
.tot.out{background:var(--rosa-ink);color:var(--blanco)}
.tot.kept{background:var(--cempa);color:var(--cacao)}
.tot.kept::after{content:"";position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;background:var(--talav) 0 0/65px 65px;border-radius:50%;opacity:.9}
.tot.kept .amt{font-size:clamp(48px,5.6vw,80px)}
.bk-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 40px;padding:30px 0 6px;color:var(--rosa-ink)}
.bk-stats div{display:flex;align-items:baseline;gap:10px;font-size:15px}
.bk-stats b{font-family:var(--display);font-size:30px;font-weight:600;color:var(--cacao)}

.bk-sec{padding-block:clamp(48px,6vw,80px)}
.bk-h{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
.bk-h h2{font-size:clamp(40px,5vw,68px);font-style:italic;line-height:.95;letter-spacing:-.025em}
.bk-h p{font-size:16px;color:var(--rosa-ink);max-width:24em;text-align:right}
.key{display:flex;gap:18px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--rosa-ink)}
.key span{display:inline-flex;align-items:center;gap:8px}
.key i{width:14px;height:10px;border-radius:3px;background:var(--c)}

.crow{display:grid;grid-template-columns:76px minmax(0,1.1fr) minmax(0,1.4fr) 120px;align-items:center;gap:24px;padding:20px 24px;background:var(--blanco);border-radius:var(--r);margin-bottom:12px;box-shadow:0 1px 0 #EFC6D3}
.cnum{width:76px;height:96px;border-radius:8px;background:var(--talav) 0 0/38px 38px;display:grid;place-items:center}
.cnum b{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--blanco);font-family:var(--display);font-weight:700;font-size:24px;color:var(--talavera-ink)}
.cwho h3{font-size:28px;font-style:italic;font-weight:600;line-height:1}
.cwho p{font-size:14px;color:#7A4A58;margin-top:6px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;max-width:260px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--cacao)}
.dots i.f{background:var(--rosa)}
.cnums{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:62px 1fr 64px;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.04em;color:#7A4A58}
.bar .tr{height:14px;border-radius:4px;background:#F4DADF;overflow:hidden}
.bar .fl{height:100%;width:0;border-radius:4px;background:var(--c);transition:width 1.6s var(--ease) var(--d,0s)}
.bar em{font-style:normal;text-align:right;color:var(--cacao);font-size:15px}
.ckept{text-align:right}
.ckept .label{color:#7A4A58}
.ckept b{display:block;font-family:var(--display);font-size:34px;font-weight:600;line-height:1.05;color:var(--nopal)}
.ckept b.neg{color:var(--rosa-ink)}
.cnone{font-size:14px;color:#9C7A80}

.bk-blue{background:var(--talavera);color:var(--blanco);position:relative}
.bk-blue::before{content:"";position:absolute;inset:0 0 auto;height:18px;background:var(--talav) 0 0/18px 18px}
.bk-blue .bk-h h2{color:var(--blanco)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pane{background:var(--azulejo);color:var(--cacao);border-radius:var(--r);padding:26px 26px 28px}
.pane h3{font-size:30px;font-style:italic;font-weight:600;line-height:1;margin-bottom:6px}
.pane>p{font-size:15px;color:#4A5684;margin-bottom:20px}
.venue2{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:16px 0;border-top:1.5px dashed #C9D2EE}
.venue2 h4{margin:0;font-family:var(--display);font-style:italic;font-weight:600;font-size:22px}
.venue2 small{font-size:13px;color:#4A5684;grid-column:1}
.venue2 .k{grid-column:2;grid-row:1/3;text-align:right;align-self:center}
.venue2 .k b{display:block;font-family:var(--display);font-size:28px;font-weight:600;color:var(--talavera)}
.venue2 .k span{font-size:13px;color:#4A5684}
.src{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:14px;padding:9px 0;font-size:15px;font-weight:700}
.src .tr{height:24px;border-radius:6px;background:#E3E8F6;overflow:hidden}
.src .fl{height:100%;width:0;background:var(--talavera);border-radius:6px;transition:width 1.6s var(--ease) var(--d,0s)}
.src.top .fl{background:var(--rosa)}
.src em{font-style:normal;text-align:right;font-family:var(--display);font-size:22px}
.pane .note2{margin-top:16px;font-size:14px;color:#4A5684}

.bk-dark{background:var(--cacao);color:var(--blanco)}
.bk-dark .bk-h h2{color:var(--blanco)}
.bk-dark .bk-h p{color:#D9B7BD}
.ledger{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:24px;align-items:start}
.addf{background:var(--cacao-2);border-radius:var(--r);padding:24px;display:grid;gap:16px}
.addf h3{font-size:28px;font-style:italic;font-weight:600}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind button{min-height:48px;border-radius:var(--r);border:1.5px solid var(--cacao-3);background:transparent;font-weight:700;font-size:15px;cursor:pointer;transition:background .3s,border-color .3s,color .3s}
.kind button[aria-pressed="true"][data-k="in"]{background:var(--nopal);border-color:var(--nopal)}
.kind button[aria-pressed="true"][data-k="out"]{background:var(--rosa);border-color:var(--rosa)}
.addf .field select{width:100%;min-height:52px;padding:0 14px;border-radius:var(--r);border:1.5px solid var(--cacao-3);background:var(--cacao);color:var(--blanco);font-size:16px}
.addf .field input{background:var(--cacao)}
.addf .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.addf .row2[hidden]{display:none}
.addf .submit{background:var(--cempa);color:var(--cacao);width:100%}
.addf .err{font-size:14px;color:var(--rosa-soft);min-height:0}
.book{background:var(--blanco);color:var(--cacao);border-radius:var(--r);padding:8px 24px 16px;background-image:repeating-linear-gradient(180deg,transparent 0 63px,#F2D3DA 63px 64px);background-position:0 8px}
.ent{display:grid;grid-template-columns:54px minmax(0,1fr) auto 44px;align-items:center;gap:14px;min-height:64px;padding:8px 0}
.ent time{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9C6A78;line-height:1.3}
.ent time b{display:block;font-family:var(--display);font-size:24px;letter-spacing:0;color:var(--cacao)}
.ent .w b{display:block;font-size:16px;font-weight:700;line-height:1.3}
.ent .w small{display:block;font-size:13px;color:#8A5A68;line-height:1.35}
.ent .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:#FBE0EA;color:var(--rosa-ink);margin-left:6px;vertical-align:1px}
.ent .a{font-family:var(--display);font-size:22px;font-weight:600;text-align:right;white-space:nowrap}
.ent .a.in{color:var(--nopal)}
.ent .a.out{color:var(--rosa-ink)}
.ent .x{width:44px;height:44px;border-radius:var(--r);border:0;background:transparent;color:#B08090;font-size:22px;cursor:pointer}
.ent .x:hover{background:#FBE0EA;color:var(--rosa-ink)}
.ent.new{animation:entIn 1s var(--ease)}
@keyframes entIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.empty{padding:40px 8px;text-align:center;font-size:16px;color:#8A5A68}
.empty b{display:block;font-family:var(--display);font-style:italic;font-size:30px;color:var(--cacao);margin-bottom:6px}
.bk-foot{background:var(--rosa);color:var(--blanco);text-align:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));font-size:14px;font-weight:700;letter-spacing:.08em}
.bk-foot a{text-decoration:none}
.bk-foot a:hover{text-decoration:underline;text-underline-offset:4px}

.books .bk-in{opacity:0;transform:translateY(28px)}
.books.on .bk-in{opacity:1;transform:none;transition:opacity 1.2s var(--ease) var(--d,0s),transform 1.2s var(--ease) var(--d,0s)}
.fin .owner{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#FFE3EF;text-decoration:none;margin-top:6px}
.fin .owner:hover{text-decoration:underline;text-underline-offset:4px}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found label{position:relative}
.found input{position:absolute;opacity:0;inset:0;cursor:pointer}
.found span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:var(--r);border:1.5px solid var(--cacao-3);background:var(--cacao-2);font-weight:700;font-size:14px;transition:border-color .3s,background .3s}
.found input:checked+span{border-color:var(--rosa-soft);background:#4A2329}
.found input:focus-visible+span{outline:3px solid var(--cempa);outline-offset:2px}

@media (max-width:1040px){
  .crow{grid-template-columns:76px minmax(0,1fr) 110px}
  .cnums{grid-column:2/4}
  .duo,.ledger{grid-template-columns:1fr}
}
@media (max-width:760px){
  .bk-bar{justify-content:space-between}
  .bk-head{grid-template-columns:1fr;text-align:center;justify-items:center;gap:18px}
  .bk-head p{text-align:center;margin-inline:auto}
  .bk-sum{grid-template-columns:1fr;max-width:420px;margin-inline:auto}
  .tot{text-align:center;justify-items:center}
  .bk-stats{gap:10px 26px}
  .bk-h{flex-direction:column;align-items:center;text-align:center;gap:12px}
  .bk-h p{text-align:center}
  .crow{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px;padding:24px 18px}
  .cnums{grid-column:auto;width:100%;max-width:340px}

<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Talavera tile ---------- */
const tile=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#F6F8FD'/><g fill='#1C3A96'><path d='M0 0H24A24 24 0 0 1 0 24Z'/><path d='M100 0V24A24 24 0 0 1 76 0Z'/><path d='M100 100H76A24 24 0 0 1 100 76Z'/><path d='M0 100V76A24 24 0 0 1 24 100Z'/></g><g fill='#F4A300'><circle cx='0' cy='0' r='8'/><circle cx='100' cy='0' r='8'/><circle cx='100' cy='100' r='8'/><circle cx='0' cy='100' r='8'/></g><circle cx='50' cy='50' r='29' fill='none' stroke='#1C3A96' stroke-width='2.5'/><circle cx='50' cy='50' r='33.5' fill='none' stroke='#1C3A96' stroke-width='1' stroke-dasharray='2 3'/><g fill='#1C3A96' transform='translate(50 50)'>${[0,45,90,135,180,225,270,315].map(a=>`<ellipse cx='0' cy='-14' rx='5.2' ry='12' transform='rotate(${a})'/>`).join('')}</g><g fill='#2E6E4A' transform='translate(50 50)'>${[22.5,112.5,202.5,292.5].map(a=>`<ellipse cx='0' cy='-21' rx='2.6' ry='5' transform='rotate(${a})'/>`).join('')}</g><circle cx='50' cy='50' r='6.5' fill='#F4A300'/><circle cx='50' cy='50' r='2.6' fill='#D81E7A'/><g fill='#1C3A96'><circle cx='50' cy='4' r='2.2'/><circle cx='96' cy='50' r='2.2'/><circle cx='50' cy='96' r='2.2'/><circle cx='4' cy='50' r='2.2'/></g></svg>`;
document.documentElement.style.setProperty('--talav',`url("data:image/svg+xml,${encodeURIComponent(tile)}")`);

/* ---------- papel picado ---------- */
const defs=$('#ppdefs'), NS='http://www.w3.org/2000/svg';
const zig=(()=>{let d='M0 0H80V86';for(let x=80,i=0;x>0;x-=8,i++){d+=`L${x-4} ${i%2?86:98}L${x-8} 86`;}return d+'Z';})();
const border=()=>{let s='';for(let x=10;x<=70;x+=7.5){s+=`<circle cx='${x}' cy='10' r='1.7'/><circle cx='${x}' cy='76' r='1.7'/>`;}return s;};
const motifs={
  flor:()=>[0,45,90,135,180,225,270,315].map(a=>`<ellipse cx='40' cy='31' rx='4' ry='9' transform='rotate(${a} 40 43)'/>`).join('')+`<circle cx='40' cy='43' r='3'/>`,
  heart:()=>`<path d='M40 62C22 50 17 39 25 31.5C31 26 37.5 29 40 34.5C42.5 29 49 26 55 31.5C63 39 58 50 40 62Z'/><circle cx='40' cy='22' r='2'/><circle cx='22' cy='58' r='2'/><circle cx='58' cy='58' r='2'/>`,
  rombo:()=>{let s='';for(let r=0;r<3;r++)for(let c=0;c<3;c++){const x=24+c*16,y=27+r*16;s+=`<path d='M${x} ${y-6}L${x+6} ${y}L${x} ${y+6}L${x-6} ${y}Z'/>`;}return s;},
  sol:()=>{let s=`<circle cx='40' cy='43' r='9'/>`;for(let i=0;i<12;i++){const a=i*30*Math.PI/180;s+=`<circle cx='${(40+Math.cos(a)*18).toFixed(1)}' cy='${(43+Math.sin(a)*18).toFixed(1)}' r='2.6'/>`;}return s;},
};
function mask(id,inner){const m=document.createElementNS(NS,'mask');m.id=id;m.setAttribute('maskUnits','userSpaceOnUse');m.setAttribute('x','0');m.setAttribute('y','0');m.setAttribute('width','80');m.setAttribute('height','100');m.innerHTML=`<rect width='80' height='100' fill='white'/><g fill='black'>${border()}${inner}</g>`;defs.appendChild(m);}
Object.entries(motifs).forEach(([k,f])=>mask('pp-'+k,f()));
['B','A','I','L'].forEach(l=>mask('pp-'+l,`<text x='40' y='59' text-anchor='middle' font-family='Bodoni Moda, Didot, Georgia, serif' font-weight='800' font-size='44'>${l}</text>`));
const topCols=['#F4A300','#1C3A96','#FFF9F6','#2E6E4A','#F7B6D2','#6E2A82'];
const botCols=['#F4A300','#FFF9F6','#1C3A96','#F7B6D2','#2E6E4A','#6E2A82'];
function picado(el,cols,word,dropIn){
  const probe=document.createElement('div');probe.className='flag';el.appendChild(probe);const fwPx=probe.offsetWidth||60;probe.remove();
  const gap=10;let n=Math.max(5,Math.floor((el.clientWidth+gap-16)/(fwPx+gap)));
  el.innerHTML='';
  const order=['flor','rombo','heart','sol'];
  if(word&&n>=word.length&&(n-word.length)%2)n-=1;
  const start=Math.floor((n-word.length)/2);
  for(let i=0;i<n;i++){
    const li=i-start, letter=word&&li>=0&&li<word.length?word[li]:null;
    const id=letter?'pp-'+letter:'pp-'+order[i%order.length];
    const f=document.createElement('div');f.className='flag'+(dropIn&&!reduce?' drop':'');
    f.style.setProperty('--dur',(3.8+((i*7)%5)*.45)+'s');f.style.setProperty('--del',(-(i*0.37))+'s');f.style.setProperty('--amp',(1.6+((i*3)%4)*.5)+'deg');f.style.setProperty('--in',(.1+i*.07)+'s');
    f.innerHTML=`<svg viewBox='0 0 80 100'><path d='${zig}' fill='${cols[i%cols.length]}' mask='url(#${id})'/></svg>`;
    el.appendChild(f);
  }
}
let pw=innerWidth;
const drawPicado=(drop)=>{picado($('#picadoTop'),topCols,'BAILA',drop);};
drawPicado(true);
addEventListener('resize',()=>{if(Math.abs(innerWidth-pw)>40){pw=innerWidth;if(document.body.classList.contains('books-open')){heroDirty=true;drawBooksPicado(false);}else drawPicado(false);}});

/* ---------- audio: a small synth banda ---------- */
const A=(()=>{
  let ctx,master,bus,noiseBuf,muted=false,bpm=84,playing=false,next=0,eighth=0,timer=null;const subs=new Set();
  function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.6;const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;master.connect(comp);comp.connect(ctx.destination);bus=ctx.createGain();bus.gain.value=.5;bus.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
  function osc(type,f,t,a,p,d,lp,out=bus){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);const g=ctx.createGain();env(g,t,a,p,d);let n=o;if(lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl;}n.connect(g).connect(out);o.start(t);o.stop(t+a+d+.05);return o;}
  function noise(t,type,f,p,d,out=bus){const s=ctx.createBufferSource();s.buffer=noiseBuf;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ctx.createGain();env(g,t,.002,p,d);s.connect(fl).connect(g).connect(out);s.start(t,Math.random()*.5);s.stop(t+d+.05);}
  const V={
    tuba:(t,f=87.31,p=.55,out)=>{osc('sawtooth',f,t,.015,p,.26,520,out);osc('sine',f,t,.01,p*.7,.28,0,out);},
    tambora:(t,acc=true,out)=>{const o=osc('sine',125,t,.004,acc?.95:.55,.42,0,out);o.frequency.exponentialRampToValueAtTime(46,t+.2);noise(t,'lowpass',900,acc?.4:.22,.06,out);},
    platillo:(t,p=.1,d=.12,out)=>noise(t,'highpass',7200,p,d,out),
    tarola:(t,p=.3,out)=>{noise(t,'bandpass',2600,p,.11,out);osc('triangle',210,t,.002,p*.5,.06,0,out);},
    charchetas:(t,ch=[349.23,440,523.25],p=.07,out)=>ch.forEach(f=>osc('square',f,t,.012,p,.1,1700,out)),
    clarinete:(t,out)=>{for(let i=0;i<10;i++)osc('triangle',i%2?784:698.46,t+i*.055,.006,.16,.05,2600,out);osc('triangle',880,t+.58,.01,.18,.35,2600,out);},

})();
