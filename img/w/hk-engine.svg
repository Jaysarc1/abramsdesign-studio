<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" preserveAspectRatio="xMidYMid slice">
<defs>
  <radialGradient id="bay" cx="50%" cy="48%" r="62%"><stop offset="0" stop-color="#232326"/><stop offset=".6" stop-color="#141416"/><stop offset="1" stop-color="#08080a"/></radialGradient>
  <linearGradient id="redL" x1="0" x2="1"><stop offset="0" stop-color="#e2343a"/><stop offset=".45" stop-color="#b8121b"/><stop offset=".85" stop-color="#7a0910"/><stop offset="1" stop-color="#3a0407"/></linearGradient>
  <linearGradient id="redR" x1="1" x2="0"><stop offset="0" stop-color="#e2343a"/><stop offset=".45" stop-color="#b8121b"/><stop offset=".85" stop-color="#7a0910"/><stop offset="1" stop-color="#3a0407"/></linearGradient>
  <linearGradient id="redT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e94048"/><stop offset=".6" stop-color="#a90f18"/><stop offset="1" stop-color="#4a050a"/></linearGradient>
  <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f7f8"/><stop offset=".35" stop-color="#b9bcc1"/><stop offset=".55" stop-color="#e7e9ec"/><stop offset="1" stop-color="#7d8086"/></linearGradient>
  <linearGradient id="aluV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a8d92"/><stop offset=".3" stop-color="#eef0f2"/><stop offset=".6" stop-color="#b4b7bc"/><stop offset="1" stop-color="#6e7176"/></linearGradient>
  <radialGradient id="cap" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe27a"/><stop offset=".6" stop-color="#f0b51c"/><stop offset="1" stop-color="#a87406"/></radialGradient>
  <radialGradient id="bolt" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#b7babe"/><stop offset="1" stop-color="#55585d"/></radialGradient>
  <radialGradient id="tank" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f5f2ea"/><stop offset=".7" stop-color="#cfc9bb"/><stop offset="1" stop-color="#8d887d"/></radialGradient>
  <pattern id="carbon" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="18" height="18" fill="#17171a"/><rect width="9" height="9" fill="#26262a"/><rect x="9" y="9" width="9" height="9" fill="#202024"/></pattern>
  <pattern id="fins" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#121214"/><rect width="12" height="3" fill="#3a3b3f"/></pattern>
  <pattern id="braid" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="10" height="10" fill="#8f9297"/><path d="M0 0L10 10M10 0L0 10" stroke="#dfe1e4" stroke-width="2"/></pattern>
  <pattern id="slots" width="40" height="22" patternUnits="userSpaceOnUse"><rect width="40" height="22" fill="#141416"/><rect x="4" y="6" width="32" height="8" rx="4" fill="#050506"/></pattern>
  <filter id="crinkle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="4" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="1.6" lighting-color="#ffffff" result="l"><feDistantLight azimuth="235" elevation="52"/></feDiffuseLighting>
    <feComposite in="SourceGraphic" in2="l" operator="arithmetic" k1="1.25" k2="0" k3="0" k4="0" result="m"/>
    <feComposite in="m" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <radialGradient id="glow" cx="50%" cy="44%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".72"/></radialGradient>
</defs>

<rect width="1400" height="1400" fill="url(#bay)"/>

<!-- front: bumper skin, radiator, intakes -->
<path d="M0 0H1400V70C1150 140 250 140 0 70Z" fill="url(#redT)"/>
<path d="M120 58C420 118 980 118 1280 58" fill="none" stroke="#ff8a8f" stroke-opacity=".35" stroke-width="4"/>
<rect x="300" y="128" width="800" height="118" rx="18" fill="url(#fins)"/>
<rect x="300" y="128" width="800" height="118" rx="18" fill="none" stroke="#000" stroke-width="6"/>
<!-- airboxes -->
<g>
  <rect x="300" y="270" width="210" height="130" rx="30" fill="url(#carbon)" stroke="#000" stroke-width="5"/>
  <rect x="890" y="270" width="210" height="130" rx="30" fill="url(#carbon)" stroke="#000" stroke-width="5"/>
  <path d="M318 290h174M908 290h174" stroke="#fff" stroke-opacity=".08" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- intake pipes from the airboxes to the throttle bodies, with red couplers -->
<g fill="none" stroke-linecap="round">
  <path d="M440 380C470 450 560 430 625 470" stroke="#0c0c0d" stroke-width="64"/>
  <path d="M960 380C930 450 840 430 775 470" stroke="#0c0c0d" stroke-width="64"/>
  <path d="M440 380C470 450 560 430 625 470" stroke="#b3b6bb" stroke-width="52"/>
  <path d="M960 380C930 450 840 430 775 470" stroke="#b3b6bb" stroke-width="52"/>
  <path d="M436 372C468 440 556 420 625 458" stroke="#f3f4f6" stroke-width="12" stroke-opacity=".8"/>
  <path d="M964 372C932 440 844 420 775 458" stroke="#f3f4f6" stroke-width="12" stroke-opacity=".8"/>
</g>
<g fill="#c4151e" stroke="#5a060b" stroke-width="3"><rect x="452" y="398" width="34" height="62" rx="8" transform="rotate(-30 469 429)"/><rect x="914" y="398" width="34" height="62" rx="8" transform="rotate(30 931 429)"/></g>

<!-- fenders -->
<path d="M0 60C120 80 220 95 262 110C238 420 226 760 240 1400H0Z" fill="url(#redL)"/>
<path d="M1400 60C1280 80 1180 95 1138 110C1162 420 1174 760 1160 1400H1400Z" fill="url(#redR)"/>
<path d="M262 110C238 420 226 760 240 1400" fill="none" stroke="#000" stroke-width="10" stroke-opacity=".6"/>
<path d="M1138 110C1162 420 1174 760 1160 1400" fill="none" stroke="#000" stroke-width="10" stroke-opacity=".6"/>
<path d="M58 160C90 520 96 900 74 1360" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="18" stroke-linecap="round" filter="url(#soft)"/>
<path d="M1342 160C1310 520 1304 900 1326 1360" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="18" stroke-linecap="round" filter="url(#soft)"/>

<!-- strut towers -->
<g>
  <circle cx="335" cy="520" r="78" fill="#1b1b1e" stroke="#000" stroke-width="6"/>
  <circle cx="1065" cy="520" r="78" fill="#1b1b1e" stroke="#000" stroke-width="6"/>
  <circle cx="335" cy="520" r="42" fill="url(#bolt)"/>
  <circle cx="1065" cy="520" r="42" fill="url(#bolt)"/>
  <g fill="url(#bolt)"><circle cx="335" cy="460" r="9"/><circle cx="387" cy="550" r="9"/><circle cx="283" cy="550" r="9"/><circle cx="1065" cy="460" r="9"/><circle cx="1117" cy="550" r="9"/><circle cx="1013" cy="550" r="9"/></g>
</g>

<!-- engine: two cam covers in rosso crinkle, the carbon plenum in the V -->
<g>
  <rect x="438" y="560" width="152" height="600" rx="40" fill="#000" opacity=".55" transform="translate(10 14)"/>
  <rect x="810" y="560" width="152" height="600" rx="40" fill="#000" opacity=".55" transform="translate(10 14)"/>
  <rect x="438" y="560" width="152" height="600" rx="40" fill="#c0141d" filter="url(#crinkle)"/>
  <rect x="810" y="560" width="152" height="600" rx="40" fill="#c0141d" filter="url(#crinkle)"/>
  <rect x="438" y="560" width="152" height="600" rx="40" fill="none" stroke="#5a060b" stroke-width="6"/>
  <rect x="810" y="560" width="152" height="600" rx="40" fill="none" stroke="#5a060b" stroke-width="6"/>
  <path d="M456 600V1120M828 600V1120" stroke="#ff7a80" stroke-opacity=".45" stroke-width="6" stroke-linecap="round"/>
  <!-- coil packs -->
  <g fill="#0f0f11" stroke="#000" stroke-width="3">
    <rect x="474" y="640" width="80" height="34" rx="9"/><rect x="474" y="770" width="80" height="34" rx="9"/><rect x="474" y="900" width="80" height="34" rx="9"/><rect x="474" y="1030" width="80" height="34" rx="9"/>
    <rect x="846" y="640" width="80" height="34" rx="9"/><rect x="846" y="770" width="80" height="34" rx="9"/><rect x="846" y="900" width="80" height="34" rx="9"/><rect x="846" y="1030" width="80" height="34" rx="9"/>
  </g>
  <g fill="#3c3d41"><rect x="484" y="648" width="18" height="18" rx="3"/><rect x="484" y="778" width="18" height="18" rx="3"/><rect x="484" y="908" width="18" height="18" rx="3"/><rect x="484" y="1038" width="18" height="18" rx="3"/><rect x="898" y="648" width="18" height="18" rx="3"/><rect x="898" y="778" width="18" height="18" rx="3"/><rect x="898" y="908" width="18" height="18" rx="3"/><rect x="898" y="1038" width="18" height="18" rx="3"/></g>
  <!-- cover bolts -->
  <g fill="url(#bolt)">
    <circle cx="452" cy="610" r="7"/><circle cx="576" cy="610" r="7"/><circle cx="452" cy="735" r="7"/><circle cx="576" cy="735" r="7"/><circle cx="452" cy="865" r="7"/><circle cx="576" cy="865" r="7"/><circle cx="452" cy="995" r="7"/><circle cx="576" cy="995" r="7"/><circle cx="452" cy="1110" r="7"/><circle cx="576" cy="1110" r="7"/>
    <circle cx="824" cy="610" r="7"/><circle cx="948" cy="610" r="7"/><circle cx="824" cy="735" r="7"/><circle cx="948" cy="735" r="7"/><circle cx="824" cy="865" r="7"/><circle cx="948" cy="865" r="7"/><circle cx="824" cy="995" r="7"/><circle cx="948" cy="995" r="7"/><circle cx="824" cy="1110" r="7"/><circle cx="948" cy="1110" r="7"/>
  </g>
  <!-- oil filler -->
  <circle cx="514" cy="600" r="0" fill="none"/>
  <!-- plenum -->
  <rect x="604" y="500" width="192" height="640" rx="64" fill="#000" opacity=".6" transform="translate(8 12)"/>
  <rect x="604" y="500" width="192" height="640" rx="64" fill="url(#carbon)" stroke="#000" stroke-width="6"/>
  <rect x="640" y="560" width="120" height="540" rx="44" fill="none" stroke="#3a3a3f" stroke-width="4"/>
  <path d="M700 570V1090" stroke="#fff" stroke-opacity=".10" stroke-width="20" stroke-linecap="round"/>
  <!-- throttle bodies -->
  <circle cx="640" cy="485" r="40" fill="url(#alu)" stroke="#2b2c30" stroke-width="5"/>
  <circle cx="760" cy="485" r="40" fill="url(#alu)" stroke="#2b2c30" stroke-width="5"/>
  <circle cx="640" cy="485" r="18" fill="#1a1a1d"/><circle cx="760" cy="485" r="18" fill="#1a1a1d"/>
</g>

<!-- strut brace, polished, across the top of the engine -->
<g>
  <path d="M335 520C520 486 880 486 1065 520" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="48" transform="translate(8 14)" stroke-linecap="round"/>
  <path d="M335 520C520 486 880 486 1065 520" fill="none" stroke="#6f7277" stroke-width="44" stroke-linecap="round"/>
  <path d="M335 516C520 482 880 482 1065 516" fill="none" stroke="#d9dbde" stroke-width="30" stroke-linecap="round"/>
  <path d="M345 508C520 476 880 476 1055 508" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-opacity=".9"/>
  <circle cx="335" cy="520" r="24" fill="url(#bolt)" stroke="#2b2c30" stroke-width="3"/>
  <circle cx="1065" cy="520" r="24" fill="url(#bolt)" stroke="#2b2c30" stroke-width="3"/>
</g>

<!-- reservoirs and caps -->
<g>
  <rect x="975" y="780" width="128" height="190" rx="34" fill="url(#tank)" stroke="#5f5a50" stroke-width="5"/>
  <path d="M990 860h98" stroke="#7b7568" stroke-width="3" stroke-opacity=".6"/>
  <circle cx="1039" cy="820" r="30" fill="url(#cap)" stroke="#7a5404" stroke-width="4"/>
  <rect x="300" y="1150" width="104" height="104" rx="26" fill="url(#tank)" stroke="#5f5a50" stroke-width="5"/>
  <circle cx="352" cy="1202" r="26" fill="url(#cap)" stroke="#7a5404" stroke-width="4"/>
  <circle cx="514" cy="1130" r="24" fill="url(#cap)" stroke="#7a5404" stroke-width="4"/>
  <path d="M700 1160c0 30 0 46 -16 58" fill="none" stroke="#f0b51c" stroke-width="8" stroke-linecap="round"/>
  <circle cx="676" cy="1226" r="13" fill="none" stroke="#f0b51c" stroke-width="8"/>
</g>
<!-- battery box -->
<g>
  <rect x="300" y="760" width="110" height="300" rx="20" fill="#121214" stroke="#000" stroke-width="5"/>
  <path d="M316 800h78M316 840h78M316 880h78M316 920h78M316 960h78M316 1000h78" stroke="#26262a" stroke-width="8" stroke-linecap="round"/>
</g>
<!-- braided lines -->
<g fill="none" stroke-linecap="round">
  <path d="M1000 960C980 1060 900 1100 860 1170" stroke="#000" stroke-width="22" stroke-opacity=".5"/>
  <path d="M1000 960C980 1060 900 1100 860 1170" stroke="url(#braid)" stroke-width="16"/>
  <path d="M404 1190C470 1180 520 1210 560 1180" stroke="#000" stroke-width="18" stroke-opacity=".5"/>
  <path d="M404 1190C470 1180 520 1210 560 1180" stroke="url(#braid)" stroke-width="12"/>
</g>

<!-- cowl, then the base of the windscreen -->
<rect x="250" y="1262" width="900" height="70" fill="url(#slots)"/>
<path d="M0 1330C300 1300 1100 1300 1400 1330V1400H0Z" fill="#0b0f16"/>
<path d="M160 1340C500 1318 900 1318 1240 1340" fill="none" stroke="#9fb3d1" stroke-opacity=".25" stroke-width="6"/>

<rect width="1400" height="1400" fill="url(#glow)"/>
<rect width="1400" height="1400" fill="url(#vig)"/>
</svg>
