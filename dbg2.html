<!doctype html><meta charset="utf-8"><title>dbg2</title>
<style>body{margin:0;background:#000;color:#ff0;font:12px monospace}iframe{border:0;display:block}pre{position:fixed;right:0;top:0;width:520px;max-height:100vh;overflow:auto;margin:0;background:rgba(0,0,0,.85);padding:6px;white-space:pre-wrap;z-index:9}</style>
<pre id="o">wait</pre>
<script>
var q=new URLSearchParams(location.search),W=+(q.get('w')||900),H=+(q.get('h')||880),sel=q.get('sel')||'#ow-refresh',t=+(q.get('t')||3);
var f=document.createElement('iframe');f.width=W;f.height=H;f.src='index.html';document.body.appendChild(f);
f.onload=function(){setTimeout(function(){var d=f.contentDocument,e=d.querySelector(sel);if(e)e.scrollIntoView({block:'start'});
 setTimeout(function(){var out=[];d.querySelectorAll('#work img').forEach(function(i){var r=i.getBoundingClientRect();if(r.bottom<-50||r.top>H+50)return;var cs=getComputedStyle(i);out.push((i.complete?'C':'-')+' nw='+i.naturalWidth+' op='+cs.opacity+' vis='+cs.visibility+' disp='+cs.display+' tf='+cs.transform.slice(0,30)+' '+Math.round(r.width)+'x'+Math.round(r.height)+'@'+Math.round(r.top)+' '+(i.currentSrc||i.src).split('/').pop()+' L='+i.loading);});
 var p=e;var chain=[];while(p&&p!==d.body){var cs=getComputedStyle(p);if(cs.opacity!=='1'||cs.visibility!=='visible'||cs.contentVisibility&&cs.contentVisibility!=='visible')chain.push(p.tagName+'.'+p.className+' op='+cs.opacity+' cv='+cs.contentVisibility);p=p.parentElement;}
 document.getElementById('o').textContent='found='+!!e+'\n'+out.join('\n')+'\nancestors:\n'+chain.join('\n');},t*1000);},2500);};
</script>
