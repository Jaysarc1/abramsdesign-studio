<style>
/* Umbrella session controls: Desk (exit), Save, hourly auto-save backup, exit warning.
   Shared by every Umbrella module so they look and behave the same. */
.us-desk,.us-save{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:12px;
  box-shadow:inset 0 0 0 1px var(--rule,rgba(239,232,220,.14));color:var(--ivory,#efe8dc);transition:box-shadow .4s,background .4s;white-space:nowrap}
.us-desk:hover,.us-save:hover,.us-save[aria-expanded="true"]{box-shadow:inset 0 0 0 1px rgba(239,232,220,.4);background:rgba(239,232,220,.04)}
.us-desk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .6s var(--ease,cubic-bezier(.22,1,.36,1))}
.us-desk:hover svg{transform:translateX(-3px)}
.us-desk b,.us-save b{font:400 16px/1 var(--f-disp,"Newsreader",Georgia,serif);font-style:italic}
.us-save small{font:500 9.5px/1 var(--f-mono,"Geist Mono",monospace);letter-spacing:.16em;text-transform:uppercase;color:var(--ivory-3,#8a8073);font-variant-numeric:tabular-nums}
.us-save i{width:6px;height:6px;border-radius:50%;background:var(--ivory-3,#8a8073);transition:background .4s,box-shadow .4s}
.us-save.dirty i{background:var(--brass,#c9a76a);box-shadow:0 0 0 3px rgba(201,167,106,.16)}
.us-savew{position:relative}
.us-menu{position:absolute;z-index:60;right:0;top:calc(100% + 8px);width:250px;padding:8px;border-radius:16px;background:rgba(30,27,23,.96);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 0 1px var(--rule,rgba(239,232,220,.14)),0 30px 60px rgba(0,0,0,.45);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .3s,transform .5s var(--ease,cubic-bezier(.22,1,.36,1))}
.us-menu.open{opacity:1;transform:none;pointer-events:auto}
.us-menu button{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 10px;border-radius:10px;text-align:left;color:var(--ivory,#efe8dc);transition:background .3s}
.us-menu button:hover{background:rgba(239,232,220,.06)}
.us-menu button:disabled{opacity:.35;pointer-events:none}
.us-menu button b{font:400 16px/1.1 var(--f-disp,"Newsreader",Georgia,serif)}
.us-menu button span{font:500 10px/1 var(--f-mono,"Geist Mono",monospace);color:var(--ivory-3,#8a8073);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.us-menu hr{border:0;height:1px;background:var(--rule,rgba(239,232,220,.14));margin:6px 10px}

.us-modal{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .45s}
.us-modal.open{opacity:1;pointer-events:auto}
.us-modal .us-veil{position:absolute;inset:0;background:rgba(12,10,8,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.us-card{position:relative;width:min(440px,100%);padding:34px 32px 28px;border-radius:20px;background:#26221d;color:var(--ivory,#efe8dc);
  box-shadow:0 0 0 1px var(--rule,rgba(239,232,220,.14)),0 40px 90px rgba(0,0,0,.55);transform:translateY(14px) scale(.985);transition:transform .7s var(--ease,cubic-bezier(.22,1,.36,1))}
.us-modal.open .us-card{transform:none}
.us-card small{display:block;font:500 9.5px/1 var(--f-mono,"Geist Mono",monospace);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-3,#8a8073);margin-bottom:16px}
.us-card h3{margin:0;font:400 26px/1.18 var(--f-disp,"Newsreader",Georgia,serif);letter-spacing:-.005em}
.us-card p{margin:12px 0 0;font:400 14px/1.5 var(--f-ui,"Geist",sans-serif);color:var(--ivory-2,#bdb3a4)}
.us-acts{display:flex;justify-content:flex-end;gap:10px;margin-top:28px;flex-wrap:wrap}
.us-btn{height:40px;padding:0 16px;border-radius:12px;font:500 13px/40px var(--f-ui,"Geist",sans-serif);letter-spacing:.01em;color:var(--ivory,#efe8dc);
  box-shadow:inset 0 0 0 1px var(--rule,rgba(239,232,220,.14));transition:box-shadow .3s,background .3s,color .3s;white-space:nowrap}
.us-btn:hover{box-shadow:inset 0 0 0 1px rgba(239,232,220,.4)}
.us-btn.solid{background:var(--ivory,#efe8dc);color:#1d1a16;box-shadow:none}
.us-btn.solid:hover{background:#fff}
.us-btn.warn{color:#e0907f}
.us-btn.quiet{box-shadow:none;color:var(--ivory-3,#8a8073)}
.us-btn.quiet:hover{color:var(--ivory,#efe8dc)}
.us-step{transition:opacity .35s,transform .55s var(--ease,cubic-bezier(.22,1,.36,1))}
.us-step[hidden]{display:none}
.us-leave{position:fixed;inset:0;z-index:300;background:#16140f;opacity:0;pointer-events:none;transition:opacity .7s;display:grid;place-items:center}
.us-leave.on{opacity:1;pointer-events:auto}
.us-leave span{font:400 italic 28px/1 var(--f-disp,"Newsreader",Georgia,serif);color:var(--ivory-2,#bdb3a4)}
.us-toast{position:fixed;z-index:210;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);padding:10px 16px;border-radius:12px;
  background:rgba(30,27,23,.96);box-shadow:0 0 0 1px var(--rule,rgba(239,232,220,.14)),0 20px 40px rgba(0,0,0,.4);font:500 10px/1 var(--f-mono,"Geist Mono",monospace);letter-spacing:.18em;text-transform:uppercase;color:var(--ivory-2,#bdb3a4);opacity:0;transition:opacity .4s,transform .6s var(--ease,cubic-bezier(.22,1,.36,1));pointer-events:none}
.us-toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){
  .us-desk{padding:0 12px}.us-desk b{display:none}
  .us-save small{display:none}.us-save{padding:0 12px}
  .us-card{padding:28px 22px 22px}.us-card h3{font-size:22px}
  .us-acts{flex-direction:column-reverse}.us-acts .us-btn{width:100%}
}

</style>
<style>
/* Layout: a dark sample room. An oak ledge of samples runs the width under picture lights; the room's work table sits below it.
   Tapping a sample lifts it into raking light. Pulled samples land on the table, logged on a library card. */
:root{
  --room:#221f1b; --room-hi:#3a342d; --room-lo:#16140f;
  --ivory:#efe8dc; --ivory-2:#bdb3a4; --ivory-3:#8a8073;
  --brass:#c9a76a; --stamp:#a8392b;
  --board:#ece6dc; --board-ink:#25211c; --board-ink-2:#6b6358; --board-rule:rgba(37,33,28,.14);
  --rule:rgba(239,232,220,.14);
  --f-disp:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"Geist","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-type:"Courier Prime","Courier New",monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --gut:40px; --top:68px; --r:12px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ivory);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.smp:focus-visible{outline:1.5px solid var(--brass);outline-offset:4px}
img{-webkit-user-drag:none;user-select:none}

.app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1.155fr) minmax(0,1fr);overflow:hidden;
  background:linear-gradient(rgba(33,30,26,.88),rgba(33,30,26,.88)),url(tex/wall.webp) center/cover,var(--room);}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(60% 46% at 50% 30%,rgba(255,236,205,.07),transparent 70%),
   linear-gradient(180deg,rgba(14,12,9,.35),rgba(14,12,9,0) 38%,rgba(14,12,9,.12) 62%,rgba(14,12,9,.45));
  mix-blend-mode:normal}
.app>*{position:relative;z-index:1}
.gut{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}

/* header: room left, mark on the page axis, sound right */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;z-index:5}
.mark{display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1}
.mark b{font:400 22px/1 var(--f-disp);font-style:normal;letter-spacing:.005em}
.mark span{font:500 9.5px/1 var(--f-mono);letter-spacing:.28em;padding-left:.28em;text-transform:uppercase;color:var(--ivory-3)}
/* the app name, small and pressed into the wall, tone on tone */
.top .mark b{font:400 22px/1 var(--f-disp);letter-spacing:.01em;color:#22201d;text-shadow:0 1px 0 rgba(239,226,205,.09),0 -1px 0 rgba(0,0,0,.42)}
.tl{justify-self:start;display:flex;align-items:center;gap:10px}
.room{justify-self:start;display:flex;align-items:center;gap:12px;height:40px;padding:0 14px 0 16px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--rule);transition:box-shadow .4s,background .4s}
.room:hover{box-shadow:inset 0 0 0 1px rgba(239,232,220,.4);background:rgba(239,232,220,.04)}
.room small{font:500 9.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ivory-3)}
.room b{font:400 16px/1 var(--f-disp);font-style:normal}
.room svg{width:10px;height:10px;stroke:var(--ivory-2);fill:none;stroke-width:1.5;transition:transform .5s var(--ease)}
.room[aria-expanded="true"] svg{transform:rotate(180deg)}
.tr{justify-self:end;display:flex;gap:10px;align-items:center}
.upb{height:40px;padding:0 14px 0 12px;border-radius:var(--r);display:flex;align-items:center;gap:9px;box-shadow:inset 0 0 0 1px var(--rule);font:500 9.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ivory-2);transition:box-shadow .4s,color .4s}
.upb:hover{box-shadow:inset 0 0 0 1px rgba(239,232,220,.4);color:var(--ivory)}
.upb svg{width:15px;height:15px;fill:none;stroke:var(--ivory);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.snd{width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--rule);transition:box-shadow .4s}
.snd:hover{box-shadow:inset 0 0 0 1px rgba(239,232,220,.4)}
.snd svg{width:18px;height:18px;fill:none;stroke:var(--ivory);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.snd .w{transition:opacity .5s}
.snd.on .w1{animation:wv 2.2s ease-in-out infinite}.snd.on .w2{animation:wv 2.2s ease-in-out .3s infinite}
@keyframes wv{0%,100%{opacity:.25}50%{opacity:1}}
.snd .x{display:none}.snd.mute .w{display:none}.snd.mute .x{display:inline}.snd.lo .w2{display:none}
/* volume: speaker and slider in one 12px capsule */
.vol{position:relative;display:flex;align-items:center;height:40px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--rule);transition:box-shadow .4s}
.vol:hover{box-shadow:inset 0 0 0 1px rgba(239,232,220,.4)}
.vol .snd,.vol .snd:hover{box-shadow:none}
.vp{display:flex;align-items:center;padding:0 16px 0 0}
.vp small{display:none;font:500 9.5px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-3)}
#volR{-webkit-appearance:none;appearance:none;display:block;width:84px;height:20px;margin:0;background:transparent;cursor:pointer;--v:70%}
#volR:focus{outline:0}
#volR::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ivory) var(--v),rgba(239,232,220,.18) var(--v))}
#volR::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;background:var(--ivory);box-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .35s var(--ease)}
#volR:hover::-webkit-slider-thumb,#volR:active::-webkit-slider-thumb{transform:scale(1.2)}
#volR::-moz-range-track{height:2px;border-radius:2px;background:rgba(239,232,220,.18)}
#volR::-moz-range-progress{height:2px;border-radius:2px;background:var(--ivory)}
#volR::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ivory);box-shadow:0 1px 3px rgba(0,0,0,.5)}

/* the session controls sit in the header slots; no italics anywhere */
*,*::before,*::after{font-style:normal!important}
.slot{display:contents}
.tl .room{justify-self:auto}
.matb b{min-width:5.2em;text-align:left}
/* Organize by and the list it drives, linked as one control */
.duo{display:flex;align-items:center;height:30px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--rule);flex:none;min-width:0;transition:box-shadow .4s}
.duo:hover{box-shadow:inset 0 0 0 1px rgba(239,232,220,.4)}
.duo .org,.duo .org:hover,.duo .org[aria-expanded="true"]{box-shadow:none}
.duo .orgw .org{border-radius:var(--r) 0 0 var(--r)}
.duo>.matb{position:relative;border-radius:0 var(--r) var(--r) 0}
.duo>.matb::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--rule)}
/* the count of materials on the table */
.tcount{position:absolute;z-index:3;top:20px;right:20px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(37,33,28,.28);font:500 11px/1 var(--f-mono);letter-spacing:.02em;color:#25211c;font-variant-numeric:tabular-nums;pointer-events:none}

/* room list (opens from the table row) and the materials list (opens from the header) */
.rooms{position:fixed;z-index:60;left:0;top:0;width:280px;max-height:min(70vh,560px);box-sizing:border-box;overflow:auto;padding:10px;border-radius:16px;
  background:rgba(30,27,23,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 0 1px var(--rule),0 30px 60px rgba(0,0,0,.45);
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .35s,transform .6s var(--ease)}
.rooms.open{opacity:1;transform:none;pointer-events:auto}
.rooms h6{margin:6px 10px 10px;font:500 9.5px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-3)}
.rooms button{width:100%;display:flex;justify-content:space-between;align-items:baseline;padding:10px;border-radius:10px;text-align:left;transition:background .3s}
.rooms button:hover{background:rgba(239,232,220,.06)}
.rooms button b{font:400 17px/1.1 var(--f-disp)}
.rooms button i{font:500 10px/1 var(--f-mono);font-style:normal;color:var(--ivory-3);font-variant-numeric:tabular-nums}
.mats button[aria-checked="true"] b,.rooms button[aria-current="true"] b{font-style:normal;color:var(--brass)}
.rooms .lv{margin:12px 10px 4px;font:500 9px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-3);opacity:.7}

/* the library */
.lib{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);min-height:0}
.index{display:flex;justify-content:space-between;align-items:center;gap:24px;height:44px}
/* organize by: same voice as the room button, sized to the filter row */
.ixl{display:flex;align-items:center;gap:22px;min-width:0;flex:1}
.orgw{position:relative;flex:none}
.org{display:flex;align-items:center;gap:10px;height:30px;padding:0 11px 0 13px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--rule);transition:box-shadow .4s,background .4s;white-space:nowrap}
.org:hover,.org[aria-expanded="true"]{box-shadow:inset 0 0 0 1px rgba(239,232,220,.4);background:rgba(239,232,220,.04)}
.org small{font:500 9px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ivory-3)}
.org b{font:400 15px/1 var(--f-disp);font-style:normal;min-width:4.6em;text-align:left}
.org svg{width:9px;height:9px;stroke:var(--ivory-2);fill:none;stroke-width:1.5;transition:transform .5s var(--ease)}
.org[aria-expanded="true"] svg{transform:rotate(180deg)}
.orgm{position:absolute;left:0;top:calc(100% + 8px);z-index:40;width:230px;padding:10px;border-radius:16px;
  background:rgba(30,27,23,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 0 1px var(--rule),0 30px 60px rgba(0,0,0,.45);
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .35s,transform .6s var(--ease)}
.orgm.open{opacity:1;transform:none;pointer-events:auto}
.orgm h6{margin:6px 10px 10px;font:500 9.5px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-3)}
.orgm button{width:100%;display:flex;justify-content:space-between;align-items:baseline;padding:10px;border-radius:10px;text-align:left;transition:background .3s}
.orgm button:hover{background:rgba(239,232,220,.06)}
.orgm button b{font:400 17px/1.1 var(--f-disp)}
.orgm button i{font:500 10px/1 var(--f-mono);font-style:normal;color:var(--ivory-3);font-variant-numeric:tabular-nums}
.orgm button[aria-checked="true"] b{font-style:normal;color:var(--brass)}
.tabs{display:flex;gap:26px;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:baseline;gap:6px;height:30px;font:500 10.5px/30px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ivory-3);white-space:nowrap;transition:color .4s}
.tab sup{font-size:8.5px;letter-spacing:.08em;color:var(--ivory-3);opacity:.7;font-variant-numeric:tabular-nums}
.tab::after{content:"";position:absolute;left:0;right:.18em;bottom:2px;height:1px;background:var(--brass);transform:scaleX(0);transform-origin:0 50%;transition:transform .7s var(--ease)}
.tab:hover{color:var(--ivory-2)}
.tab[aria-current="true"]{color:var(--ivory)}
.tab[aria-current="true"]::after{transform:none}
.filt{display:flex;align-items:center;gap:22px;flex:none}
.fam{display:flex;gap:7px;align-items:center}
.fam button{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);transition:transform .5s var(--ease),box-shadow .35s}
.fam button:hover{transform:scale(1.18)}
.fam button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 2px var(--room),0 0 0 3px var(--ivory)}
.tiers{display:flex;align-items:center;height:30px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--rule);padding:0 3px}
.tiers button{height:24px;padding:0 9px;border-radius:9px;font:500 11px/24px var(--f-mono);letter-spacing:.04em;color:var(--ivory-3);transition:color .3s,background .3s}
.tiers button:hover{color:var(--ivory)}
.tiers button.lit{color:var(--ivory)}
.tiers button[aria-pressed="true"]{background:rgba(239,232,220,.1)}
.vr{width:1px;height:18px;background:var(--rule)}

.shelfwrap{position:relative;min-height:0}
.spot{position:absolute;top:-30px;width:520px;height:120%;margin-left:-260px;left:var(--sx,50%);pointer-events:none;
  background:radial-gradient(50% 55% at 50% 38%,rgba(255,232,196,.16),rgba(255,232,196,.05) 55%,transparent 72%);opacity:.0;transition:left .9s var(--ease),opacity .8s}
.spot.on{opacity:1}
.scroller{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.scroller::-webkit-scrollbar{display:none}
.scroller.dragging{cursor:grabbing}
.shelf{position:relative;height:100%;min-width:100%;width:max-content}
.row{position:absolute;left:0;right:0;bottom:calc(var(--ledge) + var(--lip) - 4px);display:flex;align-items:flex-end;padding-inline:var(--pad) var(--pad)}
.grp{display:flex;align-items:flex-end;gap:var(--g);flex:none}
.grp+.grp{margin-left:var(--gg)}
/* the ledge: a top surface the samples stand on, and the lip that carries their codes */
.ledge{position:absolute;left:0;right:0;bottom:var(--lip);height:var(--ledge);
  background:linear-gradient(180deg,rgba(255,250,240,.0),rgba(255,250,240,.08)),url(tex/ledge.webp) 0 0/1200px 100%;
  filter:brightness(.92) saturate(.92);box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.lip{position:absolute;left:0;right:0;bottom:0;height:var(--lip);
  background:linear-gradient(180deg,rgba(255,250,240,.22),rgba(0,0,0,.08) 30%,rgba(0,0,0,.28)),url(tex/ledge.webp) 0 30px/1200px 300%;
  box-shadow:0 18px 30px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.08) inset}
.dymo{position:absolute;top:18px;display:flex;align-items:baseline;gap:10px;z-index:2;pointer-events:none;white-space:nowrap}
.dymo b{font:400 15px/1 var(--f-disp);letter-spacing:.01em;color:var(--ivory-2)}
.dymo i{font:500 9px/1 var(--f-mono);letter-spacing:.14em;color:var(--ivory-3);font-variant-numeric:tabular-nums}
.dymo::after{content:"";flex:1;min-width:12px;height:1px;align-self:center;margin-top:2px;background:linear-gradient(90deg,rgba(239,232,220,.16),rgba(239,232,220,0))}

.smp{position:relative;flex:none;width:var(--w);height:var(--h);display:block;transition:opacity .8s var(--ease),transform .9s var(--ease),filter .8s}
.smp .lean{position:absolute;inset:0;transform-origin:50% 100%;transform:perspective(900px) rotateX(5deg);transition:transform .8s var(--ease)}
.smp .lean img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;
  filter:drop-shadow(10px 5px 9px rgba(0,0,0,.42)) drop-shadow(2px 1px 2px rgba(0,0,0,.35));transition:filter .8s var(--ease)}
.smp .thick{position:absolute;left:2px;right:0;bottom:-3px;height:var(--th,0px);border-radius:0 0 2px 2px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.15));filter:blur(.3px)}
.smp::after{content:"";position:absolute;left:8%;right:-4%;bottom:-6px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);transition:opacity .8s,transform .8s var(--ease)}
.smp .code{position:absolute;left:50%;top:calc(100% + var(--ledge) + (var(--lip) - 10px) / 2 - 4px);transform:translateX(-50%);font:500 9.5px/10px var(--f-mono);letter-spacing:.12em;color:rgba(30,22,14,.72);text-shadow:0 1px 0 rgba(255,245,230,.35);white-space:nowrap;padding-left:.12em;transition:color .5s}
.smp.fresh .lean{animation:fresh 1.6s var(--ease) both}
.smp.fresh .code{color:#7a5a24}
@keyframes fresh{0%{transform:perspective(900px) translateY(-40px) rotateX(-10deg);opacity:0}60%{opacity:1}100%{transform:perspective(900px) rotateX(5deg);opacity:1}}
.smp.pulled .code::before{content:"";display:inline-block;width:5px;height:5px;margin-right:6px;border-radius:50%;background:var(--stamp);vertical-align:1px}
.smp:hover .lean,.smp.hov .lean{transform:perspective(900px) translateY(-14px) rotateX(-7deg)}
.smp:hover .lean img,.smp.hov .lean img{filter:drop-shadow(14px 18px 16px rgba(0,0,0,.5)) drop-shadow(3px 4px 4px rgba(0,0,0,.3)) brightness(1.06)}
.smp:hover::after,.smp.hov::after{opacity:.45;transform:scaleX(.86)}
.smp.out{opacity:.16;filter:saturate(.2);transform:translateY(10px) scale(.95);pointer-events:none}
.smp.gone .lean{opacity:0}

/* caption */
/* the material in hand, named under The Library, on the page axis */
.cap{display:grid;justify-items:center;text-align:center;height:76px;align-content:center}
.cb{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:12px}
.cb>*{transition:opacity .45s,transform .7s var(--ease)}
.cb.out>*{opacity:0;transform:translateY(-6px)}
.cb.in>*{animation:rise .8s var(--ease) both}.cb.in>:nth-child(2){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.cb h3{margin:0;font:300 28px/1 var(--f-disp);letter-spacing:-.01em;font-variation-settings:"opsz" 72}
.cb h3 em{font-style:normal}
.cb p{margin:0;font:500 12px/1 var(--f-mono);letter-spacing:.16em;padding-left:.16em;text-transform:uppercase;color:var(--ivory-3);display:flex;gap:12px;align-items:center}
.cb p i{width:3px;height:3px;border-radius:50%;background:var(--ivory-3);opacity:.6}

/* The Library no longer shows in the header at any width; the material's name takes its place where it fits. */
.top .mark{visibility:hidden}
/* 1150px and up (back from 1250 now the top bar is symbols only): the name sits in the header, its cap height centred on the buttons' centreline (measured: 34px on 34px),
   the spec directly under it, and the whole shelf group rises with it as before. The room row rises 20px; the table takes that height.
   At 1150px the longest name (Travertino Classico) still clears Save by more than 24px. */
@media (min-width:1150px){
  .lib{transform:translateY(calc(-1 * var(--lift,62px)))}
  .cap{position:relative;top:var(--capNudge,4.5px)}
  .desk{margin-top:-20px}
}

/* the desk */
.desk{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;min-height:0;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.dh{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;padding:6px 0 12px}
.dh-r{grid-column:3;justify-self:end}
/* the room picker sits on the page axis, under the shelf, as the title of the table */
.dh-l{grid-column:2}
/* picker at 88% of v15; its row keeps v15's 54px so nothing around it moves */
.dh .dh-l{min-height:54px;align-items:center}
.dh-l .room{height:48px;gap:12px;padding:0 16px 0 19px}
.dh-l .room small{font-size:14px;letter-spacing:.16em}
.dh-l .room b{font-size:23px}
.dh-l .room svg{width:10.5px;height:10.5px}
@media (max-width:1079px){.dh{grid-template-columns:auto minmax(0,1fr)}.dh-l{grid-column:1}.dh-r{grid-column:2}}
/* the credit, quiet, on the page axis under the table */
.credit{margin:0;padding-top:14px;text-align:center;font:500 9px/1 var(--f-mono);letter-spacing:.26em;padding-left:.26em;text-transform:uppercase;color:var(--ivory-3);opacity:.75}
.dh-l{display:flex;align-items:baseline;gap:14px;min-width:0}
.dh-l h2{margin:0;font:300 28px/1 var(--f-disp);font-style:normal;letter-spacing:-.01em;white-space:nowrap}
.dh-l span{font:500 10px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ivory-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.dh-r{display:flex;gap:10px;flex:none}
.btn{height:40px;padding:0 18px;border-radius:var(--r);display:inline-flex;align-items:center;gap:10px;font:500 10.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;transition:background .4s,color .4s,box-shadow .4s,transform .5s var(--ease)}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--ease)}
.btn.ghost{box-shadow:inset 0 0 0 1px var(--rule)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px rgba(239,232,220,.45)}
.btn.solid{background:var(--ivory);color:var(--room)}
.btn.solid:hover{background:#fff}
.btn.solid:hover svg{transform:translateX(3px)}
.btn:active{transform:scale(.97)}

.table{position:relative;min-height:0;border-radius:6px;overflow:hidden;
  background:var(--board) url(tex/table.webp) center/cover;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 30px 60px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.4)}
.table::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 90% at 55% 20%,rgba(255,248,236,.25),transparent 70%),linear-gradient(180deg,transparent 60%,rgba(60,48,36,.08));z-index:0}
.table.hot{box-shadow:0 0 0 2px var(--brass),0 30px 60px rgba(0,0,0,.45)}
.ghostname{display:none;position:absolute;right:28px;bottom:14px;font:300 clamp(48px,7vw,104px)/1 var(--f-disp);font-style:normal;color:rgba(37,33,28,.06);pointer-events:none;white-space:nowrap;letter-spacing:-.02em;z-index:0;transition:opacity .6s}

/* library card */
.card{position:absolute;left:26px;top:22px;bottom:22px;width:214px;z-index:2;background:#f7f3ea;border-radius:2px;
  box-shadow:0 1px 1px rgba(40,30,20,.18),0 8px 18px rgba(40,30,20,.14);color:var(--board-ink);padding:16px 16px 62px;display:flex;flex-direction:column;gap:10px;overflow:hidden;
  background-image:repeating-linear-gradient(180deg,transparent 0 21px,rgba(70,110,150,.16) 21px 22px);background-position:0 92px}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;font:700 8.5px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase}
.card .ch span{font-weight:500;color:var(--board-ink-2)}
.card .cr{display:flex;align-items:baseline;gap:8px;padding-bottom:8px;border-bottom:1.5px solid rgba(168,57,43,.5)}
.card .cr small{font:500 8px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--board-ink-2)}
.card .cr b{font:400 15px/1 var(--f-type)}
.card .cols{display:grid;grid-template-columns:44px 40px 1fr;gap:6px;font:500 7.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--board-ink-2)}
.lines{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;justify-content:flex-start}
.ln{display:grid;grid-template-columns:44px 40px 1fr;gap:6px;height:22px;align-items:center;font:400 11px/1 var(--f-type);color:#2c2a33;white-space:nowrap}
.ln span{overflow:hidden;text-overflow:ellipsis}
.ln.ret{text-decoration:line-through;text-decoration-color:rgba(168,57,43,.7);opacity:.55}
.stamp{position:absolute;right:16px;bottom:14px;padding:6px 9px 5px;border:2px solid var(--stamp);border-radius:4px;color:var(--stamp);font:700 11px/1 var(--f-mono);letter-spacing:.2em;
  transform:rotate(-9deg);mix-blend-mode:multiply;opacity:.82;display:flex;flex-direction:column;align-items:center;gap:3px}
.stamp small{font-size:7.5px;letter-spacing:.24em}
.stamp.thunk{animation:thunk .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes thunk{0%{opacity:0;transform:rotate(-9deg) scale(1.9)}60%{opacity:.9}100%{opacity:.82;transform:rotate(-9deg) scale(1)}}

/* items on the table */
.ti{position:absolute;left:0;top:0;width:var(--w);height:var(--h);z-index:3;transform:translate(calc(var(--x) - 50%),calc(var(--y) - 50%)) rotate(var(--r,0deg));touch-action:none;cursor:grab;transition:transform .9s var(--ease)}
.ti.drag{transition:none;cursor:grabbing;z-index:30}
.ti img{width:100%;height:100%;display:block;object-fit:fill;filter:drop-shadow(1px 2px 1.5px rgba(40,30,20,.32)) drop-shadow(4px 8px 10px rgba(40,30,20,.18));transition:filter .5s var(--ease),transform .5s var(--ease)}
.ti.drag img{filter:drop-shadow(8px 22px 22px rgba(40,30,20,.3)) drop-shadow(2px 6px 6px rgba(40,30,20,.2));transform:scale(1.06)}
.ti.land img{animation:land .7s var(--ease) both}
@keyframes land{0%{transform:scale(1.12);filter:drop-shadow(8px 22px 22px rgba(40,30,20,.3))}55%{transform:scale(.985)}100%{transform:none}}
.ti.ref img{object-fit:cover;background:#fff;padding:6px 6px 22px;box-sizing:border-box}
.ti.ref::before{content:"";position:absolute;left:50%;top:-8px;width:58px;height:18px;margin-left:-29px;background:rgba(234,222,196,.78);transform:rotate(-3deg);z-index:2;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.ti .x{position:absolute;right:-9px;top:-9px;width:22px;height:22px;border-radius:50%;background:var(--board-ink);color:var(--board);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .3s,transform .5s var(--ease);z-index:3}
.ti .x svg{width:8px;height:8px;stroke:currentColor;stroke-width:1.8}
.ti:hover .x{opacity:1;transform:none}
.ti.out{opacity:0;transform:translate(calc(var(--x) - 50%),calc(var(--y) - 50% - 30px)) rotate(var(--r,0deg)) scale(.9);transition:opacity .5s,transform .7s var(--ease)}

.flyer{position:fixed;left:0;top:0;z-index:90;pointer-events:none;will-change:transform}
.flyer img{width:100%;height:100%;display:block;object-fit:fill;filter:drop-shadow(8px 20px 20px rgba(0,0,0,.35))}

/* focus: the sample under raking light */
.focus{position:fixed;inset:0;z-index:60;display:grid;grid-template-columns:minmax(0,1fr) 380px;column-gap:56px;
  padding:calc(var(--top) + env(safe-area-inset-top,0px)) max(var(--gut),env(safe-area-inset-right,0px)) max(36px,env(safe-area-inset-bottom,0px)) max(var(--gut),env(safe-area-inset-left,0px));
  visibility:hidden;pointer-events:none}
.focus.on{visibility:visible;pointer-events:auto}
.veil{position:fixed;inset:0;background:rgba(18,16,13,.78);backdrop-filter:blur(14px) saturate(.8);-webkit-backdrop-filter:blur(14px) saturate(.8);opacity:0;transition:opacity .7s}
.focus.on .veil{opacity:1}
.stage{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;row-gap:26px}
.pane{position:relative;min-height:0}
.sc{position:absolute;left:0;top:0;perspective:1800px}
.flipper{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s var(--ease-io)}
.flipper.back{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face canvas{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(18px 28px 30px rgba(0,0,0,.55)) drop-shadow(4px 6px 6px rgba(0,0,0,.35));cursor:crosshair;touch-action:none}
.face.b{transform:rotateY(180deg);background:#bdb6aa;border-radius:2px;box-shadow:18px 28px 50px rgba(0,0,0,.5);display:grid;place-items:center;overflow:hidden;
  background-image:radial-gradient(rgba(0,0,0,.06) 1px,transparent 1.2px);background-size:5px 5px}
.face.b.round{border-radius:14px}
.label{width:min(86%,300px);background:#f8f5ee;color:#1f1c18;border-radius:2px;padding:14px 14px 12px;box-shadow:0 1px 2px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px;transform:rotate(-.6deg)}
.label .l1{display:flex;justify-content:space-between;align-items:baseline;font:700 9px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase}
.label .l1 span{font-weight:500;color:#6b6358}
.label .code{font:600 30px/1 var(--f-mono);letter-spacing:.02em}
.label .nm{font:400 17px/1.15 var(--f-disp);font-style:normal}
.label dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font:500 9.5px/1.3 var(--f-mono);letter-spacing:.06em}
.label dt{color:#6b6358;text-transform:uppercase;letter-spacing:.16em;font-size:8px;padding-top:1px}
.label dd{margin:0}
.label svg{width:100%;height:30px;margin-top:4px}
.label .bc{font:500 8px/1 var(--f-mono);letter-spacing:.3em;text-align:center;color:#6b6358}
.face.b.small .label{transform:scale(.62) rotate(-.6deg)}

.ctl{display:flex;justify-content:center;align-items:center;gap:14px;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .8s var(--ease)}
.focus.on .ctl{opacity:1;transform:none;transition-delay:.55s}
.seg{position:relative;display:flex;padding:3px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--rule)}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:78px;border-radius:9px;background:var(--ivory);transition:transform .6s var(--ease)}
.seg.b i{transform:translateX(78px)}
.seg button{position:relative;width:78px;height:30px;font:500 10px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;transition:color .45s;border-radius:9px}
.seg button[aria-pressed="true"]{color:var(--room)}
.arw{width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--rule);transition:box-shadow .4s}
.arw:hover{box-shadow:inset 0 0 0 1px rgba(239,232,220,.45)}
.arw svg{width:14px;height:14px;stroke:var(--ivory);fill:none;stroke-width:1.5;transition:transform .5s var(--ease)}
#fPrev:hover svg{transform:translateX(-3px)}#fNext:hover svg{transform:translateX(3px)}
.close{position:absolute;right:max(var(--gut),env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 14px);z-index:3;width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--rule);opacity:0;transition:opacity .5s,box-shadow .4s}
.focus.on .close{opacity:1;transition-delay:.4s}
.close:hover{box-shadow:inset 0 0 0 1px rgba(239,232,220,.45)}
.close svg{width:12px;height:12px;stroke:var(--ivory);stroke-width:1.5}

.info{position:relative;align-self:start;max-height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:flex;flex-direction:column;gap:20px;padding-block:8px}
.info::-webkit-scrollbar{display:none}
.info>*{opacity:0;transform:translateX(16px);transition:opacity .35s,transform .45s var(--ease)}
.focus.on .info>*{opacity:1;transform:none;transition:opacity .8s,transform 1s var(--ease);transition-delay:calc(var(--k) * 70ms + 420ms)}
.info.swap>*{opacity:0!important;transform:translateY(8px)!important;transition:opacity .25s,transform .35s!important;transition-delay:0s!important}
.i-eye{margin:0;font:500 10px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-3);display:flex;gap:10px;align-items:center}
.i-eye b{color:var(--brass);font-weight:500}
.i-name{margin:-6px 0 0;font:300 46px/.98 var(--f-disp);letter-spacing:-.015em;font-variation-settings:"opsz" 72;text-wrap:balance}
.i-line{margin:0;font:400 15px/1.6 var(--f-ui);color:var(--ivory-2);text-wrap:pretty;max-width:34ch}
.i-price{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0;border-block:1px solid var(--rule)}
.pe{display:flex;align-items:baseline;gap:12px;padding:14px 0;text-align:left}
.pe s{font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--ivory-3);text-decoration-thickness:1px}
.pe .sale{font:500 8.5px/1 var(--f-mono);font-style:normal;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);padding:4px 6px 4px 7px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(201,167,106,.5);align-self:center}
.pe .pen{width:12px;height:12px;align-self:center;fill:none;stroke:var(--ivory-3);stroke-width:1.3;stroke-linejoin:round;opacity:0;transform:translateX(-4px);transition:opacity .4s,transform .5s var(--ease)}
.pe:hover .pen,.pe:focus-visible .pen{opacity:1;transform:none}
@media (hover:none){.pe .pen{opacity:.6;transform:none}}
.pf{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0}
.pf label{display:flex;align-items:baseline;gap:2px;font:400 26px/1 var(--f-disp);color:var(--ivory-2)}
.pf input{width:3.6em;background:transparent;border:0;border-bottom:1px solid var(--brass);color:var(--ivory);font:400 26px/1 var(--f-disp);font-variant-numeric:tabular-nums;padding:2px 0 4px;outline:0;border-radius:0}
.pf label span{font:inherit;letter-spacing:0;color:var(--ivory-2)}
.pf small{font:500 10px/1 var(--f-mono);letter-spacing:.16em;color:var(--ivory-3);text-transform:uppercase}
.pfa{margin-left:auto;display:flex;gap:8px}
.pfa button{height:30px;padding:0 12px;border-radius:var(--r);font:500 9.5px/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase}
.pfa .pok{background:var(--ivory);color:var(--room)}
.pfa .pr0{box-shadow:inset 0 0 0 1px var(--rule);color:var(--ivory-2)}
.i-price.edit>span{display:none}
/* pull-to rooms */
.pm{position:fixed;z-index:9;box-sizing:border-box;overflow:auto;padding:10px;border-radius:16px;background:rgba(30,27,23,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 0 1px var(--rule),0 30px 60px rgba(0,0,0,.5);
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .35s,transform .6s var(--ease);scrollbar-width:none}
.pm.up{transform:translateY(8px)}
.pm.open{opacity:1;transform:none;pointer-events:auto}
.pm h6{margin:6px 10px 6px;font:500 9.5px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-3)}
.pm .lv{margin:12px 10px 4px;font:500 9px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ivory-3);opacity:.7}
.pm button{width:100%;display:flex;justify-content:space-between;align-items:baseline;padding:10px;border-radius:10px;text-align:left;transition:background .3s}
.pm button:hover{background:rgba(239,232,220,.06)}
.pm button b{font:400 17px/1.1 var(--f-disp)}
.pm button i{display:flex;align-items:center;gap:8px;font:500 10px/1 var(--f-mono);font-style:normal;color:var(--ivory-3);font-variant-numeric:tabular-nums}
.pm button i u{width:5px;height:5px;border-radius:50%;background:var(--stamp)}
.pm button[aria-checked="true"] b{font-style:normal;color:var(--brass)}

<script>
/* Day / Night / Auto, the board's switch. Auto follows the device (or a host page that sets data-theme). Tone is decided before the room paints. */
(() => {
  const R = document.documentElement, host = R.getAttribute('data-theme'), K = 'meezon-theme', ORDER = ['auto', 'light', 'dark'], NAME = {auto:'Auto', light:'Day', dark:'Night'};
  const mq = matchMedia('(prefers-color-scheme: light)');
  let mode = 'auto'; try { mode = localStorage.getItem(K) || 'auto' } catch(e){}
  function tone(){ const t = mode === 'auto' ? (host || (mq.matches ? 'light' : 'dark')) : mode; R.setAttribute('data-tone', t === 'light' ? 'day' : 'night') }
  function set(m, anim){
    mode = ORDER.includes(m) ? m : 'auto';
    if (anim){ R.classList.add('tswap'); clearTimeout(set.t); set.t = setTimeout(() => R.classList.remove('tswap'), 800) }
    if (mode === 'auto'){ host ? R.setAttribute('data-theme', host) : R.removeAttribute('data-theme') } else R.setAttribute('data-theme', mode);
    tone();
    const b = document.getElementById('tm'); if (b){ b.querySelectorAll('svg').forEach(s => s.classList.toggle('on', s.dataset.m === mode)); b.setAttribute('aria-label', 'Theme: ' + NAME[mode]); b.title = NAME[mode] }
    try { localStorage.setItem(K, mode) } catch(e){}
  }
  window.setTheme = m => set(m, true);
  set(mode, false);
  try { mq.addEventListener('change', () => { if (mode === 'auto') tone() }) } catch(e){}
  document.addEventListener('DOMContentLoaded', () => { set(mode, false); const b = document.getElementById('tm'); if (b) b.addEventListener('click', () => set(ORDER[(ORDER.indexOf(mode) + 1) % 3], true)) });
})();
</script>

<script>
/* Umbrella session controls (shared by every module).
   - Desk: leaves the module for the desk. With unsaved changes it first asks
     "Do you wish to save your changes before exiting?" then, if they leave without saving, "Are you sure?"
   - Save: writes the saved copy (Ctrl/Cmd+S too). Saving stays the user's job.
   - Auto-save: once an hour, one backup copy, each one overwriting the last. Restorable from the Save menu.
   Usage: const S = UmbrellaSession({ id:'ledger', get:()=>state, set:s=>{...}, deskUrl, deskEl, saveEl, sound:{click(){}} });
          S.change() after every edit. Load with S.load(fallback). */
function UmbrellaSession(o) {
  const K = 'umbrella:' + o.id, KS = K + ':saved', KA = K + ':autosave', HOUR = 3600e3;
  const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
  const fmt = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const day = t => { const d = new Date(t), n = new Date(); return d.toDateString() === n.toDateString() ? fmt(t) : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + fmt(t); };
  let dirty = false, savedAt = null, lastSnap = null;
  const svgL = '<svg viewBox="0 0 14 14"><path d="M12 7H2M6 3 2 7l4 4"/></svg>';
  o.deskEl.innerHTML = `<button type="button" class="us-desk" aria-label="Back to desk">${svgL}<b>Desk</b></button>`;
  o.saveEl.innerHTML = `<div class="us-savew"><button type="button" class="us-save" aria-haspopup="true" aria-expanded="false"><i></i><b>Save</b><small></small></button>
    <div class="us-menu" role="menu"><button type="button" data-a="save"><b>Save now</b><span>⌘S</span></button><hr>
    <button type="button" data-a="restore"><b>Restore auto-save</b><span class="us-at">None yet</span></button></div></div>`;
  document.body.insertAdjacentHTML('beforeend', `<div class="us-modal" role="dialog" aria-modal="true" aria-labelledby="usH1"><div class="us-veil"></div><div class="us-card">
    <div class="us-step" data-s="1"><small>${o.title || 'Leaving'}</small><h3 id="usH1">Do you wish to save your changes before exiting?</h3>
      <div class="us-acts"><button type="button" class="us-btn quiet" data-a="cancel">Cancel</button><button type="button" class="us-btn" data-a="nosave">Exit without saving</button><button type="button" class="us-btn solid" data-a="saveexit">Save and exit</button></div></div>
    <div class="us-step" data-s="2" hidden><small>${o.title || 'Leaving'}</small><h3>Are you sure?</h3><p>Changes since your last save will be lost.</p>
      <div class="us-acts"><button type="button" class="us-btn" data-a="back">Go back</button><button type="button" class="us-btn solid" data-a="exit">Exit</button></div></div>
    <div class="us-step" data-s="3" hidden><small>Auto-save</small><h3>Restore the auto-save from <span class="us-at2"></span>?</h3><p>It replaces what's on screen now.</p>
      <div class="us-acts"><button type="button" class="us-btn" data-a="cancel">Cancel</button><button type="button" class="us-btn solid" data-a="dorestore">Restore</button></div></div>
  </div></div><div class="us-leave"><span>Desk</span></div><div class="us-toast"></div>`);
  const $ = s => document.querySelector(s);
  const saveBtn = o.saveEl.querySelector('.us-save'), menu = o.saveEl.querySelector('.us-menu'), modal = $('.us-modal'), toastEl = $('.us-toast');
  const click = () => o.sound && o.sound.click && o.sound.click();
  let tT; const toast = t => { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => toastEl.classList.remove('on'), 1800); };
  function paint() {
    saveBtn.classList.toggle('dirty', dirty);
    saveBtn.querySelector('small').textContent = dirty ? 'Unsaved' : savedAt ? 'Saved ' + fmt(savedAt) : '';
    const a = ls.get(KA); const r = menu.querySelector('[data-a="restore"]');
    r.disabled = !a; menu.querySelector('.us-at').textContent = a ? day(a.t) : 'None yet';
  }
  function save(quiet) { const ok = ls.set(KS, { t: Date.now(), s: o.get() }); if (ok) { dirty = false; savedAt = Date.now(); paint(); if (!quiet) toast('Saved ' + fmt(savedAt)); } return ok; }
  function autosave() {
    const snap = JSON.stringify(o.get());
    if (snap === lastSnap) return;
    if (ls.set(KA, { t: Date.now(), s: o.get() })) { lastSnap = snap; paint(); }
  }
  function show(step) { modal.querySelectorAll('.us-step').forEach(e => e.hidden = e.dataset.s !== String(step)); modal.classList.add('open'); setTimeout(() => { const b = modal.querySelector(`.us-step[data-s="${step}"] .solid`); b && b.focus(); }, 60); }
  function hide() { modal.classList.remove('open'); }
  function leave() {
    dirty = false; $('.us-leave').classList.add('on');
    setTimeout(() => { if (o.deskUrl) { const a = document.createElement('a'); a.href = o.deskUrl; a.target = '_top'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); } }, 650);
    setTimeout(() => $('.us-leave').classList.remove('on'), 4000);
  }
  function exit() { click(); if (dirty) show(1); else leave(); }
  o.deskEl.querySelector('.us-desk').addEventListener('click', exit);
  saveBtn.addEventListener('click', e => { click(); const op = !menu.classList.contains('open'); menu.classList.toggle('open', op); saveBtn.setAttribute('aria-expanded', op); paint(); e.stopPropagation(); });
  document.addEventListener('click', e => { if (!o.saveEl.contains(e.target)) { menu.classList.remove('open'); saveBtn.setAttribute('aria-expanded', 'false'); } });
  menu.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; click(); menu.classList.remove('open'); saveBtn.setAttribute('aria-expanded', 'false');
    if (b.dataset.a === 'save') save();
    if (b.dataset.a === 'restore') { const a = ls.get(KA); if (a) { $('.us-at2').textContent = day(a.t); show(3); } }
  });
  modal.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (e.target.classList.contains('us-veil')) return hide(); if (!b) return; click();
    const a = b.dataset.a;
    if (a === 'cancel') hide();
    if (a === 'back') show(1);
    if (a === 'nosave') show(2);
    if (a === 'saveexit') { hide(); save(true); leave(); }
    if (a === 'exit') { hide(); leave(); }
    if (a === 'dorestore') { const r = ls.get(KA); hide(); if (r) { o.set(r.s); dirty = true; paint(); toast('Auto-save restored'); } }
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    if (e.key === 'Escape' && modal.classList.contains('open')) hide();
  });
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  // hourly auto-save, counted from the last one so it survives reloads
  function schedule() { const a = ls.get(KA); const due = a ? Math.max(5e3, a.t + HOUR - Date.now()) : HOUR; setTimeout(() => { autosave(); schedule(); }, Math.min(due, HOUR)); }
  return {
    load(fallback) { const s = ls.get(KS); if (s) { savedAt = s.t; } const a = ls.get(KA); if (a) lastSnap = JSON.stringify(a.s); schedule(); paint(); return s ? s.s : fallback; },
    change() { if (!dirty) { dirty = true; paint(); } },
    save, autosave, isDirty: () => dirty
  };
}

</script>

const PJ = { id: null, sel: new Set(), to: null };
function roomsOf(p) {
  if (p.now) { const o = {}; for (const [, list] of ROOMS) for (const r of list) o[r] = (ST.rooms[r]?.items || []).map(i => i.code).filter(c => BY[c]); return o; }
  const o = {}, add = (ST.px ||= {})[p.id] || {};
  for (const r of new Set([...Object.keys(p.rooms), ...Object.keys(add)])) o[r] = [...new Set([...(p.rooms[r] || []), ...(add[r] || [])])].filter(c => BY[c]);
  return o;
}
function matsOf(p) {
  const o = new Map();
  for (const [r, list] of Object.entries(roomsOf(p))) for (const c of list) { if (!o.has(c)) o.set(c, []); o.get(c).push(r); }
  return o;
}
const thumb = c => TEX(BY[c].ways[wayOf(c)].t);
const nRooms = p => Object.values(roomsOf(p)).filter(l => l.length).length;
function renderProjects() {
  $('#pjL').innerHTML = PROJ.map((p, k) => {
    const m = [...matsOf(p).keys()], n = m.length, nr = nRooms(p);
    return `<button type="button" class="pjr" data-p="${p.id}" style="--k:${k}"><span class="pjc">${m.slice(0, 4).map(c => `<img alt="" src="${thumb(c)}">`).join('') || '<i></i>'}</span>
      <span class="pjt"><b>${p.name}</b><small>${p.yr}<i></i>${nr} room${nr === 1 ? '' : 's'}<i></i>${n} material${n === 1 ? '' : 's'}</small></span>${p.now ? '<em>Open</em>' : ''}<svg viewBox="0 0 10 10"><path d="M3.5 1.5 7 5l-3.5 3.5"/></svg></button>`;
  }).join('');
}
function pjView(b) { $('#pjA').classList.toggle('on', !b); $('#pjB').classList.toggle('on', !!b); pjEl.querySelector('.sp').scrollTop = 0; }
function openProject(id) {
  const p = PROJ.find(x => x.id === id); PJ.id = id; PJ.sel.clear(); PJ.to = null;
  const m = matsOf(p), nr = nRooms(p);
  $('#pjName').textContent = p.name;
  $('#pjMeta').textContent = `${p.yr} · ${nr} room${nr === 1 ? '' : 's'} · ${m.size} material${m.size === 1 ? '' : 's'}`;
  $('#pjG').innerHTML = m.size ? [...m].map(([c, rs], k) => `<button type="button" class="pjm" data-c="${c}" aria-pressed="false" style="--k:${k}"><span class="pji"><img alt="" src="${thumb(c)}"><i><svg viewBox="0 0 12 12"><path d="m2.5 6.2 2.3 2.3 4.7-5"/></svg></i></span><b>${BY[c].name}</b><small>${c}<i></i>${rs.join(', ')}</small></button>`).join('')
    : '<p class="pje">Nothing pulled yet.</p>';
  pjView(true); syncPJ();
}
function syncPJ() {
  const n = PJ.sel.size, all = $('#pjG').querySelectorAll('.pjm').length;
  $('#pjSel').textContent = n ? `${n} selected` : 'Select materials';
  $('#pjAll').textContent = n && n === all ? 'Clear' : 'Select all'; $('#pjAll').hidden = !all;
  $('#pjG').querySelectorAll('.pjm').forEach(b => b.setAttribute('aria-pressed', String(PJ.sel.has(b.dataset.c))));
  const t = PJ.to && PROJ.find(x => x.id === PJ.to.p);
  $('#pjToName').textContent = t ? `${t.name} · ${PJ.to.r}` : 'Choose';
  const go = $('#pjGo'); go.disabled = !(n && t); if (!go.classList.contains('done')) go.textContent = n ? `Export ${n}` : 'Export';
}
function closeXM() { xm.classList.remove('open'); $('#pjTo').setAttribute('aria-expanded', 'false'); }
$('#meBtn').addEventListener('click', () => { closeMats(); closeRooms(); closeOrg(); renderProjects(); pjView(false); openSheet(pjEl); sfx('tick'); });
$('#pjL').addEventListener('click', e => { const b = e.target.closest('.pjr'); if (!b) return; sfx('tick'); openProject(b.dataset.p); });
$('#pjBack').addEventListener('click', () => { sfx('tick'); closeXM(); renderProjects(); pjView(false); });
$('#pjG').addEventListener('click', e => { const b = e.target.closest('.pjm'); if (!b) return; const c = b.dataset.c; PJ.sel.has(c) ? PJ.sel.delete(c) : PJ.sel.add(c); tap(null, .35); syncPJ(); });
$('#pjAll').addEventListener('click', () => { const bs = [...$('#pjG').querySelectorAll('.pjm')]; if (PJ.sel.size === bs.length) PJ.sel.clear(); else bs.forEach(b => PJ.sel.add(b.dataset.c)); sfx('tick'); syncPJ(); });
$('#pjTo').addEventListener('click', e => {
  e.stopPropagation(); const o = !xm.classList.contains('open');
  if (o) {
    xm.innerHTML = PROJ.map(p => `<h6>${p.name}</h6>` + Object.keys(p.now ? Object.fromEntries(ROOMS.flatMap(([, l]) => l.map(r => [r, 1]))) : roomsOf(p)).map(r => `<button type="button" role="menuitemradio" data-p="${p.id}" data-r="${r}" aria-checked="${!!PJ.to && PJ.to.p === p.id && PJ.to.r === r}"><b>${r}</b><i>${roomsOf(p)[r]?.length || ''}</i></button>`).join('')).join('');
    placeMenu(xm, $('#pjTo'), 300); xm.scrollTop = 0;
  }
  xm.classList.toggle('open', o); $('#pjTo').setAttribute('aria-expanded', String(o));
});
xm.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('button[data-p]'); if (!b) return; PJ.to = { p: b.dataset.p, r: b.dataset.r }; closeXM(); sfx('tick'); syncPJ(); });
addEventListener('click', e => { if (!e.target.closest('#xm,#pjTo')) closeXM(); });
pjEl.addEventListener('click', e => { if (e.target.closest('[data-x]')) closeXM(); });
$('#pjGo').addEventListener('click', () => {
  const t = PROJ.find(x => x.id === PJ.to.p), r = PJ.to.r, codes = [...PJ.sel]; let added = 0;
  if (t.now) {
    const room = (ST.rooms[r] ||= { items: [], refs: [], log: [] });
    for (const c of codes) if (!room.items.some(i => i.code === c)) { room.items.push({ code: c, way: wayOf(c), r: Math.round(rnd(-1.2, 1.2) * 10) / 10 }); room.log.push({ d: TODAY, code: c }); added++; }
    if (added && r === ST.room) renderTable(true);
  } else {
    const a = ((ST.px ||= {})[t.id] ||= {}), cur = new Set(roomsOf(t)[r] || []);
    for (const c of codes) if (!cur.has(c)) { (a[r] ||= []).push(c); added++; }
  }
  save(); syncPulled(); tap(null, 1);
  const go = $('#pjGo'); go.classList.add('done');
  go.textContent = added ? `Exported ${added} to ${t.name}` : `Already in ${r}`;
  PJ.sel.clear(); syncPJ();
  if (PJ.id === t.id) openProject(t.id);
  setTimeout(() => { go.classList.remove('done'); syncPJ(); }, 2400);
});

/* restore the hourly auto-save in place */
function restoreState(s) {
  for (let i = CAT.length - 1; i >= 0; i--) if (CAT[i].mine) { delete BY[CAT[i].code]; CAT.splice(i, 1); }
  for (const k in els) delete els[k];
  const mu = ST.muted; ST = s; ST.muted = mu; if (!ST.rooms) ST = freshState();
  ST.mine ||= []; ST.prices ||= {};
  for (const m of ST.mine) { const c = mineCat(m); c.list = c.price; CAT.push(c); BY[c.code] = c; }
  CAT.forEach(applyPrice);
  $('#orgName').textContent = ORG(ST.org).label;
  buildShelf(); layout(); buildTabs(); applyFilter(); renderTable(true); syncTab();
  lastC = contentOf(ST);
}

function placeMat() {
  // the profile button sits at the end of the header on wide screens, at the end of the Organize row on a phone
  const m = $('#meBtn'), u = MOB() ? $('.ixl') : $('.tr'); if (m.parentNode !== u) u.appendChild(m);
}

/* ---------------- boot ---------------- */
$('#orgName').textContent = ORG(ST.org).label;
placeMat(); buildShelf(); buildTabs();
renderTable(false);
applyFilter();
setCap(null);
layout(); syncTab(); sndUI(); lastC = contentOf(ST);
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { placeMat(); layout(); if (F_.open) placeSc(BY[F_.code]); if (boardEl.classList.contains('on')) layBoard(); }, 120); });
if (document.fonts) document.fonts.ready.then(() => layout());
// open on the samples, gently: the shelf eases in from the right
if (!RM) { scroller.scrollLeft = 0; row.animate([{ transform: 'translateX(60px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 1400, easing: 'cubic-bezier(.22,1,.36,1)' }); }
})();

</script>

</body></html>
