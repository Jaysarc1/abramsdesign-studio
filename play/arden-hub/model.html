<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arden House Model, Rev 17.8.21</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1ea;--ink:#1c1d1c;--brass:#b8925a;--glass:rgba(20,19,17,.42);--glass-2:rgba(20,19,17,.62);--on:#f4f1ea;--on-2:rgba(244,241,234,.72);--on-3:rgba(244,241,234,.48);--rule:rgba(244,241,234,.16);color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(20,19,17,.42)}}
:root[data-theme="dark"]{--glass:rgba(20,19,17,.42)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;height:100%;background:#14120f;color:var(--on);font-family:Geist,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas#c{-webkit-user-select:none;user-select:none;position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.hud>*{pointer-events:auto}
.brand{position:fixed;top:max(18px,env(safe-area-inset-top));left:20px;pointer-events:none;text-shadow:0 1px 18px rgba(0,0,0,.35)}
.brand .w{font-family:"Geist Mono",monospace;letter-spacing:.42em;font-size:12px}
.brand .t{font-family:"Instrument Serif",serif;font-size:30px;line-height:1.05;margin-top:10px;letter-spacing:-.005em}
.brand .t em{font-style:italic}
/* Rev 16: one control system. Every control is a glass pill of one height, one radius, one type style (mono caps, 11px, .16em),
   one active state (paper fill, ink text). Segmented groups for choices, chips with a dot for on / off. */
:root{--h:40px;--pad:3px}
.top{position:fixed;left:50%;top:max(18px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.tools{display:flex;align-items:center;gap:10px}
.ctl,.seg{height:var(--h);box-sizing:border-box;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--rule)}
.seg{display:flex;gap:2px;padding:var(--pad)}
.seg button,.ctl,.vstep button{appearance:none;border:0;font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;line-height:1;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.seg button{display:flex;align-items:center;justify-content:center;gap:8px;height:100%;padding:0 18px 0 calc(18px + .16em);border-radius:999px;background:transparent;color:var(--on-2);transition:background .35s,color .35s}
.seg button:hover{color:var(--on)}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--ink)}
.seg button svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.ctl{display:flex;align-items:center;gap:9px;padding:0 18px 0 16px;color:var(--on-2);transition:color .35s,border-color .35s}
.ctl:hover,.ctl[aria-pressed="true"]{color:var(--on)}
.ctl i{width:7px;height:7px;border-radius:50%;box-sizing:border-box;border:1px solid var(--on-3);transition:background .35s,border-color .35s}
.ctl[aria-pressed="true"] i{background:var(--brass);border-color:var(--brass)}
.ctl .lg{font:inherit}
.flat .tools{visibility:hidden}
.flat .hint{color:rgba(28,29,28,.6);text-shadow:none}
.go button{appearance:none;border:0;background:transparent;color:var(--on-2);font:inherit;cursor:pointer}
.go{position:fixed;left:20px;bottom:max(84px,calc(env(safe-area-inset-bottom) + 84px));display:none;flex-direction:column;gap:2px;padding:6px;border-radius:16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--rule)}
.go.on{display:flex}
.go button{text-align:left;padding:9px 14px;border-radius:10px;font-size:14px;color:var(--on-2)}
.go button:hover{background:rgba(244,241,234,.08);color:var(--on)}
.go .mono{color:var(--on-3);padding:8px 14px 4px}
.views{bottom:max(44px,calc(env(safe-area-inset-bottom) + 44px));max-height:calc(100vh - 220px);overflow-y:auto;scrollbar-width:none;padding:6px;border-radius:20px;min-width:196px}
.views button{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;height:34px;padding:0 14px;border-radius:999px;line-height:1}
.views .mono{font-size:9.5px;padding:10px 14px 6px}
.views::-webkit-scrollbar{display:none}
.views .mono:not(:first-child){margin-top:6px;border-top:1px solid var(--rule);padding-top:14px}
.views button{transition:background .35s,color .35s}
.views button[aria-pressed="true"]{background:var(--on);color:var(--ink)}
/* Rev 17: the Lines dropdown and the grouped view list */
.ctl.dd .lw{color:var(--on-3)}
.ctl.dd .lw:empty{display:none}
.ctl.dd .c,.views .gh .c{width:8px;height:8px;flex:none;fill:none;stroke:var(--on-3);stroke-width:1.3;transition:transform .3s}
.ctl.dd[aria-expanded="true"] .c,.views .grp.open .gh .c{transform:rotate(180deg)}
.menu{position:fixed;z-index:4;display:none;flex-direction:column;gap:2px;min-width:200px;padding:6px;border-radius:20px;background:var(--glass-2);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--rule)}
.menu.on{display:flex}
.menu .mono{font-size:9.5px;color:var(--on-3);padding:10px 14px 6px}
.menu button{appearance:none;border:0;background:transparent;color:var(--on-2);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:18px;height:34px;padding:0 14px;border-radius:999px;font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1;transition:background .35s,color .35s}
.menu button:hover{color:var(--on);background:rgba(244,241,234,.08)}
.menu button svg{width:40px;height:8px;flex:none;fill:none;stroke:currentColor;stroke-linecap:round}
.menu button[aria-pressed="true"]{background:var(--on);color:var(--ink)}
.views .grp{display:flex;flex-direction:column}
.views .grp+.grp{margin-top:2px}
.views .gh{display:flex;align-items:center;gap:10px;color:var(--on-2)}
.views .gh span:first-child{flex:1}
.views .gh .ct{color:var(--on-3);font-size:10px}
.views .grp.cur .gh{color:var(--on)}
.views .grp.cur .gh span:first-child::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--brass);margin-left:10px;vertical-align:2px}
.views .gl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.views .gl>div{overflow:hidden;display:flex;flex-direction:column;gap:2px;padding-left:12px}
.views .grp.open .gl{grid-template-rows:1fr}
.views .grp.open .gl>div{padding-top:2px;padding-bottom:6px}
.views .gl button{color:var(--on-2)}
.views .gl button[aria-pressed="true"]{color:var(--ink)}
.pan{position:fixed;right:20px;bottom:max(44px,calc(env(safe-area-inset-bottom) + 44px));width:112px;height:112px;border-radius:50%;display:none;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--rule)}
.flat .pan{display:block}
.pan button{position:absolute;appearance:none;border:0;background:transparent;color:var(--on-2);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;transition:background .35s,color .35s;-webkit-tap-highlight-color:transparent}
.pan button:hover{color:var(--on);background:rgba(244,241,234,.08)}
.pan button:active{background:var(--on);color:var(--ink)}
.pan button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.pan .u{left:36px;top:2px}.pan .d{left:36px;bottom:2px}.pan .l{left:2px;top:36px}.pan .r{right:2px;top:36px}
.pan .c{left:42px;top:42px;width:26px;height:26px}
.pan .c i{width:6px;height:6px;border-radius:50%;border:1px solid currentColor;box-sizing:border-box}
.vstep{display:none}
.fade{transition:opacity .32s ease}
.fade.out{opacity:0}
.hint{position:fixed;left:50%;top:calc(max(18px,env(safe-area-inset-top)) + 68px);transform:translateX(-50%);color:var(--on-2);text-shadow:0 1px 12px rgba(0,0,0,.5);transition:opacity .8s;white-space:nowrap}
.cap{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 44px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;pointer-events:none}
.cap .tl{display:flex;align-items:center;justify-content:center;height:46px;box-sizing:border-box;padding:0 26px 0 calc(26px + .24em);border-radius:999px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--rule);font-family:"Geist Mono",ui-monospace,monospace;font-weight:400;text-transform:uppercase;font-size:15px;line-height:1;letter-spacing:.24em;color:var(--on);white-space:nowrap}
.cap .tl .sc{color:var(--on-2)}
body.desk .credit{color:rgba(28,29,28,.62);text-shadow:0 0 14px rgba(244,241,234,.7)}
body.desk .credit b{color:var(--ink)}
body.desk .credit i{background:rgba(28,29,28,.3)}
.credit{display:flex;align-items:center;justify-content:center;gap:14px;padding-left:.16em;color:var(--on-2);text-shadow:0 1px 18px rgba(0,0,0,.35);font-size:12px;letter-spacing:.16em;line-height:1;white-space:nowrap}
.credit b{font-weight:500;color:var(--on)}
.credit i{width:1px;height:12px;background:var(--rule);display:block}
/* Rev 17.7 (Jason): his credit in deep charcoal, full strength, one weight up; a soft light halo keeps it readable over dark scenes */
.credit,body.desk .credit{color:#232423;font-weight:500;text-shadow:0 0 1px rgba(244,241,234,.55),0 0 12px rgba(244,241,234,.6)}
@media (max-width:980px){.top{flex-direction:column;gap:8px}.hint{top:calc(max(18px,env(safe-area-inset-top)) + 116px)}}
/* Rev 17.5: the Walk minimap, a glass card in the corner that opens up into a plan you can travel from */
.mm{--mms:196px;position:fixed;right:20px;bottom:max(44px,calc(env(safe-area-inset-bottom) + 44px));width:var(--mms);height:var(--mms);display:none;border-radius:20px;background:var(--glass-2);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--rule);overflow:hidden;touch-action:none;transition:width .55s cubic-bezier(.2,.75,.2,1),height .55s cubic-bezier(.2,.75,.2,1)}
.mm.on{display:block}
.mm.big{width:var(--mmb);height:var(--mmb)}
.mm canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mm .fl{position:absolute;left:14px;top:12px;font-size:9.5px;color:var(--on-3);pointer-events:none;transition:opacity .3s}
.mm.big .fl{opacity:0}
.mm .fls{position:absolute;left:10px;top:10px;height:30px;--pad:2px;opacity:0;visibility:hidden;transition:opacity .3s .15s,visibility 0s .45s}
.mm.big .fls{opacity:1;visibility:visible;transition:opacity .3s .2s,visibility 0s}
.mm .fls button{padding:0 12px 0 calc(12px + .16em);font-size:10px}
.mm .tip{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:9.5px;color:var(--on-2);pointer-events:none}
.mm .tip:empty{display:none}
/* Rev 17.5 (Jason): the turntable turns either way and at 1x or 2x; the two small keys show only while it runs */
.motion .sub{display:none;padding:0 12px 0 calc(12px + .16em);min-width:44px}
.motion.spin .sub{display:flex}
.motion .sub svg{transition:transform .35s}
.motion #spDir[aria-pressed="true"] svg{transform:scaleX(-1)}
.motion .sub[aria-pressed="true"]{background:transparent;color:var(--on)}
.stick{position:fixed;left:28px;bottom:120px;width:120px;height:120px;border-radius:50%;border:1px solid var(--rule);background:rgba(20,19,17,.22);display:none;pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(244,241,234,.8)}
.cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(244,241,234,.75);display:none;pointer-events:none}
.load{position:fixed;inset:0;z-index:5;background:#14120f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity 1.1s ease,visibility 1.1s}
.load.done{opacity:0;visibility:hidden}
.load .t{font-family:"Instrument Serif",serif;font-size:44px}
.load .bar{width:180px;height:1px;background:rgba(244,241,234,.15);overflow:hidden}
.load .bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .4s}
.shot .hud,.shot .load{display:none}
@media (max-width:640px){
  :root{--h:38px}
  .top{left:12px;right:12px;transform:none;flex-direction:column;align-items:stretch;gap:8px}
  .modes button{flex:1;padding:0 0 0 .16em}
  .tools{gap:6px;justify-content:center}
  .motion{flex:1}
  .motion button{flex:1;padding:0 0 0 .16em}
  .motion button svg,.ctl .lg{display:none}
  .ctl{padding:0 14px 0 13px;gap:8px}
  .ctl.dd .lw,.ctl.dd .c{display:none}
  .tools .ctl{padding:0 10px 0 10px;gap:6px;letter-spacing:.1em}
  .tools{gap:5px}
  .menu{min-width:180px}
  .views{left:12px;right:12px;top:auto;bottom:calc(env(safe-area-inset-bottom) + 104px);max-height:calc(100vh - 220px - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-width:0}
  .views.on{display:none}
  .views.on.open{display:flex}
  .views button{height:38px;flex:none}
  .vstep.on{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 56px);display:flex;align-items:center;gap:2px;padding:var(--pad)}
  .vstep button{height:100%;border-radius:999px;background:transparent;color:var(--on-2);display:flex;align-items:center;justify-content:center}
  .vstep .ar{width:44px;flex:none}
  .vstep .ar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .vstep .lb{flex:1;min-width:0;gap:10px;padding-left:.16em;color:var(--on)}
  .vstep .lb .g{color:var(--on-3)}
  .vstep .lb .c{width:8px;height:8px;flex:none;fill:none;stroke:var(--on-3);stroke-width:1.3;transition:transform .3s}
  .vstep.open .lb .c{transform:rotate(180deg)}
  .go{left:12px;top:calc(max(18px,env(safe-area-inset-top)) + 96px);bottom:auto}
  .hint{top:auto;bottom:calc(env(safe-area-inset-bottom) + 106px);font-size:9.5px;line-height:1.7;white-space:normal;text-align:center;width:300px}
  .cap{bottom:calc(env(safe-area-inset-bottom) + 24px);gap:10px}
  .cap .tl{height:38px;padding:0 16px 0 calc(16px + .18em);font-size:11.5px;letter-spacing:.18em}
  .credit{gap:10px;font-size:10px;letter-spacing:.12em}
  .mm{--mms:140px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 64px);border-radius:16px}
  .pan{right:12px;bottom:auto;top:calc(max(18px,env(safe-area-inset-top)) + 100px);width:104px;height:104px}
  .pan .u{left:33px}.pan .d{left:33px}.pan .l{top:33px}.pan .r{top:33px}.pan .c{left:39px;top:39px}
}
/* Rev 17.6 (Jason): one navigation bar along the top. Pills with a 12px corner, layman words: Explore, Views, Aerials,
   Lighting, Plans; the rest under More. A playback bar at the foot for anything that moves, and the walk's stops at the left. */
.top{flex-direction:row!important}
.nav{display:flex;align-items:center;gap:4px;padding:4px;border-radius:16px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--rule)}
.pill{appearance:none;border:0;height:36px;display:flex;align-items:center;gap:9px;padding:0 14px 0 calc(16px + .16em);border-radius:12px;background:transparent;color:var(--on-2);font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;line-height:1;cursor:pointer;white-space:nowrap;transition:background .35s,color .35s}
.pill:hover{color:var(--on)}
.pill[aria-pressed="true"]{background:var(--on);color:var(--ink)}
.pill .sv{color:var(--on-3);transition:color .35s}
.pill .sv:empty{display:none}
.pill[aria-pressed="true"] .sv{color:rgba(28,29,28,.5)}
.pill .c{width:8px;height:8px;flex:none;fill:none;stroke:currentColor;stroke-width:1.3;opacity:.6;transition:transform .3s}
.pill[aria-expanded="true"] .c{transform:rotate(180deg)}
.pill.more{padding:0 13px}
.pill.more svg{width:16px;height:4px;fill:currentColor}
.nmenu{border-radius:16px;min-width:232px;max-height:calc(100vh - 120px);overflow-y:auto;scrollbar-width:none}
.nmenu::-webkit-scrollbar{display:none}
.nmenu .mono:not(:first-child){margin-top:4px;border-top:1px solid var(--rule);padding-top:12px}
.nmenu button{border-radius:10px;height:auto;min-height:36px;padding:9px 12px 9px 14px}
.nmenu button .d{color:var(--on-3);font-size:9.5px;letter-spacing:.12em;transition:color .35s}
.nmenu button[aria-pressed="true"] .d{color:rgba(28,29,28,.5)}
.nmenu .tg{justify-content:flex-start;gap:12px}
.nmenu .tg i{width:7px;height:7px;border-radius:50%;box-sizing:border-box;border:1px solid var(--on-3);flex:none;transition:background .35s,border-color .35s}
.nmenu .tg[aria-pressed="true"]{background:transparent;color:var(--on)}
.nmenu .tg[aria-pressed="true"] i{background:var(--brass);border-color:var(--brass)}
.nmenu .dim .sl{display:flex;align-items:center;gap:12px;padding:2px 12px 10px 33px;transition:opacity .35s}
.nmenu .dim .sl.off{opacity:.4}
.nmenu .dim input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:2px;margin:0;border-radius:2px;outline:none;cursor:pointer;background:linear-gradient(90deg,var(--brass) var(--v,50%),var(--rule) var(--v,50%))}
.nmenu .dim input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--on);border:0;box-shadow:0 0 0 3px rgba(184,146,90,.35)}
.nmenu .dim input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--on);border:0;box-shadow:0 0 0 3px rgba(184,146,90,.35)}
.nmenu .dim input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(184,146,90,.8)}
.nmenu .dim .pc{width:34px;text-align:right;font-size:9.5px;letter-spacing:.12em;color:var(--on-3)}
.nmenu .tod{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px;margin:0 4px 4px;border-radius:12px;background:rgba(244,241,234,.06)}
.nmenu .tod button{justify-content:center;padding:0;min-height:34px;font-size:10px;letter-spacing:.1em;border-radius:10px}
.wk{position:fixed;left:20px;top:calc(max(18px,env(safe-area-inset-top)) + 70px);width:236px;display:none;flex-direction:column;padding:6px;border-radius:16px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--rule);max-height:calc(100vh - 200px)}
.wk.on{display:flex}
.wk .wh{display:flex;justify-content:space-between;padding:10px 12px 8px}
.wk .wh .mono{font-size:9.5px;color:var(--on-3)}
.wk .wl{display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:none}
.wk .wl::-webkit-scrollbar{display:none}
.wk .wl button{appearance:none;border:0;background:transparent;color:var(--on-2);display:flex;align-items:center;gap:12px;min-height:36px;padding:0 10px 0 12px;border-radius:10px;font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-align:left;transition:background .35s,color .35s}

function worldUV(pos){
  const n=pos.count, uv=new Float32Array(n*2), a=new THREE.Vector3(), b=new THREE.Vector3(), c=new THREE.Vector3(), nn=new THREE.Vector3();
  for(let i=0;i<n;i+=3){
    a.fromBufferAttribute(pos,i);b.fromBufferAttribute(pos,i+1);c.fromBufferAttribute(pos,i+2);
    nn.subVectors(b,a).cross(c.clone().sub(a)); const ax=Math.abs(nn.x),ay=Math.abs(nn.y),az=Math.abs(nn.z);
    for(let k=0;k<3;k++){const p=[a,b,c][k];let u,v;if(az>=ax&&az>=ay){u=p.x;v=p.y;}else if(ax>=ay){u=p.y;v=p.z;}else{u=p.x;v=p.z;}uv[(i+k)*2]=u;uv[(i+k)*2+1]=v;}
  }
  return new THREE.BufferAttribute(uv,2);
}
async function buildHouse(){
  const data = await (await fetch('lirio-mesh-r178.json',{cache:'no-store'})).json();
  setLoad(.45);
  for (const m of data.meshes){
    const g = new THREE.BufferGeometry();
    const pos = new THREE.BufferAttribute(new Float32Array(m.p),3);
    g.setAttribute('position',pos); g.setAttribute('uv',worldUV(pos)); g.computeVertexNormals();
    let mat = MAT[m.mat] || MAT.stucco;
    if (mat.map && mat.userData.tile){ mat.map.repeat.set(1/mat.userData.tile,1/mat.userData.tile); }
    const mesh = new THREE.Mesh(g, mat);
    const isGlass = m.kind==='glass', isWater = m.kind==='water';
    mesh.castShadow = !isGlass && !isWater && m.mat!=='sea' && m.mat!=='ground';
    mesh.receiveShadow = !isGlass;
    mesh.userData.kind = m.kind; mesh.userData.mat = m.mat;
    if (m.mat==='marble'){   // Rev 17.8: smooth the statue: average each vertex's normal with its neighbours' within 60 deg
      const p = g.attributes.position.array, nr = g.attributes.normal.array, B = new Map(), out = new Float32Array(nr.length);
      for (let i = 0; i < p.length / 3; i++){ const k = Math.round(p[i*3]*20)+','+Math.round(p[i*3+1]*20)+','+Math.round(p[i*3+2]*20); let b = B.get(k); if (!b) B.set(k, b = []); b.push(i); }
      for (const b of B.values()) for (const i of b){ let x=0,y=0,z=0; for (const j of b){ if (nr[i*3]*nr[j*3]+nr[i*3+1]*nr[j*3+1]+nr[i*3+2]*nr[j*3+2] > .5){ x+=nr[j*3]; y+=nr[j*3+1]; z+=nr[j*3+2]; } } const l = Math.hypot(x,y,z)||1; out[i*3]=x/l; out[i*3+1]=y/l; out[i*3+2]=z/l; }
      g.setAttribute('normal', new THREE.BufferAttribute(out, 3));
    }
    if (m.kind==='model' || m.kind==='deskonly') mesh.visible=false;   // Rev 10: the model's ground plane shows on the desk model only
    house.add(mesh);
    if (!NOEDGE.has(m.mat) && m.kind!=='water'){

      const ln = new LineSegments2(lg, LINEMAT); ln.castShadow = ln.receiveShadow = false; ln.renderOrder = 3; ln.userData.nobb = true; ln.userData.kind = 'lines';
      mesh.add(ln); mesh.userData.edges = e.attributes.position.array.slice(); e.dispose();
    }

    if (['walk','solid','model','shore'].includes(m.kind)) walkers.push(mesh);

  }

}

const cFrond = [new THREE.Color(0x2c4620), new THREE.Color(0x3f5d29), new THREE.Color(0x506d33), new THREE.Color(0x365224)];
function crownGeo(L, nF, s0){
  seed = s0;
  const pos=[], col=[];
  const tri=(a,b,c,cl)=>{pos.push(...a,...b,...c); for(let i=0;i<3;i++) col.push(cl.r,cl.g,cl.b);};
  for (let f=0; f<nF; f++){
    const az = f/nF*Math.PI*2 + rnd(-.18,.18);
    const ring = f%3;                                  // three tiers: upright, spreading, drooping
    const tilt = [-.75,-.25,.25][ring] + rnd(-.15,.15); // pitch of the frond base
    const Lf = L*rnd(.82,1.12)*(ring===0?.85:1);
    const droop = [.25,.55,.85][ring]*rnd(.8,1.2);
    const ca=Math.cos(az), sa=Math.sin(az), ct=Math.cos(tilt), st=Math.sin(tilt);
    const P = (x,y,z)=>{ // frond-local (x along rachis, y side, z up) -> crown
      const x1 = x*ct + z*st, z1 = -x*st + z*ct;
      return [x1*ca - y*sa, x1*sa + y*ca, z1];
    };
    const rach = t => [Lf*t, 0, -droop*Lf*t*t*.55];
    const tint = cFrond[(f+ring)%4].clone().offsetHSL(0, 0, rnd(-.03,.04));
    const nL = 24;
    for (let i=1;i<=nL;i++){
      const t=i/(nL+1), r0=rach(t), r1=rach(Math.min(1,t+.035));
      const ll = Lf*(.36*Math.sin(Math.PI*Math.min(1,t*.92+.1))+.04)*(1-.25*t);
      for (const sd of [-1,1]){
        const fw=.42, sw=.82, dn=-.28-.25*t;
        const tip=[r0[0]+fw*ll, sd*sw*ll, r0[2]+dn*ll];
        const mid=[r0[0]+fw*ll*.5, sd*sw*ll*.5 , r0[2]+dn*ll*.5+ll*.05];
        tri(P(...r0), P(...r1), P(...mid), tint);
        tri(P(...mid), P(...r1), P(...tip), tint);
      }
    }
    // rachis strip
    for (let i=0;i<10;i++){const a=rach(i/10), b=rach((i+1)/10); tri(P(a[0],-1.2,a[2]),P(b[0],-1,b[2]),P(b[0],1,b[2]),tint); tri(P(a[0],-1.2,a[2]),P(b[0],1,b[2]),P(a[0],1.2,a[2]),tint);}
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.computeVertexNormals();
  return g;
}
function trunkGeo(){
  const g=new THREE.CylinderGeometry(5.2,7.5,1,12,6,true); g.rotateX(Math.PI/2); g.translate(0,0,.5);
  const p=g.attributes.position; for(let i=0;i<p.count;i++){const z=p.getZ(i); if(z<.08){const k=1+(.08-z)*4; p.setX(i,p.getX(i)*k); p.setY(i,p.getY(i)*k);} }
  g.computeVertexNormals(); return g;
}
function shrubGeo(){
  // Rev 11: soft, rounded mounds (smooth low-frequency swell, smooth shading), no faceted spikes
  const g=new THREE.IcosahedronGeometry(1,4); const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i); const k=1+.07*Math.sin(3.1*x+1.3)*Math.cos(2.7*y+.4)+.05*Math.sin(4.3*z+2.1*x); p.setXYZ(i,x*k,y*k,z*k);}
  g.computeVertexNormals(); return g;
}

// Rev 17.2 (Jason): "a long trough of bamboo", "tall. 6'+". Clumping bamboo: olive culms leaning out of each clump, leaf sprays
// from a little under half height to the top, two staggered rows down the street trough
function addBamboo(list){
  if (!list || !list.length) return;
  const seed0=seed;
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), q2=new THREE.Quaternion(), Z=new THREE.Vector3(0,0,1);
  const cg=new THREE.CylinderGeometry(.55,.72,1,6,1,true); cg.rotateX(Math.PI/2); cg.translate(0,0,.5);
  const cMat=new THREE.MeshStandardMaterial({color:0x8d9850,roughness:.5});
  // one leaf spray: a short twig with five narrow leaves fanning out and drooping (built along +x, droop in -z)
  const pos=[], col=[], c=new THREE.Color();
  for (let i=0;i<5;i++){
    const a=-.9+i*.45, bx=2+i*1.6, L=7.5-Math.abs(i-2)*.6, w=.45;
    const dx=Math.cos(a), dy=Math.sin(a), tip=[bx+dx*L, dy*L, -2.2-i%2*.6], px=-dy*w, py=dx*w, mid=[bx+dx*L*.45, dy*L*.45, -.6];
    const tri=(p0,p1,p2)=>{ pos.push(...p0,...p1,...p2); };
    tri([bx,0,0],[mid[0]+px,mid[1]+py,mid[2]],tip); tri([bx,0,0],tip,[mid[0]-px,mid[1]-py,mid[2]]);
    c.setHSL(.24+i*.008, .42, .26+(i%2)*.05); for (let k=0;k<6;k++) col.push(c.r,c.g,c.b);
  }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); sg.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); sg.computeVertexNormals();
  const culms=[], sprays=[];
  list.forEach(([x,y,z,h],ci)=>{
    seed=7000+ci*41; const n=10+Math.floor(rnd(0,4.99));
    for (let j=0;j<n;j++){
      const a=rnd(0,6.283), r0=rnd(0,7), lean=rnd(.02,.12), H=h*rnd(.78,1.04);
      const base=new THREE.Vector3(x+Math.cos(a)*r0, y+Math.sin(a)*r0, z-1);
      q.setFromAxisAngle(new THREE.Vector3(-Math.sin(a),Math.cos(a),0), lean);
      culms.push(new THREE.Matrix4().compose(base, q, new THREE.Vector3(1,1,H)));
      for (let zz=H*.42; zz<H; zz+=rnd(8,13)){
        const k=1+(rnd(0,1)<.35?1:0);
        for (let m=0;m<k;m++){
          const p=new THREE.Vector3(0,0,zz).applyQuaternion(q).add(base);
          q2.setFromAxisAngle(Z, rnd(0,6.283)); const s_=rnd(.85,1.35)*(1-.25*(zz/H));
          sprays.push(new THREE.Matrix4().compose(p, q2, new THREE.Vector3(s_,s_,s_)));
        }
      }
      const top=new THREE.Vector3(0,0,H).applyQuaternion(q).add(base);     // a crown of sprays at the tip
      for (let m=0;m<4;m++){ q2.setFromAxisAngle(Z, m*1.57+rnd(-.3,.3)); sprays.push(new THREE.Matrix4().compose(top, q2, new THREE.Vector3(.9,.9,.9))); }
    }
  });
  const cm=new THREE.InstancedMesh(cg, cMat, culms.length); culms.forEach((mm,i)=>cm.setMatrixAt(i,mm));
  const sm=new THREE.InstancedMesh(sg, MAT.frond, sprays.length); sprays.forEach((mm,i)=>sm.setMatrixAt(i,mm));
  cm.castShadow=cm.receiveShadow=sm.castShadow=sm.receiveShadow=true; house.add(cm); house.add(sm);
  seed=seed0;
}

/* ---------- Rev 17.5: landscape lighting (Jason: "when I turn on the landscape lighting I can see the outside illuminate") ----------
   The fixtures come from the model (data.land). Warm 2700K throughout, the water lights a cool white.
   Each fixture draws its own light: pools on the ground, a soft shaft up each trunk, the crowns lit from below,
   the step and bench strips, the pergola downlights and the dock. A few real lights carry it onto the house and the paving. */
const landG = new THREE.Group(); landG.name = 'landG'; landG.visible = false; house.add(landG);

function glowTex(kind){
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); let gr;
  if (kind === 'r'){ gr = g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.3,'rgba(255,255,255,.5)'); gr.addColorStop(.65,'rgba(255,255,255,.14)'); gr.addColorStop(1,'rgba(255,255,255,0)'); }

  const pool = (x, y, z, rx, ry, op, col) => put(new THREE.Mesh(new THREE.PlaneGeometry(rx*2, ry*2), gm(TR, op, col)), x, y, z);
  const sprite = (x, y, z, r, op, col=LW) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({map:TR, color:col, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false})); s.scale.set(r*2, r*2, 1); return put(s, x, y, z); };
  const shaft = (x, y, z, h, r0, r1, op, map) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, h, 28, 1, true), gm(map, op)); m.rotation.x = Math.PI/2; return put(m, x, y, z + h/2); };
  const strip = (x0, x1, y, z, h, op, map) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, h), gm(map, op)); m.rotation.x = Math.PI/2; return put(m, (x0 + x1)/2, y, z + h/2); };
  const sheet = (x0, x1, y0, y1, z, op, map) => put(new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, y1 - y0), gm(map, op)), (x0 + x1)/2, (y0 + y1)/2, z);
  const fixG = new THREE.Group(); house.add(fixG);    // the fixtures themselves stay in the model by day

      put(new THREE.Mesh(new THREE.CircleGeometry(2.2, 16), lamp_), x, y, z + .7);
      pool(x, y + 8, z + .8, 30, 36, .5);

      else if (k === 2){ shaft(x, ty, z, h*.6, 8, 46, .18, TB); sprite(x, ty, z + h*.62, 70, .32); }
      else { shaft(x, ty, z, h*.92, 6, 20, .2, TB); sprite(x, ty, z + h - 22, k === 1 ? 74 : 104, .36); }
    } else if (t === 'path'){        // 12" louvered bronze bollard in the sea bed, throwing light onto the promenade

      const [, x, y0, y1, z] = l;
      put(new THREE.Mesh(new THREE.BoxGeometry(.5, y1 - y0, .8), lamp_), x - .5, (y0 + y1)/2, z + 7.6);
      const st = new THREE.Mesh(new THREE.PlaneGeometry(y1 - y0, 6.4), gm(TT, .42)); st.rotation.set(Math.PI/2, Math.PI/2, 0); put(st, x - .7, (y0 + y1)/2, z + 5.2);

  }

/* ---------- Rev 17.8.3 (Jason): Desk, top left, back to the desk. The shared Umbrella session controls (umbrella/shared/session/v2):
   Desk, Save, an hourly auto-save that overwrites one backup, and the exit prompts. What the model saves is the walk path. ---------- */
/* Umbrella session controls (shared by every module).
   - Desk: leaves the module for the desk. With unsaved changes it first asks
     "Do you wish to save your changes before exiting?" then, if they leave without saving, "Are you sure?"
   - Save: writes the saved copy (Ctrl/Cmd+S too). Saving stays the user's job.
   - Auto-save: once an hour, one backup copy, each one overwriting the last. Restorable from the Save menu.
   Usage: const S = UmbrellaSession({ id:'ledger', get:()=>state, set:s=>{...}, deskUrl, deskEl, saveEl, sound:{click(){}} });
          S.change() after every edit. Load with S.load(fallback). */
function UmbrellaSession(o) {
  const K = 'umbrella:' + o.id, KS = K + ':saved', KA = K + ':autosave', HOUR = 3600e3;
  const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
  const fmt = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const day = t => { const d = new Date(t), n = new Date(); return d.toDateString() === n.toDateString() ? fmt(t) : d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + fmt(t); };
  let dirty = false, savedAt = null, lastSnap = null;
  const svgL = '<svg viewBox="0 0 14 14"><path d="M12 7H2M6 3 2 7l4 4"/></svg>';
  o.deskEl.innerHTML = `<button type="button" class="us-desk" aria-label="Back to desk">${svgL}<b>Desk</b></button>`;
  o.saveEl.innerHTML = `<div class="us-savew"><button type="button" class="us-save" aria-haspopup="true" aria-expanded="false"><i></i><b>Save</b><small></small></button>
    <div class="us-menu" role="menu"><button type="button" data-a="save"><b>Save now</b><span>⌘S</span></button><hr>
    <button type="button" data-a="restore"><b>Restore auto-save</b><span class="us-at">None yet</span></button></div></div>`;
  document.body.insertAdjacentHTML('beforeend', `<div class="us-modal" role="dialog" aria-modal="true" aria-labelledby="usH1"><div class="us-veil"></div><div class="us-card">
    <div class="us-step" data-s="1"><small>${o.title || 'Leaving'}</small><h3 id="usH1">Do you wish to save your changes before exiting?</h3>
      <div class="us-acts"><button type="button" class="us-btn quiet" data-a="cancel">Cancel</button><button type="button" class="us-btn" data-a="nosave">Exit without saving</button><button type="button" class="us-btn solid" data-a="saveexit">Save and exit</button></div></div>
    <div class="us-step" data-s="2" hidden><small>${o.title || 'Leaving'}</small><h3>Are you sure?</h3><p>Changes since your last save will be lost.</p>
      <div class="us-acts"><button type="button" class="us-btn" data-a="back">Go back</button><button type="button" class="us-btn solid" data-a="exit">Exit</button></div></div>
    <div class="us-step" data-s="3" hidden><small>Auto-save</small><h3>Restore the auto-save from <span class="us-at2"></span>?</h3><p>It replaces what's on screen now.</p>
      <div class="us-acts"><button type="button" class="us-btn" data-a="cancel">Cancel</button><button type="button" class="us-btn solid" data-a="dorestore">Restore</button></div></div>
  </div></div><div class="us-leave"><span>Desk</span></div><div class="us-toast"></div>`);
  const $ = s => document.querySelector(s);
  const saveBtn = o.saveEl.querySelector('.us-save'), menu = o.saveEl.querySelector('.us-menu'), modal = $('.us-modal'), toastEl = $('.us-toast');
  const click = () => o.sound && o.sound.click && o.sound.click();
  let tT; const toast = t => { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => toastEl.classList.remove('on'), 1800); };
  function paint() {
    saveBtn.classList.toggle('dirty', dirty);
    saveBtn.querySelector('small').textContent = dirty ? 'Unsaved' : savedAt ? 'Saved ' + fmt(savedAt) : '';
    const a = ls.get(KA); const r = menu.querySelector('[data-a="restore"]');
    r.disabled = !a; menu.querySelector('.us-at').textContent = a ? day(a.t) : 'None yet';
  }
  function save(quiet) { const ok = ls.set(KS, { t: Date.now(), s: o.get() }); if (ok) { dirty = false; savedAt = Date.now(); paint(); if (!quiet) toast('Saved ' + fmt(savedAt)); } return ok; }
  function autosave() {
    const snap = JSON.stringify(o.get());
    if (snap === lastSnap) return;
    if (ls.set(KA, { t: Date.now(), s: o.get() })) { lastSnap = snap; paint(); }
  }
  function show(step) { modal.querySelectorAll('.us-step').forEach(e => e.hidden = e.dataset.s !== String(step)); modal.classList.add('open'); setTimeout(() => { const b = modal.querySelector(`.us-step[data-s="${step}"] .solid`); b && b.focus(); }, 60); }
  function hide() { modal.classList.remove('open'); }
  function leave() {
    dirty = false; $('.us-leave').classList.add('on');
    setTimeout(() => { if (o.deskUrl) { const a = document.createElement('a'); a.href = o.deskUrl; a.target = '_top'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); } }, 650);
    setTimeout(() => $('.us-leave').classList.remove('on'), 4000);
  }
  function exit() { click(); if (dirty) show(1); else leave(); }
  o.deskEl.querySelector('.us-desk').addEventListener('click', exit);
  saveBtn.addEventListener('click', e => { click(); const op = !menu.classList.contains('open'); menu.classList.toggle('open', op); saveBtn.setAttribute('aria-expanded', op); paint(); e.stopPropagation(); });
  document.addEventListener('click', e => { if (!o.saveEl.contains(e.target)) { menu.classList.remove('open'); saveBtn.setAttribute('aria-expanded', 'false'); } });
  menu.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; click(); menu.classList.remove('open'); saveBtn.setAttribute('aria-expanded', 'false');
    if (b.dataset.a === 'save') save();
    if (b.dataset.a === 'restore') { const a = ls.get(KA); if (a) { $('.us-at2').textContent = day(a.t); show(3); } }
  });
  modal.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (e.target.classList.contains('us-veil')) return hide(); if (!b) return; click();
    const a = b.dataset.a;
    if (a === 'cancel') hide();
    if (a === 'back') show(1);
    if (a === 'nosave') show(2);
    if (a === 'saveexit') { hide(); save(true); leave(); }
    if (a === 'exit') { hide(); leave(); }
    if (a === 'dorestore') { const r = ls.get(KA); hide(); if (r) { o.set(r.s); dirty = true; paint(); toast('Auto-save restored'); } }
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    if (e.key === 'Escape' && modal.classList.contains('open')) hide();
  });
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  // hourly auto-save, counted from the last one so it survives reloads
  function schedule() { const a = ls.get(KA); const due = a ? Math.max(5e3, a.t + HOUR - Date.now()) : HOUR; setTimeout(() => { autosave(); schedule(); }, Math.min(due, HOUR)); }
  return {
    load(fallback) { const s = ls.get(KS); if (s) { savedAt = s.t; } const a = ls.get(KA); if (a) lastSnap = JSON.stringify(a.s); schedule(); paint(); return s ? s.s : fallback; },
    change() { if (!dirty) { dirty = true; paint(); } },
    save, autosave, isDirty: () => dirty
  };
}
