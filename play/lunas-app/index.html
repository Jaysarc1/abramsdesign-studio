<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luna's Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@400..800&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#120c08}
  body{min-height:100vh;min-height:100dvh;overflow:hidden;background:
    radial-gradient(70% 60% at 50% 42%,rgba(232,184,74,.07),rgba(0,0,0,0) 70%),
    radial-gradient(120% 90% at 30% 10%,#3a2516 0%,#24160d 45%,#120b07 100%)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background:repeating-linear-gradient(94deg,rgba(255,220,180,.025) 0 2px,rgba(0,0,0,0) 2px 9px,rgba(0,0,0,.05) 9px 11px,rgba(0,0,0,0) 11px 23px)}
  /* phone frame */
  .stage{position:fixed;inset:0;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center}
  .phone{position:relative;width:375px;height:780px;padding:11px;border-radius:58px;background:linear-gradient(145deg,#2a2b33,#0b0b0e 40%,#1c1d23);box-shadow:0 0 0 1px rgba(255,255,255,.07),inset 0 0 0 1.5px rgba(255,255,255,.06),0 60px 120px rgba(0,0,0,.6),0 20px 40px rgba(0,0,0,.45);transform-origin:50% 50%;box-sizing:content-box}
  .phone .screen{position:relative;width:375px;height:780px;border-radius:47px;overflow:hidden;background:#0D0F1C;transform:translateZ(0)}
  .phone .island{position:absolute;left:50%;top:22px;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#000;z-index:200}
  /* full */
  .full{position:fixed;inset:0}
  /* panel */
  .panel{width:460px;height:min(880px,calc(100vh - 64px));border-radius:32px;overflow:hidden;box-shadow:0 0 0 1px rgba(232,184,74,.14),0 50px 120px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
/* Luna's Coffee - Flagship ordering app
   window.LunaOrder.mount(el, { variant:'phone'|'full', imgBase:'img/', fast:false, name:'Alex' })
   Events on window: 'luna:order' {id,name,lines,subtotal,tax,tip,total,pickup,placedAt}
                     'luna:order-stage' {id,stage}                                         */
(function () {
  'use strict';
  if (window.LunaOrder) return;

  /* ---------- data ---------- */
  var MENU = [
    { id: 'crescent', name: 'Crescent Latte', line: 'Brown butter, sea salt', price: 6.25, cat: 'Coffee', img: 'latte' },
    { id: 'cappuccino', name: 'Cappuccino', line: 'Equal parts, dry foam', price: 5.00, cat: 'Coffee', img: 'cappuccino' },
    { id: 'flatwhite', name: 'Flat White', line: 'Ristretto, silk milk', price: 5.25, cat: 'Coffee', img: 'flatwhite' },
    { id: 'espresso', name: 'Espresso', line: 'House blend, double', price: 3.50, cat: 'Coffee', img: 'espresso' },
    { id: 'moonlight', name: 'Moonlight Cold Brew', line: 'Vanilla bean cold foam', price: 5.75, cat: 'Cold', img: 'coldbrew' },
    { id: 'matcha', name: 'Ceremonial Matcha', line: 'Oat milk, honey', price: 6.00, cat: 'Cold', img: 'matcha' },
    { id: 'croissant', name: 'Butter Croissant', line: 'Laminated in house', price: 4.25, cat: 'Bakery', img: 'croissant' },
    { id: 'painchoc', name: 'Pain au Chocolat', line: 'Dark chocolate batons', price: 4.75, cat: 'Bakery', img: 'painchoc' },
    { id: 'cookie', name: 'Midnight Cookie', line: 'Dark chocolate, flaky salt', price: 3.75, cat: 'Bakery', img: 'cookie' },
    { id: 'toast', name: 'Avocado Toast', line: 'Sourdough, chili crisp', price: 12.00, cat: 'Kitchen', img: 'toast' }
  ];
  var CATS = ['Coffee', 'Cold', 'Bakery', 'Kitchen'];
  /* option groups + defaults per item */
  var CFG = {
    crescent: { size: 8, temp: 'Hot', milk: 'Whole', shots: 2, sweet: 'Regular', extras: 1 },
    cappuccino: { size: 8, milk: 'Whole', shots: 2, sweet: 'None', extras: 1 },
    flatwhite: { milk: 'Whole', shots: 2, sweet: 'None', extras: 1 },
    espresso: { shots: 2, sweet: 'None' },
    moonlight: { size: 8, sweet: 'Light', extras: 1 },
    matcha: { size: 8, temp: 'Iced', milk: 'Oat', sweet: 'Light', extras: 1 },
    croissant: { warm: false },
    painchoc: { warm: true },
    cookie: { warm: false },
    toast: { egg: false }
  };
  var SIZE_D = { 8: 0, 12: 0.75, 16: 1.25 };
  var MILKS = ['Whole', 'Oat', 'Almond', 'Skim'];
  var PAID_MILK = { Oat: 1, Almond: 1 };
  var SWEETS = ['None', 'Light', 'Regular'];
  var TIPS = [0, 15, 18, 20];
  var TAX = 0.07;
  var GOAL = 50;
  var byId = {};
  MENU.forEach(function (m) { byId[m.id] = m; });

  /* ---------- helpers ---------- */
  var uid = 0;
  function r2(n) { return Math.round(n * 100) / 100; }
  function money(n) { return '$' + (Math.round(n * 100) / 100).toFixed(2); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtTime(d) { return new Date(d).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
  function fmtDate(d) { return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  function titleHTML(name) {
    var p = name.split(' ');
    if (p.length < 2) return esc(name);
    var last = p.pop();
    return esc(p.join(' ')) + ' <em>' + esc(last) + '</em>';
  }
  function catKey(c) { return c.toLowerCase(); }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

  var I = {
    x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    back: '<path d="M14.5 5.5L8 12l6.5 6.5"/>',
    down: '<path d="M5.5 9.5L12 16l6.5-6.5"/>',
    right: '<path d="M9.5 5.5L16 12l-6.5 6.5"/>',
    plus: '<path d="M12 5.5v13M5.5 12h13"/>',
    minus: '<path d="M5.5 12h13"/>',
    check: '<path d="M5.5 12.5l4.2 4.2L18.5 8"/>',
    trash: '<path d="M5 7.5h14M9.5 7.5V5.2h5v2.3M7 7.5l.8 11.3h8.4L17 7.5M10.3 10.8v4.9M13.7 10.8v4.9"/>',
    bag: '<path d="M5.8 8.6h12.4l-.9 11.2H6.7z"/><path d="M9.2 10.2V7.4a2.8 2.8 0 0 1 5.6 0v2.8"/>',
    cup: '<path d="M5.5 9.5h10.5v4.3a5 5 0 0 1-5 5h-.5a5 5 0 0 1-5-5z"/><path d="M16 10.8h1.4a2.4 2.4 0 0 1 0 4.8H16"/><path d="M9 3.8c-.7.9.7 1.8 0 2.7M12.4 3.8c-.7.9.7 1.8 0 2.7"/>',
    moon: '<path d="M18.8 14.6A7.3 7.3 0 0 1 9.4 5.2a7.3 7.3 0 1 0 9.4 9.4z"/>',
    star: '<path d="M12 4.3l2.3 4.8 5.2.7-3.8 3.6.9 5.2-4.6-2.5-4.6 2.5.9-5.2-3.8-3.6 5.2-.7z"/>',
    pin: '<path d="M12 20.5s-6-5.2-6-10.2a6 6 0 0 1 12 0c0 5-6 10.2-6 10.2z"/><circle cx="12" cy="10.3" r="2.1"/>',
    reorder: '<path d="M5 12a7 7 0 0 1 12.2-4.7M19 12a7 7 0 0 1-12.2 4.7"/><path d="M17.6 4.3v3.4h-3.4M6.4 19.7v-3.4h3.4"/>',
    card: '<rect x="3.8" y="6.3" width="16.4" height="11.4" rx="2"/><path d="M3.8 10h16.4M7 14.3h3"/>',
    gift: '<rect x="4.5" y="9" width="15" height="10.5" rx="1.5"/><path d="M4 9h16M12 9v10.5M12 9c-1.5-3.6-5.3-3.6-5 -1.2C7.2 9 9.6 9 12 9zM12 9c1.5-3.6 5.3-3.6 5-1.2C16.8 9 14.4 9 12 9z"/>'
  };
  function ic(n, s) { s = s || 22; return '<svg class="lo-ic" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + I[n] + '</svg>'; }
  function mark(sz, col, bg) {
    var id = 'lom' + (++uid);
    return '<svg class="lo-mark" viewBox="0 0 64 64" width="' + sz + '" height="' + sz + '" aria-hidden="true"><defs><mask id="' + id + '"><rect width="64" height="64" fill="#fff"/><circle cx="41" cy="24" r="17" fill="#000"/></mask></defs><circle cx="31" cy="33" r="22" fill="' + col + '" mask="url(#' + id + ')"/><g transform="translate(41 25) rotate(38)"><ellipse rx="7.2" ry="10.5" fill="' + col + '"/><path d="M0 -9.2C-3.6 -4.6 3.6 4.6 0 9.2" fill="none" stroke="' + bg + '" stroke-width="1.6" stroke-linecap="round"/></g></svg>';
  }
  var MARK_URI = 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><mask id="m"><rect width="64" height="64" fill="#fff"/><circle cx="41" cy="24" r="17" fill="#000"/></mask></defs><g fill="#E8B84A" fill-opacity=".13"><circle cx="31" cy="33" r="22" mask="url(#m)"/><g transform="translate(41 25) rotate(38)"><ellipse rx="7.2" ry="10.5"/></g></g></svg>') + '")';

  function ph(item, cls, base) {
    var slug = typeof item === 'string' ? item : item.img;
    var cat = typeof item === 'string' ? 'coffee' : catKey(item.cat);
    return '<div class="lo-ph lo-ph--' + cat + ' ' + (cls || '') + '"><img src="' + esc(base + slug + '.webp') + '" alt="" decoding="async" onload="this.classList.add(\'ok\')" onerror="this.remove()"></div>';
  }
  function ring(sz, stroke, frac, cls) {
    var r = (sz - stroke) / 2 - 1, c = 2 * Math.PI * r;
    return '<svg class="lo-ring ' + (cls || '') + '" viewBox="0 0 ' + sz + ' ' + sz + '" width="' + sz + '" height="' + sz + '" aria-hidden="true"><circle cx="' + sz / 2 + '" cy="' + sz / 2 + '" r="' + r + '" fill="none" stroke="rgba(243,236,223,.1)" stroke-width="' + stroke + '"/><circle class="lo-ring-p" cx="' + sz / 2 + '" cy="' + sz / 2 + '" r="' + r + '" fill="none" stroke="#E8B84A" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + (c * (1 - Math.max(0.001, Math.min(1, frac)))).toFixed(2) + '" transform="rotate(-90 ' + sz / 2 + ' ' + sz / 2 + ')" data-c="' + c.toFixed(2) + '"/></svg>';
  }
  function setRing(svg, frac) {
    if (!svg) return;
    var p = svg.querySelector('.lo-ring-p'); var c = +p.getAttribute('data-c');
    p.setAttribute('stroke-dashoffset', (c * (1 - Math.max(0.001, Math.min(1, frac)))).toFixed(2));
  }

  /* ---------- pricing ---------- */
  function defaults(id) {
    var d = CFG[id], o = { qty: 1 };
    for (var k in d) if (k !== 'extras') o[k] = d[k];
    if (d.extras) { o.vanilla = false; o.foam = false; }
    return o;
  }
  function unitPrice(id, o) {
    var it = byId[id], d = CFG[id], p = it.price;
    if (d.size != null) p += SIZE_D[o.size];
    if (d.milk && PAID_MILK[o.milk] && !PAID_MILK[d.milk]) p += 0.75;
    if (d.shots != null) p += Math.max(0, o.shots - 2) * 1;
    if (o.vanilla) p += 0.75;
    if (o.foam) p += 1;
    if (o.egg) p += 2.5;
    return r2(p);
  }
  function notesOf(id, o) {
    var d = CFG[id], n = [];
    if (d.size != null) n.push(o.size + ' oz');
    if (d.temp) n.push(o.temp);
    if (d.milk) n.push(o.milk);
    if (d.shots != null && o.shots !== 2) n.push(o.shots + (o.shots === 1 ? ' shot' : ' shots'));
    if (d.sweet && o.sweet !== d.sweet) n.push(o.sweet === 'None' ? 'Unsweetened' : o.sweet + ' sweet');
    if (o.vanilla) n.push('Vanilla bean');
    if (o.foam) n.push('Cold foam');
    if (o.warm) n.push('Warmed');
    if (o.egg) n.push('Jammy egg');
    return n.join(' \u00b7 ');
  }

  /* ---------- CSS ---------- */
  var CSS = [
    '.lo{--night:#0D0F1C;--deep:#161A31;--mid:#232946;--gold:#E8B84A;--gold2:#D9B26A;--cream:#F3ECDF;--muted:#A3A6B8;--line:rgba(243,236,223,.08);--line2:rgba(243,236,223,.15);--ease:cubic-bezier(.2,.7,.2,1);--g:20px;--sat:46px;--sab:24px;--tabh:56px;--mk:' + MARK_URI + ';',
    'position:relative;width:100%;height:100%;overflow:hidden;color:var(--cream);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;container:lo/inline-size;isolation:isolate;text-align:left;background:radial-gradient(120% 80% at 50% 0%,#1a1e38 0%,#0D0F1C 55%,#07080f 100%)}',
    '.lo *,.lo *::before,.lo *::after{box-sizing:border-box;margin:0;padding:0}',
    '.lo button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit;letter-spacing:inherit}',
    '.lo button:focus-visible,.lo [tabindex]:focus-visible{outline:1.5px solid var(--gold2);outline-offset:3px}',
    '.lo em{font-style:italic}',
    '.lo .lo-ic{display:block;flex:none}',
    '.lo .lo-serif{font-family:"Bodoni Moda",Didot,Georgia,serif;font-optical-sizing:auto}',
    '.lo--full{--sat:max(16px,env(safe-area-inset-top));--sab:max(12px,env(safe-area-inset-bottom))}',
    '.lo .lo-shell{position:absolute;inset:0;overflow:hidden;background:#04050a}',
    '@container lo (min-width:700px){.lo--full .lo-shell{inset:auto;left:50%;top:50%;width:430px;height:min(884px,calc(100% - 56px));transform:translate(-50%,-50%);border-radius:36px;box-shadow:0 0 0 1px rgba(232,184,74,.16),0 50px 140px rgba(0,0,0,.65),0 0 160px rgba(232,184,74,.05);--sat:22px;--sab:16px}}',
    /* main + views */
    '.lo .lo-main{position:absolute;inset:0;background:var(--night);overflow:hidden;transform-origin:50% 60%;transition:transform .7s var(--ease),border-radius .7s var(--ease),filter .7s var(--ease)}',
    '.lo .lo-shell.has-sheet .lo-main{transform:scale(.92);border-radius:26px;filter:brightness(.55)}',
    '.lo .lo-view{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s}',
    '.lo .lo-view.is-on{opacity:1;visibility:visible;transition:opacity .5s var(--ease)}',
    '.lo .lo-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tabh) + var(--sab) + 36px)}',
    '.lo .lo-scroll::-webkit-scrollbar{display:none}',
    '.lo .lo-shell.has-live .lo-scroll{padding-bottom:calc(var(--tabh) + var(--sab) + 104px)}',
    '.lo .lo-sbfade{position:absolute;left:0;right:0;top:0;height:var(--sat);z-index:15;background:var(--night);pointer-events:none}',
    /* status bar (phone variant) */
    '.lo .lo-statusbar{position:absolute;left:0;right:0;top:0;height:46px;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0 34px;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--cream);pointer-events:none;font-variant-numeric:tabular-nums}',
    '.lo .lo-statusbar .lo-sbi{display:flex;align-items:center;gap:6px}',
    '.lo .lo-homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(243,236,223,.7);z-index:90;pointer-events:none}',
    /* entrance */
    '@keyframes lo-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}',
    '@keyframes lo-fade{from{opacity:0}to{opacity:1}}',
    '@keyframes lo-bump{0%{transform:scale(1)}35%{transform:scale(1.32)}100%{transform:scale(1)}}',
    '@keyframes lo-spin{to{transform:rotate(360deg)}}',
    '@keyframes lo-glow{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:.9;transform:scale(1.04)}}',
    '@keyframes lo-pulse{0%{box-shadow:0 0 0 0 rgba(232,184,74,.45)}100%{box-shadow:0 0 0 10px rgba(232,184,74,0)}}',
    '.lo .lo-in{animation:lo-rise 1s var(--ease) both;animation-delay:calc(var(--d,0) * 1ms)}',
    /* top */
    '.lo .lo-top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 6px) var(--g) 0;min-height:calc(var(--sat) + 50px)}',
    '.lo .lo-brand{display:flex;align-items:center;gap:10px}',
    '.lo .lo-wm{display:flex;flex-direction:column;line-height:1}',
    '.lo .lo-wm b{font-family:Syne,Manrope,sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em}',
    '.lo .lo-wm small{font-weight:600;font-size:7.5px;letter-spacing:.32em;color:var(--muted);margin-top:4px;padding-left:1px}',
    '.lo .lo-avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-size:19px;color:var(--gold2);transition:border-color .4s var(--ease)}',
    '.lo .lo-avatar:hover{border-color:rgba(232,184,74,.5)}',
    '.lo .lo-hello{padding:30px var(--g) 0}',
    '.lo .lo-hello h1{font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-.015em}',
    '.lo .lo-hello h1 em{color:var(--gold2)}',
    '.lo .lo-meta{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted);letter-spacing:.01em}',
    '.lo .lo-meta .lo-ic{color:var(--gold2);margin-left:-2px}',
    '.lo .lo-dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.55}',
    '.lo .lo-open{color:#9fd3a8}',
    /* hero */
    '.lo .lo-hero{display:block;position:relative;margin:26px var(--g) 0;width:calc(100% - var(--g) * 2);aspect-ratio:16/10.4;border-radius:22px;overflow:hidden;transform:translateZ(0)}',
    '.lo .lo-hero .lo-ph{position:absolute;inset:0;transition:transform 1.4s var(--ease)}',
    '.lo .lo-hero:hover .lo-ph{transform:scale(1.035)}',
    '.lo .lo-hero .lo-ph img{object-position:74% 50%}',
    '.lo .lo-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,10,20,.72) 0%,rgba(9,10,20,.25) 55%,rgba(9,10,20,0) 80%),linear-gradient(0deg,rgba(9,10,20,.55),rgba(9,10,20,0) 50%);pointer-events:none}',
    '.lo .lo-hero-t{position:absolute;left:20px;right:20px;bottom:18px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}',
    '.lo .lo-eyebrow{display:block;font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}',
    '.lo .lo-hero h2{font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:400;font-size:30px;line-height:1.05;margin-top:8px;letter-spacing:-.01em}',
    '.lo .lo-hero p{font-size:13px;color:rgba(243,236,223,.72);margin-top:6px}',
    '.lo .lo-hero .lo-hp{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding-bottom:1px}',
    /* club */
    '.lo .lo-club{display:flex;align-items:center;gap:14px;margin:14px var(--g) 0;width:calc(100% - var(--g) * 2);padding:13px 12px 13px 13px;border-radius:20px;background:linear-gradient(120deg,rgba(232,184,74,.11),rgba(232,184,74,.02) 70%);border:1px solid rgba(232,184,74,.16);transition:border-color .4s var(--ease)}',
    '.lo .lo-club:hover{border-color:rgba(232,184,74,.32)}',
    '.lo .lo-club-r{position:relative;width:48px;height:48px;flex:none}',
    '.lo .lo-club-r .lo-ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--gold)}',
    '.lo .lo-club-t{flex:1;min-width:0}',
    '.lo .lo-club-t b{display:block;font-size:14.5px;font-weight:700;letter-spacing:.01em}',
    '.lo .lo-club-t span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}',
    '.lo .lo-club-n{font-size:13px;font-weight:600;color:var(--cream);font-variant-numeric:tabular-nums}',
    '.lo .lo-club-n i{font-style:normal;color:var(--muted)}',
    '.lo .lo-club>.lo-ic{color:var(--muted)}',
    '.lo .lo-ring-p{transition:stroke-dashoffset 1.4s var(--ease)}',
    '.lo .lo-ring.lo-live-ring .lo-ring-p,.lo .lo-st-ring .lo-ring-p{transition:none}',
    /* categories */
    '.lo .lo-cats{position:sticky;top:var(--sat);z-index:6;display:flex;gap:30px;margin-top:30px;padding:0 var(--g);height:54px;background:rgba(13,15,28,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}',

          var names = h.lines.map(function (l) { return byId[l.id].name + (l.qty > 1 ? ' \u00d7' + l.qty : ''); }).join(', ');
          if (h.live && S.active && S.active.id === h.id) {
            return '<div class="lo-rw-i lo-rw-live" role="button" tabindex="0" data-act="status"><span class="lo-rw-ic">' + ring(48, 2, 0.02, 'lo-live-ring') + mark(20, '#E8B84A', '#0D0F1C') + '</span><div class="lo-rw-t"><b>' + esc(names) + '</b><span>' + STAGE_LABEL[S.active.stage] + ' \u00b7 Ready ' + fmtTime(S.active.readyAt) + '</span></div><span class="lo-ro" aria-hidden="true">' + ic('right', 18) + '</span></div>';
          }
          return '<div class="lo-rw-i"><span class="lo-rw-ic" style="background:none;border-color:var(--line2);color:var(--muted)">' + ic('bag', 20) + '</span><div class="lo-rw-t"><b>' + esc(names) + '</b><span>' + fmtDate(h.at) + ' \u00b7 ' + money(h.total) + '</span></div><button class="lo-ro" data-act="reorder" data-o="' + h.id + '" aria-label="Reorder">' + ic('reorder', 19) + '</button></div>';
        }).join('') + '</div>';
      rwScroll.scrollTop = st;
      if (animateFrom != null) requestAnimationFrame(function () { requestAnimationFrame(function () { setRing(rwScroll.querySelector('.lo-rc-ring'), frac); }); });
      if (S.active) loop();
    }
    function setTab(t) {
      if (t === S.tab) { (t === 'menu' ? menuScroll : rwScroll).scrollTo({ top: 0, behavior: 'smooth' }); return; }
      S.tab = t;
      closeSheet();
      root.querySelectorAll('.lo-view').forEach(function (v) { v.classList.toggle('is-on', v.getAttribute('data-view') === t); });
      root.querySelectorAll('.lo-tab[data-tab]').forEach(function (b) { b.classList.toggle('is-on', b.getAttribute('data-tab') === t); });
      if (t === 'rewards') { renderRewards(0); rwScroll.scrollTop = 0; }
      else requestAnimationFrame(placeInd);
    }

    /* ---- events ---- */
    function onClick(e) {
      var a = e.target.closest('[data-act]'); if (!a || !root.contains(a) || a.disabled) return;
      var act = a.getAttribute('data-act');
      switch (act) {
        case 'open': openItem(a.getAttribute('data-id')); break;
        case 'quick':
          e.stopPropagation();
          var qid = a.getAttribute('data-id');
          addLine(qid, defaults(qid), 1);
          a.classList.add('is-done'); a.innerHTML = ic('check', 20);
          later(function () { a.classList.remove('is-done'); a.innerHTML = ic('plus', 20); }, 1300);
          break;
        case 'cat': setCat(a.getAttribute('data-cat')); break;
        case 'tab': setTab(a.getAttribute('data-tab')); break;
        case 'bag': openBag(); break;
        case 'close': case 'dismiss': closeSheet(); break;
        case 'opt': {
          var g = a.getAttribute('data-g'), v = a.getAttribute('data-v');
          S.item.o[g] = g === 'size' ? +v : v; syncItem(); break;
        }
        case 'tog': { var k = a.getAttribute('data-g'); S.item.o[k] = !S.item.o[k]; syncItem(); break; }
        case 'shots': S.item.o.shots = Math.max(1, Math.min(5, S.item.o.shots + +a.getAttribute('data-d'))); syncItem(); break;
        case 'qty': S.item.o.qty = Math.max(1, Math.min(20, S.item.o.qty + +a.getAttribute('data-d'))); syncItem(); break;
        case 'add': {
          var o = {}; for (var kk in S.item.o) if (kk !== 'qty') o[kk] = S.item.o[kk];
          addLine(S.item.id, o, S.item.o.qty);
          a.innerHTML = '<span>Added</span>' + ic('check', 22);
          later(closeSheet, 380);
          break;
        }
        case 'lq': {
          var key = a.getAttribute('data-k'), d = +a.getAttribute('data-d');
          var l = S.bag.filter(function (x) { return x.key === key; })[0]; if (!l) break;
          l.qty += d;
          if (l.qty <= 0) { S.bag = S.bag.filter(function (x) { return x !== l; }); if (l.reward) { REWARDS.forEach(function (r) { if (r.item === l.id && S.redeemed[r.id]) { delete S.redeemed[r.id]; S.stars += r.cost; } }); renderMenuClub(); renderRewards(); } }
          persist(); updateBadge(false); renderBag(); break;
        }
        case 'tip': S.tip = +a.getAttribute('data-p'); renderBag(); break;
        case 'checkout': renderCheckout(); bsheet.classList.add('is-co'); break;
        case 'co-back': bsheet.classList.remove('is-co'); renderBag(); break;
        case 'slot': S.pickup = a.getAttribute('data-k'); pageCo.querySelectorAll('.lo-slot').forEach(function (b) { b.classList.toggle('on', b === a); }); break;
        case 'pay': S.pay = a.getAttribute('data-p'); pageCo.querySelectorAll('.lo-pay').forEach(function (b) { b.classList.toggle('on', b === a); }); break;
        case 'place': placeOrder(a); break;
        case 'status': openStatus(); break;
        case 'status-close': closeStatus(); break;
        case 'redeem': {
          var r = REWARDS.filter(function (x) { return x.id === a.getAttribute('data-r'); })[0];
          if (!r || S.stars < r.cost || S.redeemed[r.id]) break;
          var from = Math.min(S.stars, GOAL) / GOAL;
          S.stars -= r.cost; S.redeemed[r.id] = 1;
          addLine(r.item, defaults(r.item), 1, true);
          renderRewards(from); renderMenuClub();
          break;
        }
        case 'reorder': {
          var h = S.orders.filter(function (x) { return x.id === a.getAttribute('data-o'); })[0]; if (!h) break;
          h.lines.forEach(function (ln) { if (!ln.reward) { var oo = {}; for (var q in ln.opts) if (q !== 'qty') oo[q] = ln.opts[q]; addLine(ln.id, oo, ln.qty); } });
          a.classList.add('is-done'); a.innerHTML = ic('check', 19);
          later(function () { a.classList.remove('is-done'); a.innerHTML = ic('reorder', 19); }, 1400);
          break;
        }
      }
    }
    function onKey(e) {
      if (e.key === 'Escape') { if (statusEl.classList.contains('is-on')) closeStatus(); else closeSheet(); }
      else if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && root.contains(e.target)) { e.preventDefault(); e.target.click(); }
    }
    function onInput(e) { if (e.target.getAttribute('data-in') === 'name') { S.name = e.target.value.trim() || 'Guest'; renderMenuClub(); } }
    /* drag-to-dismiss on sheet grabbers */
    var drag = null;
    function onDown(e) {
      var z = e.target.closest('[data-drag]'); if (!z || !root.contains(z)) return;
      var sh = z.closest('.lo-sheet'); if (!sh || !sh.classList.contains('is-on')) return;
      drag = { sh: sh, y: e.clientY, dy: 0 }; sh.classList.add('is-drag');
      try { z.setPointerCapture(e.pointerId); } catch (er) { }
    }
    function onMove(e) { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y); drag.sh.style.transform = 'translateY(' + drag.dy + 'px)'; }
    function onUp() {
      if (!drag) return; var d = drag; drag = null; d.sh.classList.remove('is-drag');
      if (d.dy > 110) closeSheet(); else d.sh.style.transform = '';
    }
    root.addEventListener('click', onClick);
    root.addEventListener('input', onInput);
    root.addEventListener('pointerdown', onDown);
    root.addEventListener('pointermove', onMove);
    root.addEventListener('pointerup', onUp);
    root.addEventListener('pointercancel', onUp);
    document.addEventListener('keydown', onKey);
    var ro = window.ResizeObserver ? new ResizeObserver(function () { placeInd(); }) : null;
    if (ro) ro.observe(root);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!disposed) placeInd(); });
    var clockT = setInterval(function () { var c = root.querySelector('.lo-clock'); if (c) c.textContent = clock(); }, 15000);

    renderMenu();
    renderRewards();
    updateBadge(false);

    return {
      root: root,
      open: openItem,
      openBag: openBag,
      tab: setTab,
      category: setCat,
      get state() { return S; },
      destroy: function () {
        disposed = true; timers.forEach(clearTimeout); clearInterval(clockT); cancelAnimationFrame(raf);
        document.removeEventListener('keydown', onKey); if (ro) ro.disconnect();
        container.innerHTML = '';
      }
    };
  }

  window.LunaOrder = { mount: mount, menu: MENU.slice(), version: '1.0.0' };
})();

</script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var stage = document.getElementById('stage');
    var mode = q.has('full') ? 'full' : q.has('panel') ? 'panel' : 'phone';
    // framed inside the studio site, the photos sit under the app's own folder
    var opts = { imgBase: q.get('img') || 'play/lunas-app/img/', fast: q.has('fast') };
    var box;
    if (mode === 'full') {
      stage.className = 'full';
      box = stage; opts.variant = 'full';
    } else if (mode === 'panel') {
      box = document.createElement('div'); box.className = 'panel'; stage.appendChild(box); opts.variant = 'full';
    } else {
      var ph = document.createElement('div'); ph.className = 'phone';
      ph.innerHTML = '<div class="screen"></div><div class="island"></div>';
      stage.appendChild(ph); box = ph.querySelector('.screen'); opts.variant = 'phone';
      var fit = function () {
        var s = Math.min(1, (innerWidth - 24) / 397, (innerHeight - 32) / 802);
        ph.style.transform = 'scale(' + s + ')';
      };
      fit(); addEventListener('resize', fit);
    }
    window.lunaEvents = [];
    addEventListener('luna:order', function (e) { lunaEvents.push(['order', e.detail]); });
    addEventListener('luna:order-stage', function (e) { lunaEvents.push(['stage', e.detail]); });
    window.app = LunaOrder.mount(box, opts);
  })();
</script>
</body>
</html>
