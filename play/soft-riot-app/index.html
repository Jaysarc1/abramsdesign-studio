</head><body>
<title>Soft Riot App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one shell, two worlds. The customer app lives on the brand's grey store wall inside a phone; the owner side is a UMB command panel with an ink rail and a paper ledger. In "both" the phone keeps its own column so an order can be watched landing on the panel. */
:root{
  --wall:#E6E7E1; --wall-hi:#F5F5F1; --wall-lo:#D2D3CB;
  --ink:#10110E; --ink-2:#54564E; --ink-3:#8C8E85; --rule:rgba(16,17,14,.12); --rule-2:rgba(16,17,14,.22);
  --lime:#43E61F; --lime-ink:#0B2604; --lime-soft:rgba(67,230,31,.16);
  --paper:#FBFAF5; --cv:#ECEDE7;
  --rail:#121310; --rail-2:#1D1E1A; --rail-tx:#ECECE5; --rail-mu:#8A8C83; --rail-ln:rgba(236,236,229,.09);
  --up:#1E7F34; --down:#C2412D; --warn:#B07A06; --up-bg:rgba(30,127,52,.1); --down-bg:rgba(194,65,45,.1); --warn-bg:rgba(176,122,6,.12);
  --f-disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--f-disp);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono)}
.lbl{font:500 10px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.tn{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr);position:relative}
.gbar{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:var(--wall)}
.g-l{display:flex;align-items:center;gap:12px}
/* the mark's word runs past its box; the margin puts the S, not the box, on the bar's left edge */
.g-l .logo{width:96px;height:32px;margin-left:8px}
.g-x{font:500 11px/1 var(--f-mono);color:var(--ink-3)}
.umbm{display:flex;align-items:center;gap:7px;font:800 13px/1 var(--f-disp);font-stretch:118%;letter-spacing:.06em}
.umbm i{width:16px;height:16px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.umbm i b{border-radius:1.5px;background:currentColor}
.umbm i b:nth-child(2){background:var(--lime)}
.g-sw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:rgba(16,17,14,.06);box-shadow:inset 0 0 0 1px var(--rule)}
.seg i{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--ink);transition:transform .6s var(--ease),width .6s var(--ease);box-shadow:0 2px 6px rgba(16,17,14,.18)}
.seg button{position:relative;height:30px;padding:0 16px;border-radius:999px;font:600 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;transition:color .45s;white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--paper)}
.g-r{display:flex;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:8px;font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px rgba(30,127,52,.16);flex:none}
.dot.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(30,127,52,0)}}

.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
body[data-view="both"] .stage{grid-template-columns:clamp(400px,31vw,500px) minmax(0,1fr)}
body[data-view="owner"] .stage{grid-template-columns:0 minmax(0,1fr)}
body[data-view="app"] .pane-own{display:none}
body[data-view="owner"] .pane-app{visibility:hidden}
.pane-app{position:relative;min-width:0;min-height:0;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(80% 70% at 50% 40%,var(--wall-hi) 0%,var(--wall) 55%,var(--wall-lo) 100%)}
.pane-app::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.3;mix-blend-mode:multiply;pointer-events:none}
.bgword{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none;overflow:hidden}
.bgword span{font:900 clamp(90px,15vw,240px)/.82 var(--f-disp);font-stretch:125%;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px rgba(16,17,14,.1);white-space:nowrap}
body[data-view="both"] .bgword{display:none}
.pane-own{position:relative;min-width:0;min-height:0;overflow:hidden;container-type:inline-size;container-name:own;background:var(--cv);border-left:1px solid var(--rule)}

/* ---------- phone ---------- */
.phw{position:relative;width:calc(390px * var(--ps,1) + 24px * var(--ps,1));height:calc(868px * var(--ps,1))}
.ph{position:absolute;left:0;top:0;width:414px;height:868px;box-sizing:border-box;transform:scale(var(--ps,1));transform-origin:0 0;border-radius:62px;padding:12px;
  background:linear-gradient(145deg,#2b2c28,#0b0c09 40%,#1b1c18);
  box-shadow:inset 0 0 0 1.5px #44463f,inset 0 0 0 5px #0b0c09,0 50px 90px -30px rgba(16,17,14,.55),0 30px 40px -20px rgba(16,17,14,.35)}
.ph::after{content:"";position:absolute;right:-3px;top:180px;width:3px;height:86px;border-radius:0 3px 3px 0;background:#262722}
.scr{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:var(--wall);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;isolation:isolate}
.island{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:80}
.sb{height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 9px 38px;font:600 15px/1 -apple-system,"SF Pro Text","Helvetica Neue",var(--f-disp);letter-spacing:.01em;position:relative;z-index:70}
.sb svg{height:12px;width:auto;margin-left:5px}
.sb .ic{display:flex;align-items:center}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:90;pointer-events:none}
body.mob .shell{grid-template-rows:48px minmax(0,1fr)}
body.mob .gbar{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
body.mob .g-l,body.mob .g-r{display:none}
body.mob .seg button{height:28px;padding:0 13px}
body.mob .pane-app{display:block}
body.mob .bgword{display:none}
body.mob .phw{width:100%;height:100%}
body.mob .ph{position:static;width:100%;height:100%;transform:none;border-radius:0;padding:0;background:none;box-shadow:none}
body.mob .ph::after,body.mob .island,body.mob .sb,body.mob .homebar{display:none}
body.mob .scr{width:100%;height:100%;border-radius:0;grid-template-rows:auto minmax(0,1fr) auto}

/* ---------- app ---------- */
.ah{position:relative;z-index:30;height:54px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px}
.ah .logo{width:92px;height:31px;justify-self:center;padding:0;border:0;background:none;cursor:pointer;transition:transform .5s var(--ease)}
.ah .logo:hover{transform:scale(1.04)}
.ah .logo:active{transform:scale(.97)}
.logo svg{width:100%;height:100%;overflow:visible;display:block}
/* the mark arrives with its word pushing out through the pill */
.logo .push{transform-box:view-box;transform-origin:66px 22px;animation:lgPush 1.6s var(--ease) .5s both}
@keyframes lgPush{from{transform:scaleX(.66)}}
.a-hist{justify-self:start;display:flex;align-items:center;height:34px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule-2);opacity:0;transform:translateX(-6px);pointer-events:none;transition:opacity .4s,transform .6s var(--ease)}
.hist-on .a-hist{opacity:1;transform:none;pointer-events:auto;position:relative;z-index:2}
.a-hist i{width:1px;height:14px;background:var(--rule-2);flex:none}
.a-nb{display:flex;align-items:center;height:34px;border-radius:999px;font:600 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);transition:opacity .35s,background .3s,padding .7s var(--ease)}
#aBack{padding:0 9px 0 10px}#aFwd{padding:0 10px 0 9px}
.a-nb:disabled{padding:0 8px!important}
/* the side you can use carries its word; the other settles to just its arrow so the pair sits clear of the logo */
.a-nb .lb{display:block;overflow:hidden;white-space:nowrap;max-width:7.2em;transition:max-width .7s var(--ease),opacity .45s,margin .7s var(--ease)}
#aBack .lb{margin-left:5px}#aFwd .lb{margin-right:5px}
.a-nb:disabled .lb{max-width:0;opacity:0;margin:0}
.a-nb:hover:not(:disabled){background:rgba(16,17,14,.05)}
.a-nb:disabled{opacity:.32;cursor:default}
.a-nb svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.7;fill:none;transition:transform .5s var(--ease)}
#aBack:hover:not(:disabled) svg{transform:translateX(-3px)}#aFwd:hover:not(:disabled) svg{transform:translateX(3px)}
.a-drop{justify-self:start;font:500 9.5px/1.25 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);transition:opacity .4s}
.a-drop b{display:block;color:var(--ink);font-weight:600}
.hist-on .a-drop{opacity:0;pointer-events:none}
.a-hr{justify-self:end;display:flex;align-items:center;gap:8px}
.audio{position:relative;width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--rule-2)}
.audio:hover::after,.audio.open::after{content:"";position:absolute;left:-12px;right:-12px;top:100%;height:12px}
.mute{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background .3s}
.mute:hover{background:rgba(16,17,14,.05)}
.mute svg{width:18px;height:18px;overflow:visible}
.mute svg path{stroke:var(--ink)}
.spk .w{opacity:.3;transition:opacity .6s}
.audio.playing .spk .w1{animation:wv 1.6s ease-in-out infinite}
.audio.playing .spk .w2{animation:wv 1.6s ease-in-out .25s infinite}
@keyframes wv{0%,100%{opacity:.3}50%{opacity:1}}
.mute .off{display:none}
.audio.muted .mute .spk{display:none}.audio.muted .mute .off{display:block}
.vol{position:absolute;right:-46px;top:calc(100% + 10px);height:40px;display:flex;align-items:center;width:0;overflow:hidden;opacity:0;border-radius:999px;background:rgba(251,250,245,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px var(--rule-2),0 12px 26px -12px rgba(16,17,14,.35);transition:width .6s var(--ease),opacity .45s,padding .6s var(--ease)}
.audio:hover .vol,.audio:focus-within .vol,.audio.open .vol{width:132px;padding:0 14px;opacity:1}
.vol input{-webkit-appearance:none;appearance:none;width:104px;height:18px;margin:0;flex:none;background:transparent;cursor:pointer;touch-action:none}
.vol input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--v,70%),rgba(16,17,14,.16) 0)}
.vol input::-moz-range-track{height:3px;border-radius:3px;background:rgba(16,17,14,.16)}
.vol input::-moz-range-progress{height:3px;border-radius:3px;background:var(--ink)}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:50%;background:var(--ink);border:2px solid var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.vol input::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--paper)}
.audio.muted .vol input{opacity:.35}
@media (hover:none){.audio:hover .vol,.audio:focus-within .vol{width:0;padding:0;opacity:0}.audio.open .vol{width:132px;padding:0 14px;opacity:1}}
.a-hl{position:relative;justify-self:start;display:grid}
.a-hl > *{grid-area:1/1}
.a-bag{justify-self:end;position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--rule-2);transition:background .3s}
.a-bag:hover{background:rgba(16,17,14,.05)}
.a-bag svg{width:17px;height:17px;stroke:var(--ink);stroke-width:1.6;fill:none}
.a-bag b{position:absolute;right:-3px;top:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--lime);color:var(--lime-ink);box-shadow:0 0 0 1.5px var(--ink);font:700 10px/18px var(--f-mono);text-align:center;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.a-bag.has b{transform:scale(1)}
.a-bag.bump b{animation:bump .6s var(--ease)}
@keyframes bump{40%{transform:scale(1.4)}}

.views{position:relative;min-height:0;overflow:hidden}
.v{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s,transform .7s var(--ease),filter .7s}
.v::-webkit-scrollbar{display:none}
.v.on{opacity:1;visibility:visible;transition:opacity .6s .05s,visibility 0s,transform .7s var(--ease),filter .7s}
.v.over{background:var(--wall);transform:translateX(100%);opacity:1;z-index:5;box-shadow:-20px 0 40px rgba(16,17,14,.08)}
.v.over.on{transform:none}
.over-on .v.on:not(.over){transform:translateX(-22%);filter:brightness(.92)}
.vin{padding:6px 18px 28px}

/* shop */
.hero{position:relative;height:330px;border-radius:26px;overflow:hidden;background:var(--lime);box-shadow:inset 0 0 0 1.5px var(--ink);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 80% at 78% 45%,rgba(255,255,255,.55),transparent 70%);z-index:-1}
.h-tx{position:absolute;left:20px;top:20px;bottom:20px;width:50%;display:flex;flex-direction:column;align-items:flex-start;z-index:3}
.h-eye{display:flex;align-items:center;gap:8px;font:600 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--lime-ink)}
.h-eye i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.h-tx h2{margin:14px 0 0;font:900 50px/.82 var(--f-disp);font-stretch:125%;letter-spacing:-.03em;color:var(--ink);text-transform:uppercase}
.h-tx p{margin:12px 0 0;font:400 13px/1.45 var(--f-disp);color:var(--lime-ink);max-width:24ch;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.h-cta{margin-top:auto;display:flex;white-space:nowrap;align-items:center;gap:10px;height:42px;padding:0 6px 0 16px;border-radius:999px;background:var(--ink);color:var(--paper);font:700 11px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;transition:transform .5s var(--ease)}
.h-cta span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--ink)}
.h-cta svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none}
.h-cta:active{transform:scale(.97)}
.h-img{position:absolute;right:-30px;top:78px;width:58%;height:100%;z-index:2}
.h-img .hg{position:absolute;top:0;width:78%;transform-origin:50% 2%;animation:sway 6s ease-in-out infinite alternate}
.h-img .hg img{width:100%;display:block;filter:drop-shadow(0 18px 18px rgba(11,38,4,.28))}
.h-img .hg.a{left:-8%;top:10px;z-index:2;animation-delay:-1.4s}
.h-img .hg.b{right:-12%;top:-6px;width:84%;z-index:1;animation-duration:7.2s}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
/* the countdown ticket rides on the photo, a clear step above the button's line so the two never touch */
.h-cd{position:absolute;right:14px;bottom:76px;z-index:4;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1.5px var(--ink);font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;transform:rotate(-4deg)}
.h-cd b{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:20px -18px 0;padding:0 18px 2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:32px;padding:0 13px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule-2);font:600 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;transition:background .35s,color .35s,box-shadow .35s}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.sh-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px}
.sh-h h3{margin:0;font:900 22px/1 var(--f-disp);font-stretch:122%;text-transform:uppercase;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:0;animation:rise .9s var(--ease) both;animation-delay:calc(var(--k) * 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.t-img{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:radial-gradient(90% 70% at 50% 35%,var(--wall-hi),var(--wall) 60%,var(--wall-lo));box-shadow:inset 0 0 0 1px var(--rule)}
.t-img::before{content:"";position:absolute;left:0;right:0;top:9%;height:3px;background:linear-gradient(180deg,#fbfbf9,#9a9c95);box-shadow:0 1px 2px rgba(16,17,14,.2)}
.t-img img{position:absolute;left:50%;top:7.4%;width:96%;margin-left:-48%;transform-origin:50% 1.5%;transition:transform 1s var(--ease);filter:drop-shadow(0 10px 10px rgba(16,17,14,.14))}
.tile:hover .t-img img{transform:rotate(-2deg) translateY(-2px)}
.tile:active .t-img img{transform:scale(.98)}
.t-px{position:absolute;right:9px;top:9px;padding:5px 8px 4px;border-radius:999px;background:var(--lime);box-shadow:0 0 0 1.5px var(--ink);font:800 12px/1 var(--f-disp);font-stretch:112%;transform:rotate(-6deg);font-variant-numeric:tabular-nums}
.t-new{position:absolute;left:9px;top:10px;font:600 9px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 7px;border-radius:999px;background:var(--ink);color:var(--paper)}
.t-nm{margin-top:10px;font:800 13px/1.15 var(--f-disp);font-stretch:108%;text-transform:uppercase;letter-spacing:.005em}
.t-mt{margin-top:5px;font:500 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.t-st{margin-top:6px;font:500 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--warn);display:flex;align-items:center;gap:5px}
.t-st::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-st.ok{color:var(--up)}
.studio{margin-top:26px;padding:16px 16px 16px 18px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--rule-2);display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.studio b{font:800 15px/1.1 var(--f-disp);font-stretch:112%;text-transform:uppercase}
.studio span{grid-column:1;font:400 12.5px/1.45 var(--f-disp);color:var(--ink-2)}
.studio em{grid-row:1/3;grid-column:2;font-style:normal;font:600 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.mq{margin:26px -18px -28px;height:30px;background:var(--lime);overflow:hidden;display:flex;align-items:center;box-shadow:0 -1px 0 var(--ink)}
.mq div{display:flex;white-space:nowrap;animation:mq 40s linear infinite}
.mq span{font:700 10.5px/1 var(--f-disp);font-stretch:112%;letter-spacing:.16em;text-transform:uppercase;color:var(--lime-ink);padding-right:.7em}
@keyframes mq{to{transform:translateX(-50%)}}

/* product */
.pd-stage{position:relative;height:430px;margin:0 -18px;overflow:hidden;background:radial-gradient(70% 60% at 50% 40%,var(--wall-hi),var(--wall) 65%,var(--wall-lo));border-bottom:1px solid var(--rule)}
.pd-stage .rail{position:absolute;left:-10px;right:-10px;top:30px;height:5px;border-radius:5px;background:linear-gradient(180deg,#fbfbf9 0%,#c4c6bf 40%,#8b8d86 65%,#d9dad5 100%);box-shadow:0 2px 3px rgba(16,17,14,.18)}
.pd-fig{position:absolute;left:50%;top:21px;width:250px;margin-left:-125px;transform-origin:50% 2%;animation:sway 7s ease-in-out infinite alternate;filter:drop-shadow(0 18px 18px rgba(16,17,14,.16))}
.pd-fig img{position:absolute;left:0;top:0;width:100%;transition:opacity .6s,transform .9s var(--ease)}
.pd-fig img.b{opacity:0;transform:rotateY(70deg)}
.pd-stage.back .pd-fig img.f{opacity:0;transform:rotateY(-70deg)}
.pd-stage.back .pd-fig img.b{opacity:1;transform:none}
.pd-fig .ly{position:absolute;left:0;top:0;width:100%;aspect-ratio:640/943;perspective:900px}
.tags{position:absolute;left:min(calc(50% + 90px),calc(100% - var(--n) * 38px - 6px));top:28px;z-index:3;display:flex;gap:8px;align-items:flex-start;transition:opacity .4s}
.tag{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;opacity:0;transform:translateY(-30px);transition:opacity .5s,transform .8s var(--ease)}
.tags.show .tag{opacity:1;transform:none;transition-delay:calc(var(--k) * 110ms + 380ms)}
.tags.still .tag{transition:none}
.tag .str{width:1px;height:var(--len);background:linear-gradient(180deg,rgba(16,17,14,.15),rgba(16,17,14,.55))}
.tag .tg{position:relative;width:30px;height:var(--h,66px);border-radius:3px;background:var(--c);box-shadow:0 6px 12px rgba(16,17,14,.16),inset 0 0 0 1px rgba(16,17,14,.12);transition:transform .6s var(--ease),box-shadow .6s}
.tag .tg::before{content:"";position:absolute;left:50%;top:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--wall);box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.tag .tg span{position:absolute;left:50%;top:50%;transform:translate(-50%,-38%) rotate(90deg);white-space:nowrap;font:600 8px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--t)}
.tag:hover .tg{transform:rotate(-4deg)}
.tag[aria-pressed="true"] .tg{transform:translateY(8px) scale(1.08);box-shadow:0 12px 20px rgba(16,17,14,.22),inset 0 0 0 1.5px var(--ink)}
.pd-seg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%)}
.pd-seg.seg button{height:28px;padding:0 15px}
.pd-nav{position:absolute;top:186px;z-index:4;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(250,250,247,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px var(--rule-2),0 8px 20px -10px rgba(16,17,14,.35);color:var(--ink);transition:transform .5s var(--ease),background .4s}
.pd-nav.prev{left:12px}.pd-nav.next{right:12px}
.pd-nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pd-nav:hover{background:var(--paper)}
.pd-nav.prev:hover{transform:translateX(-2px)}.pd-nav.next:hover{transform:translateX(2px)}
.pd-nav:active{transform:scale(.94)}
.pd-stage.in-r .pd-fig .ly{animation:pdInR .6s cubic-bezier(.22,.8,.3,1) both}
.pd-stage.in-l .pd-fig .ly{animation:pdInL .6s cubic-bezier(.22,.8,.3,1) both}
@keyframes pdInR{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes pdInL{from{opacity:0;transform:translateX(-56px)}to{opacity:1;transform:none}}
.pd-px{position:absolute;right:16px;bottom:14px;padding:8px 12px 7px;border-radius:999px;background:var(--lime);box-shadow:0 0 0 1.5px var(--ink);font:800 19px/1 var(--f-disp);font-stretch:112%;transform:rotate(-7deg);font-variant-numeric:tabular-nums;z-index:2}
.pd-body{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.pd-body > *{animation:rise .8s var(--ease) both;animation-delay:calc(var(--k,0) * 70ms + 200ms)}
.pd-eye{font:500 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.pd-nm{margin:-6px 0 0;font:900 31px/.95 var(--f-disp);font-stretch:122%;letter-spacing:-.015em;text-transform:uppercase;text-wrap:balance}
.pd-story{margin:0;font:400 14px/1.55 var(--f-disp);color:var(--ink-2);text-wrap:pretty;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.opt-h{display:flex;justify-content:space-between;align-items:baseline}
.opt-h b{font:600 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.opt-h em{font-style:normal;font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.sizes button{position:relative;height:44px;border-radius:12px;font:600 12px/1 var(--f-mono);letter-spacing:.06em;box-shadow:inset 0 0 0 1px var(--rule-2);transition:background .3s,color .3s,box-shadow .3s}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.sizes button:disabled{color:var(--ink-3);cursor:default;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(16,17,14,.05) 6px 7px)}
.sizes button i{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--warn)}
.buy{display:grid;grid-template-columns:auto 1fr;gap:10px}
.stp{display:flex;align-items:center;height:54px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule-2);padding:0 6px}
.stp button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:500 17px/1 var(--f-mono);transition:background .3s}
.stp button:hover{background:rgba(16,17,14,.06)}
.stp span{min-width:22px;text-align:center;font:600 13px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.add{height:54px;border-radius:999px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 7px 0 20px;font:700 11.5px/1 var(--f-disp);letter-spacing:.15em;text-transform:uppercase;transition:background .4s,color .4s,transform .5s var(--ease)}
.add em{font-style:normal;height:40px;padding:0 13px;border-radius:999px;display:grid;place-items:center;background:rgba(251,250,245,.12);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.add:hover,.add.done{background:var(--lime);color:var(--ink)}
.add:active{transform:scale(.98)}
.add:disabled{opacity:.35;pointer-events:none}
.note{display:flex;gap:10px;align-items:center;font:400 12.5px/1.4 var(--f-disp);color:var(--ink-2)}
.note svg{width:16px;height:16px;flex:none;stroke:var(--ink);stroke-width:1.5;fill:none}
.specs{margin:0;display:grid}
.specs div{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--rule);font-size:13px;line-height:1.4}
.specs div:last-child{border-bottom:1px solid var(--rule)}
.specs dt{font:500 9.5px/1.6 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.specs dd{margin:0}

/* bag (receipt) */
.v-h{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 0 16px}
.v-h h2{margin:0;font:900 34px/.9 var(--f-disp);font-stretch:125%;text-transform:uppercase;letter-spacing:-.02em}
.v-h span{font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.rcpt{position:relative;background:var(--paper);padding:18px 16px 30px;display:flex;flex-direction:column;gap:14px;filter:drop-shadow(0 14px 18px rgba(20,22,15,.12)) drop-shadow(0 1px 1px rgba(20,22,15,.1));
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/11px 7px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/11px 7px repeat-x}
.r-top{display:flex;justify-content:space-between;font:500 9.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.r-rule{border-top:1px dashed rgba(16,17,14,.26)}
.bl{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:start}
.bl-th{width:52px;height:68px;border-radius:10px;background:var(--wall);overflow:hidden;position:relative}
.bl-th img{position:absolute;left:-6%;top:-2px;width:112%}
.bl-tx{display:flex;flex-direction:column;gap:5px;min-width:0}
.bl-tx b{font:800 12.5px/1.15 var(--f-disp);font-stretch:106%;text-transform:uppercase}
.bl-tx span{font:500 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.bl .stp{height:30px;padding:0 2px;margin-top:3px;align-self:flex-start}
.bl .stp button{width:24px;height:24px;font-size:13px}
.bl .stp span{min-width:16px;font-size:11px}
.bl-pr{font:600 12.5px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.ful{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ful button{text-align:left;padding:12px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--rule-2);display:flex;flex-direction:column;gap:6px;transition:box-shadow .3s,background .3s}
.ful button b{font:800 12px/1 var(--f-disp);font-stretch:110%;text-transform:uppercase;letter-spacing:.02em}
.ful button span{font:400 11.5px/1.35 var(--f-disp);color:var(--ink-2)}
.ful button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:var(--lime-soft)}
.r-row{display:flex;align-items:baseline;gap:8px;font:500 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.r-row span:nth-child(2){flex:1;border-bottom:1px dotted rgba(16,17,14,.3);transform:translateY(-3px)}
.r-row b{font-weight:600;font-variant-numeric:tabular-nums}
.r-tot{display:flex;justify-content:space-between;align-items:baseline}
.r-tot span{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.r-tot b{font:800 28px/1 var(--f-disp);font-stretch:115%;font-variant-numeric:tabular-nums}
.go{height:54px;border-radius:999px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:10px;font:700 11.5px/1 var(--f-disp);letter-spacing:.16em;text-transform:uppercase;transition:background .4s,color .4s,transform .5s var(--ease)}
.go:hover{background:var(--lime);color:var(--ink)}
.go:active{transform:scale(.98)}
.go svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none}
.go.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-2)}
.go.ghost:hover{background:rgba(16,17,14,.05)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:46px 18px 10px}
.empty .eh{width:120px;height:150px;position:relative}
.empty .eh::before{content:"";position:absolute;left:0;right:0;top:18px;height:4px;border-radius:4px;background:linear-gradient(180deg,#fbfbf9,#8b8d86)}
.empty .eh svg{position:absolute;left:50%;top:6px;width:60px;margin-left:-30px;transform-origin:50% 0;animation:sway 4s ease-in-out infinite alternate}
.empty b{font:900 22px/1 var(--f-disp);font-stretch:122%;text-transform:uppercase}
.empty p{margin:0;font:400 13.5px/1.5 var(--f-disp);color:var(--ink-2);max-width:28ch}

/* checkout sheet */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(16,17,14,.32);opacity:0;pointer-events:none;transition:opacity .5s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:92%;display:flex;flex-direction:column;background:var(--paper);border-radius:28px 28px 0 0;transform:translateY(102%);transition:transform .75s var(--ease);box-shadow:0 -10px 40px rgba(16,17,14,.18)}
.ck-on .scrim{opacity:1;pointer-events:auto}
.ck-on .sheet{transform:none}
.sh-grab{width:40px;height:5px;border-radius:3px;background:var(--rule-2);margin:10px auto 0;flex:none}
.sh-in{overflow-y:auto;scrollbar-width:none;padding:12px 18px 30px;display:flex;flex-direction:column;gap:16px}
.sh-in::-webkit-scrollbar{display:none}
.sh-t{display:flex;justify-content:space-between;align-items:center}
.sh-t h2{margin:0;font:900 26px/1 var(--f-disp);font-stretch:125%;text-transform:uppercase;letter-spacing:-.015em}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--rule-2)}
.x svg{width:11px;height:11px;stroke:var(--ink);stroke-width:1.7}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fld label{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.fld input{width:100%;min-width:0;box-sizing:border-box;height:46px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1px var(--rule-2);background:#fff;padding:0 14px;font-size:15px;outline:none;transition:box-shadow .3s}
.fld input:focus{box-shadow:inset 0 0 0 2px var(--ink)}
/* the sheet is always phone-width, so name and email stack: a full email address needs the whole line */
.fld2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.ck-sum{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--wall)}
.ck-items{display:flex;gap:6px}
.ck-items span{width:42px;height:54px;border-radius:8px;background:var(--wall-hi);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--rule)}
.ck-items span img{position:absolute;left:-6%;top:-2px;width:112%}
.ck-items em{font-style:normal;align-self:center;font:600 10px/1 var(--f-mono);color:var(--ink-2);margin-left:4px}
.wal{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--paper)}
.wal .card{width:38px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--lime),#2FB314);position:relative;flex:none}
.wal .card::after{content:"";position:absolute;left:5px;top:8px;width:9px;height:7px;border-radius:2px;background:rgba(11,38,4,.45)}
.wal b{font:700 12px/1.2 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;display:block}
.wal span{font:500 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--rail-mu)}
.slide{position:relative;height:62px;border-radius:999px;background:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--x,0px) + 62px);background:var(--lime);border-radius:999px}
.slide .lab{position:absolute;inset:0;display:grid;place-items:center;padding-left:40px;font:700 11.5px/1 var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--paper);pointer-events:none;background:linear-gradient(90deg,rgba(251,250,245,.55) 0%,var(--paper) 40%,rgba(251,250,245,.55) 80%) 0 0/200% 100% text;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 3.4s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.slide .knob{position:absolute;left:5px;top:5px;width:52px;height:52px;border-radius:50%;background:var(--lime);display:grid;place-items:center;transform:translateX(var(--x,0px));box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:grab}
.slide .knob svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2;fill:none}
.slide.snap .knob,.slide.snap .fill{transition:transform .5s var(--ease),width .5s var(--ease)}
.slide.paid .lab{-webkit-text-fill-color:var(--ink);animation:none}

/* track */
.tk-hd{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.tk-no{font:600 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between}
.tk-st{margin:0;font:900 38px/.9 var(--f-disp);font-stretch:125%;letter-spacing:-.025em;text-transform:uppercase;text-wrap:balance}
.tk-eta{font:400 14px/1.45 var(--f-disp);color:var(--ink-2)}
.tk-bar{display:grid;gap:4px;margin-top:6px}
.tk-bar i{height:6px;border-radius:3px;background:var(--rule-2);position:relative;overflow:hidden}
.tk-bar i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:0 50%;transition:transform 1.2s var(--ease)}
.tk-bar i.done::after{transform:scaleX(1)}
.tk-bar i.now::after{background:var(--lime);transform:scaleX(1);animation:fillp 1.8s ease-in-out infinite alternate}
@keyframes fillp{from{opacity:.45}to{opacity:1}}
.code{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--lime);box-shadow:inset 0 0 0 1.5px var(--ink)}
.code b{font:900 34px/1 var(--f-disp);font-stretch:125%;letter-spacing:.04em}
.code span{font:500 10px/1.45 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--lime-ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{position:relative;display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding:0 0 18px;align-items:start}
.steps li::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:1.5px;background:var(--rule-2)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--ink)}
.steps .k{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--rule-2);background:var(--wall);display:grid;place-items:center;position:relative;z-index:1;transition:background .5s,box-shadow .5s}
.steps .k svg{width:11px;height:11px;stroke:var(--paper);stroke-width:2.2;fill:none;opacity:0}
.steps li.done .k{background:var(--ink);box-shadow:none}
.steps li.done .k svg{opacity:1}
.steps li.now .k{background:var(--lime);box-shadow:0 0 0 1.5px var(--ink),0 0 0 6px var(--lime-soft)}
.steps b{font:800 13px/1.2 var(--f-disp);font-stretch:108%;text-transform:uppercase;display:block;margin-top:3px}
.steps span{font:400 12.5px/1.4 var(--f-disp);color:var(--ink-2)}
.steps li:not(.done):not(.now) b{color:var(--ink-3)}
.steps time{font:500 10px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.stamp{position:absolute;left:74px;bottom:16px;font:800 18px/1 var(--f-disp);font-stretch:118%;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border:2px solid var(--ink);border-radius:4px;background:var(--lime);mix-blend-mode:multiply;transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both .6s}
@keyframes stamp{from{opacity:0;transform:rotate(-12deg) scale(1.9)}to{opacity:.94;transform:rotate(-12deg) scale(1)}}
.print{animation:prt 1.1s steps(9,end) both}
@keyframes prt{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}

/* orders list */
.olist{display:flex;flex-direction:column;gap:10px}
.oc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:18px;background:var(--paper);box-shadow:0 1px 0 rgba(16,17,14,.06),0 8px 18px -10px rgba(16,17,14,.18);transition:transform .5s var(--ease)}
.oc:active{transform:scale(.985)}
.oc-th{display:flex}
.oc-th span{width:40px;height:52px;border-radius:9px;background:var(--wall);overflow:hidden;position:relative;margin-left:-14px;box-shadow:0 0 0 2px var(--paper)}
.oc-th span:first-child{margin-left:0}
.oc-th img{position:absolute;left:-6%;top:-2px;width:112%}
.oc-tx{display:flex;flex-direction:column;gap:5px;min-width:0}
.oc-tx b{font:800 13px/1.1 var(--f-disp);font-stretch:108%;text-transform:uppercase}
.oc-tx span{font:500 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font:600 9px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;background:rgba(16,17,14,.07);color:var(--ink)}
.pill.lime{background:var(--lime);color:var(--lime-ink)}
.pill.up{background:var(--up-bg);color:var(--up)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.down{background:var(--down-bg);color:var(--down)}
.pill.ink{background:var(--ink);color:var(--paper)}

.tabs{position:relative;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 26px 30px;background:linear-gradient(180deg,rgba(230,231,225,0),var(--wall) 30%);border-top:1px solid var(--rule)}
body.mob .tabs{padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;font:600 9px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);transition:color .4s}
.tabs button svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.6;fill:none}
.tabs button[aria-current="true"]{color:var(--ink)}
.tabs button .tb{position:relative}
.tabs button .tb b{position:absolute;right:-9px;top:-5px;min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:var(--lime);color:var(--lime-ink);font:700 9px/15px var(--f-mono);text-align:center;box-shadow:0 0 0 1.5px var(--ink)}
.flyer{position:absolute;z-index:95;pointer-events:none;width:60px;border-radius:10px}
.flyer img{width:100%;display:block}
.atoast{position:absolute;left:18px;right:18px;top:62px;z-index:75;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--paper);font:500 12.5px/1.35 var(--f-disp);transform:translateY(-140%);opacity:0;transition:transform .7s var(--ease),opacity .5s}
.atoast.on{transform:none;opacity:1}
.atoast .dot{background:var(--lime);box-shadow:0 0 0 3px rgba(67,230,31,.25)}
body.mob .atoast{top:8px}

/* ---------- owner (UMB) ---------- */
.own{position:absolute;inset:0;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:0}
.side{background:var(--rail);color:var(--rail-tx);display:flex;flex-direction:column;min-height:0;padding:18px 14px 16px}
.s-brand{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 18px;border-bottom:1px solid var(--rail-ln)}
.s-brand .umbm{color:var(--rail-tx);font-size:15px}
.s-brand span{font:500 9px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rail-mu);text-align:right}
.ws{margin:14px 0 10px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--rail-2)}
.ws .av{width:34px;height:34px;border-radius:10px;background:var(--lime);display:grid;place-items:center;font:900 12px/1 var(--f-disp);font-stretch:120%;color:var(--ink);flex:none}
.ws b{display:block;font:700 13px/1.2 var(--f-disp)}
.ws span{font:500 9px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rail-mu)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;overflow-y:auto;scrollbar-width:none}
.nav button{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:10px;font:500 13.5px/1 var(--f-disp);color:var(--rail-mu);transition:color .35s,background .35s;text-align:left}
.nav button svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.6;fill:none;flex:none}
.nav button:hover{color:var(--rail-tx);background:rgba(236,236,229,.04)}
.nav button[aria-current="true"]{color:var(--rail-tx);background:var(--rail-2)}
.nav button[aria-current="true"]::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--lime)}
.nav button em{margin-left:auto;font-style:normal;font:600 9.5px/1 var(--f-mono);padding:4px 6px;border-radius:6px;background:var(--lime);color:var(--ink)}
.nav button[aria-current="true"] em{margin-right:14px}
.src{margin-top:auto;padding-top:14px;border-top:1px solid var(--rail-ln);display:flex;flex-direction:column;gap:9px}
.src .lbl{color:var(--rail-mu);margin-bottom:2px}
.src div{display:flex;align-items:center;gap:9px;font:500 12px/1.2 var(--f-disp);color:var(--rail-tx)}
.src div span{margin-left:auto;font:500 9.5px/1 var(--f-mono);color:var(--rail-mu);letter-spacing:.04em}
.src .dot{width:6px;height:6px;background:var(--lime);box-shadow:0 0 0 3px rgba(67,230,31,.14)}
.main{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.oh{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px 16px;background:linear-gradient(180deg,var(--cv) 70%,rgba(236,237,231,0))}
.oh h1{margin:0;font:900 30px/1 var(--f-disp);font-stretch:118%;letter-spacing:-.02em;text-transform:uppercase;display:flex;align-items:flex-start}
/* the section's sticker, slapped on the title's top corner like the store's NEW IN */
.stk{margin:-8px 0 0 10px;padding:5px 9px 4px;border-radius:999px;background:var(--lime);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);font:800 11px/1 var(--f-disp);font-stretch:112%;letter-spacing:.02em;white-space:nowrap;transform:rotate(-6deg);animation:slap .7s cubic-bezier(.3,1.6,.5,1) both .35s}
@keyframes slap{from{opacity:0;transform:rotate(-14deg) scale(1.6)}to{opacity:1;transform:rotate(-6deg) scale(1)}}
.oh p{margin:6px 0 0;font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.oh-r{display:flex;align-items:center;gap:14px}
.oh .seg{background:var(--paper)}
.sync{display:flex;align-items:center;gap:8px;font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.osec{padding:4px 28px 40px;display:grid;gap:16px}
.osec > *{animation:rise .9s var(--ease) both;animation-delay:calc(var(--k,0) * 110ms)}
.row{display:grid;gap:16px;min-width:0}
.r-kpi{grid-template-columns:repeat(6,minmax(0,1fr))}
.r-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.r-111{grid-template-columns:repeat(3,minmax(0,1fr))}
.r-11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--paper);border-radius:20px;padding:18px 20px;min-width:0;box-shadow:0 1px 0 rgba(16,17,14,.05),0 10px 30px -18px rgba(16,17,14,.22);display:flex;flex-direction:column;gap:14px;position:relative}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ch h3{margin:0;font:800 14px/1.2 var(--f-disp);font-stretch:110%;text-transform:uppercase;letter-spacing:.02em}
.ch p{margin:5px 0 0;font:400 12.5px/1.4 var(--f-disp);color:var(--ink-2)}
.ch .lbl{white-space:nowrap}
.kpi{gap:8px;padding:16px 16px 12px}
.kpi .kv{font:800 27px/1 var(--f-disp);font-stretch:112%;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .d{display:flex;align-items:center;gap:6px;font:500 10px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.dl{font-weight:600;padding:3px 5px;border-radius:5px;letter-spacing:0}
.dl.up{color:var(--up);background:var(--up-bg)}.dl.down{color:var(--down);background:var(--down-bg)}.dl.flat{color:var(--ink-2);background:rgba(16,17,14,.06)}
/* KPI changes read as the store's price stickers: lime for up, paper with an ink edge for down */
.kpi .dl,.big .dl{padding:4px 7px 3px;border-radius:999px;box-shadow:0 0 0 1.5px var(--ink);transform:rotate(-4deg);font-weight:700}
.kpi .dl.up,.big .dl.up{background:var(--lime);color:var(--lime-ink)}
.kpi .dl.down,.big .dl.down{background:var(--paper);color:var(--down)}
.kpi .d{overflow:visible;padding:3px 0}
.kpi svg{display:block;width:100%;height:30px;margin-top:2px;overflow:visible}
.chart{position:relative;min-height:240px}
.chart svg{display:block;overflow:visible}
.ax{font:500 9.5px/1 var(--f-mono);fill:var(--ink-3);letter-spacing:.04em}
.gl{stroke:var(--rule);stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:16px;height:3px;border-radius:2px;background:var(--ink)}
.legend i.p{background:repeating-linear-gradient(90deg,var(--ink-3) 0 4px,transparent 4px 7px)}
.legend i.l{background:var(--lime);height:10px;width:10px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--ink)}
.legend i.g{background:var(--ink-3);height:10px;width:10px;border-radius:3px}
.legend i.k{height:10px;width:10px;border-radius:3px}
.tip{position:absolute;pointer-events:none;z-index:4;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 10px;font:500 10.5px/1.5 var(--f-mono);white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 12px));transition:opacity .2s}
.tip b{font-weight:600;color:var(--lime)}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big b{font:800 34px/1 var(--f-disp);font-stretch:112%;font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;margin:-4px 0}
.fi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--rule);text-align:left;width:100%;transition:background .3s}
.fi:first-child{border-top:0}
.fi:hover{background:rgba(16,17,14,.025)}
.fi.new{animation:flash 2.4s ease-out}
@keyframes flash{0%,30%{background:var(--lime-soft)}}
.fi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 10px/1 var(--f-mono);background:var(--cv)}
.fi .ic.app{background:var(--ink);color:var(--lime)}
.fi .ic.store{background:var(--lime);color:var(--ink)}
.fi .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.fi .tx b{font:700 13px/1.2 var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .tx em{font:400 12px/1.25 var(--f-disp);font-style:normal;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .ic{grid-row:span 2}
.fi .fst{grid-column:2/-1;margin-top:-6px;font:500 9.5px/1.2 var(--f-mono);letter-spacing:.06em;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .fst small{font:inherit;color:var(--ink-2)}
.fi .fst small.lime{color:var(--up);font-weight:600}
.fi .tx span{font:500 9.5px/1.2 var(--f-mono);letter-spacing:.06em;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .am{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font:600 12.5px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%;transition:width 1.2s var(--ease)}
.lrows{display:flex;flex-direction:column}
.lr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.lr:first-child{border-top:0}
.lr .sw{width:10px;height:10px;border-radius:3px}
.lr b{font:600 13px/1.2 var(--f-disp)}
.lr span{font:500 10px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.lr em{font-style:normal;font:600 12.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:62px}
.th{width:36px;height:46px;border-radius:9px;background:var(--cv);position:relative;overflow:hidden;flex:none}
.th img{position:absolute;left:-6%;top:-2px;width:112%}
.rk{display:grid;grid-template-columns:18px auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.rk:first-child{border-top:0}
.rk > i{font:600 10px/1 var(--f-mono);color:var(--ink-3);font-style:normal}
.rk .nm{display:flex;flex-direction:column;gap:6px;min-width:0}
.rk .nm b{font:700 12.5px/1.15 var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:3px;background:rgba(16,17,14,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ink);transform-origin:0 50%;animation:grow 1.4s var(--ease) both .3s}
.bar i.l{background:var(--lime);box-shadow:inset 0 0 0 1px rgba(16,17,14,.25)}
@keyframes grow{from{transform:scaleX(0)}}
.rk .am{text-align:right;display:flex;flex-direction:column;gap:5px;font:600 12.5px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.rk .am span{font-weight:500;font-size:10px;color:var(--ink-3)}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.al:first-child{border-top:0}
.al .nm{display:flex;flex-direction:column;gap:5px;min-width:0}
.al .nm b{font:700 12.5px/1.15 var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .nm span{font:500 10px/1.2 var(--f-mono);color:var(--ink-3);letter-spacing:.03em}
.al .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.al .r span{font:500 10px/1 var(--f-mono);color:var(--ink-2)}
.heat{display:grid;grid-template-columns:30px repeat(16,minmax(0,1fr));gap:3px;align-items:center}
.heat .hl{font:500 9.5px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.heat .hx{font:500 9px/1 var(--f-mono);color:var(--ink-3);text-align:center;padding-top:4px}
.heat i{display:block;aspect-ratio:1.5;border-radius:4px;background:rgba(16,17,14,var(--a));transition:transform .3s}
.heat i.top{background:var(--lime);box-shadow:inset 0 0 0 1.5px var(--ink)}
.heat i:hover{transform:scale(1.18)}
.hnote{display:flex;gap:18px;flex-wrap:wrap}
.hnote div{display:flex;flex-direction:column;gap:6px}
.hnote b{font:800 17px/1 var(--f-disp);font-stretch:110%}
.sources{display:flex;flex-direction:column}
.sr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.sr:first-child{border-top:0}
.sr .ic{width:32px;height:32px;border-radius:9px;background:var(--cv);display:grid;place-items:center}
.sr .ic svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.6;fill:none}
.sr b{font:700 12.5px/1.2 var(--f-disp);display:block}
.sr span{font:500 9.5px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}

/* tables */
.tbl{display:flex;flex-direction:column;min-width:0}
.tr{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--rule);text-align:left;width:100%}
.tr.h{border-top:0;padding-top:0;font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.tr.h > *:not(:first-child){text-align:right}
.tr > *{min-width:0}
.tr .c{font:600 12.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tr .c span{display:block;margin-top:5px;font-weight:500;font-size:10px;color:var(--ink-3)}
/* a status pill in a table cell keeps its own pill shape and colours, not the cell's sub-line style */
.tr .c span.pill{display:inline-flex;margin-top:0;font-weight:600;font-size:9px;color:var(--ink)}
.tr .c span.pill.lime{color:var(--lime-ink)}.tr .c span.pill.up{color:var(--up)}.tr .c span.pill.warn{color:var(--warn)}.tr .c span.pill.down{color:var(--down)}.tr .c span.pill.ink{color:var(--paper)}
.tr .nm{display:flex;align-items:center;gap:12px;min-width:0}
.tr .nm > div{display:flex;flex-direction:column;gap:5px;min-width:0}
.tr .nm b{font:700 13px/1.2 var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .nm span{font:500 9.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
button.tr:hover{background:rgba(16,17,14,.025)}
.curve{display:flex;align-items:flex-end;gap:3px;height:30px;justify-content:flex-end}
.curve i{width:9px;border-radius:2px 2px 0 0;background:var(--ink);min-height:2px}
.curve i.pk{background:var(--lime);box-shadow:inset 0 0 0 1px rgba(16,17,14,.35)}
.st{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.st .bar{width:100%;max-width:110px}
.mx{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(5,minmax(0,1fr)) minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:center}
.mx.h,.mx.h .c{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.mx.h > :first-child{text-align:left}
.mx + .mx{padding-top:8px;border-top:1px solid var(--rule)}
.mx.h + .mx{border-top:0}
.cell{height:40px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;background:var(--cv)}
.cell span{font:500 8.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.cell.low{background:var(--warn-bg);color:var(--warn)}
.cell.low span{color:var(--warn)}
.cell.out{background:var(--down-bg);color:var(--down)}
.cell.out span{color:var(--down)}
.cell.na{background:none;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule)}
.mx .c{font:600 12.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.mx .c span{display:block;margin-top:5px;font-weight:500;font-size:9.5px;color:var(--ink-3)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{height:30px;padding:0 12px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule-2);font:600 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;transition:background .3s,color .3s;display:flex;align-items:center;gap:6px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.filters button em{font-style:normal;opacity:.6}
.ledger{display:flex;flex-direction:column}
.lg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:baseline;padding:10px 0;border-top:1px solid var(--rule)}
.lg:first-child{border-top:0}
.lg span{font:400 13.5px/1.3 var(--f-disp)}
.lg b{font:600 13px/1 var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:90px}
.lg em{font-style:normal;font:500 10px/1 var(--f-mono);color:var(--ink-3);text-align:right;min-width:48px}
.lg.sub span{padding-left:14px;color:var(--ink-2)}
.lg.tot{border-top:1.5px solid var(--ink)}
.lg.tot span{font-weight:800;font-stretch:110%;text-transform:uppercase;font-size:13px}
.lg.tot b{font-size:15px;font-weight:600}
.lg.hd span{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.lg.hd b,.lg.hd em{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.dcard{display:flex;flex-direction:column;gap:12px}
.dcard .dh{display:flex;justify-content:space-between;align-items:flex-start}
.dcard .dh b{font:900 22px/1 var(--f-disp);font-stretch:122%;text-transform:uppercase;letter-spacing:-.01em;display:block;margin-top:6px}
.dthumbs{display:flex;gap:6px}
.dthumbs .th{width:44px;height:56px}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dstats div{display:flex;flex-direction:column;gap:6px}
.dstats b{font:800 18px/1 var(--f-disp);font-stretch:110%;font-variant-numeric:tabular-nums}
.drawer{position:absolute;top:0;right:0;bottom:0;z-index:30;width:min(420px,100%);background:var(--paper);box-shadow:-30px 0 60px -20px rgba(16,17,14,.35);transform:translateX(105%);transition:transform .7s var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dw-in{overflow-y:auto;padding:20px 22px 30px;display:flex;flex-direction:column;gap:16px}
.dw-h{display:flex;justify-content:space-between;align-items:flex-start}
.dw-h h2{margin:6px 0 0;font:900 26px/1 var(--f-disp);font-stretch:120%;text-transform:uppercase;letter-spacing:-.01em}
.act{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:42px;padding:0 16px;border-radius:999px;background:var(--ink);color:var(--paper);font:700 11px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;transition:background .35s,color .35s,transform .4s var(--ease)}
.btn:hover{background:var(--lime);color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-2)}
.btn.ghost:hover{background:rgba(16,17,14,.05)}
.otoast{position:absolute;right:24px;top:84px;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;border-radius:16px;background:var(--ink);color:var(--paper);box-shadow:0 20px 40px -16px rgba(16,17,14,.5);transform:translateX(calc(100% + 40px));transition:transform .8s var(--ease);max-width:calc(100% - 48px);text-align:left}
.otoast.on{transform:none}
.otoast .th{background:var(--rail-2)}
.otoast b{display:block;font:700 13px/1.2 var(--f-disp)}
.otoast span{font:500 10px/1.3 var(--f-mono);color:var(--rail-mu);letter-spacing:.04em}
.otoast em{font-style:normal;margin-left:6px;font:600 13px/1 var(--f-mono);color:var(--lime)}
.pay{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--rule)}

/* ---------- owner: Soft Riot touches ---------- */
/* the drop on its rail, on the store's wall */
.orail{flex-direction:row;align-items:stretch;gap:28px;padding:22px 26px 34px;overflow:hidden;background:radial-gradient(80% 110% at 62% 20%,var(--wall-hi) 0%,var(--wall) 58%,var(--wall-lo) 100%)}
.or-tx{flex:none;width:200px;display:flex;flex-direction:column;justify-content:space-between;padding-bottom:4px}
.or-n{display:block;font:900 72px/.86 var(--f-disp);font-stretch:118%;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.or-s{display:block;margin-top:10px;font:500 10px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.or-rack{position:relative;flex:1;min-width:0;display:flex;justify-content:center;--w:132px;--h:194px}
.or-rod{position:absolute;left:2%;right:2%;top:5px;height:3px;border-radius:2px;background:linear-gradient(180deg,#d9dad3,#8c8e86);box-shadow:0 1px 2px rgba(16,17,14,.25)}
.or-it{position:relative;flex:none;width:var(--w);height:var(--h);margin-left:calc(var(--w) * -.32);transform-origin:50% 2%;animation:hang 1.3s var(--ease) both;animation-delay:calc(var(--k) * 130ms + 260ms)}
.or-it:nth-child(2){margin-left:0}
.or-img{position:absolute;inset:0;transform-origin:50% 2%;transition:transform .9s var(--ease)}
.or-img img{width:100%;height:100%;object-fit:contain;object-position:50% 0;display:block;filter:drop-shadow(0 12px 14px rgba(16,17,14,.18))}
.or-it:hover{z-index:3}.or-it:hover .or-img{transform:scale(1.06) rotate(-1.5deg)}
.or-tag{position:absolute;left:50%;bottom:-18px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:54px;padding:7px 8px 6px;border-radius:4px;background:var(--paper);box-shadow:0 4px 10px rgba(16,17,14,.14),inset 0 0 0 1px rgba(16,17,14,.14);transform:translateX(-50%) rotate(-3deg)}
.or-it:nth-child(odd) .or-tag{transform:translateX(-50%) rotate(3deg)}
.or-tag b{font:800 15px/1 var(--f-disp);font-stretch:112%;font-variant-numeric:tabular-nums}
.or-tag span{font:500 8.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.or-it.top .or-tag{background:var(--lime);box-shadow:0 0 0 1.5px var(--ink),0 4px 10px rgba(16,17,14,.14)}
.or-it.top .or-tag span{color:var(--lime-ink)}
@keyframes hang{from{opacity:0;transform:translateY(-28px) rotate(-3deg)}60%{opacity:1}to{opacity:1;transform:none}}
/* live orders print on the store's receipt paper */
.rcpt{border-radius:4px;padding-bottom:30px;-webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,radial-gradient(circle at 50% 100%,transparent 4.5px,#000 5px) bottom/12px 9px repeat-x;mask:linear-gradient(#000,#000) top/100% calc(100% - 9px) no-repeat,radial-gradient(circle at 50% 100%,transparent 4.5px,#000 5px) bottom/12px 9px repeat-x}
.rc-brand{display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px dashed var(--rule-2);font:500 9.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}

const DEV = (() => { let d = store.get('softriot-dev'); if (!d) { d = 'd' + Math.random().toString(36).slice(2, 10); store.set('softriot-dev', d); } return d; })();
const LIVE = {
  db: null, dbDocs: new Map(), local: new Map(), mode: 'local', subs: new Set(),
  list() { const m = new Map(this.local); this.dbDocs.forEach((v, k) => m.set(k, v)); return [...m.values()]; },
  get(id) { return this.dbDocs.get(id) || this.local.get(id); },
  on(fn) { this.subs.add(fn); },
  emit(ch) { this.subs.forEach(fn => fn(ch)); },
  loadLocal() { try { const a = JSON.parse(store.get('softriot-live') || '[]'); this.local = new Map(a.map(o => [o.id, o])); } catch (e) { this.local = new Map(); } },
  saveLocal() { store.set('softriot-live', JSON.stringify([...this.local.values()].slice(-80))); },
  async init() {
    this.loadLocal();
    addEventListener('storage', e => { if (e.key === 'softriot-live') { this.loadLocal(); this.emit({ type: 'sync' }); } });
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (!db) return;
    this.db = db;
    db.collection('orders').orderBy('t', 'desc').limit(300).onSnapshot(snap => {
      const added = [];
      snap.docChanges().forEach(c => { if (c.type === 'added' && !this.dbDocs.has(c.doc.id)) added.push(c.doc.id); });
      this.dbDocs = new Map(snap.docs.map(d => [d.id, Object.assign({}, d.data(), { id: d.id, live: true })]));
      const first = this.mode !== 'db'; this.mode = 'db'; setLiveLabel();
      this.emit({ type: first ? 'sync' : 'snap', added: first ? [] : added });
    }, () => { this.db = null; this.mode = 'local'; setLiveLabel(); });
  },
  async add(o) {
    this.local.set(o.id, o); this.saveLocal(); this.emit({ type: 'add', id: o.id, mine: true });
    if (!this.db) return;
    try { await this.db.collection('orders').doc(o.id).set(o); this.local.delete(o.id); this.saveLocal(); } catch (e) { /* stays on this device */ }
  },
  async advance(id, stage) {
    const o = this.get(id); if (!o) return;
    const at = Object.assign({}, o.stageAt || {}); at[stage] = Date.now();
    const next = Object.assign({}, o, { stage, stageAt: at });
    if (this.dbDocs.has(id) && this.db) { this.dbDocs.set(id, next); this.emit({ type: 'stage', id }); try { await this.db.collection('orders').doc(id).update({ stage, stageAt: at }); } catch (e) {} }
    else { this.local.set(id, next); this.saveLocal(); this.emit({ type: 'stage', id }); }
  }
};

function secDrops() {
  const all = UMB.orders(), now = Date.now();
  const D = DROPS.map(dr => {
    const L = dropLaunch(dr), days = Math.min(14, Math.floor((now - L) / DAY) + 1), cum = []; let s = 0, rev = 0, u72 = 0, sold = 0;
    const per = new Array(days).fill(0);
    all.forEach(o => { if (o.t < L) return; o.items.forEach(x => { if (!dr.p.includes(x.p)) return; sold += x.q; rev += x.q * PX[x.p].price; const d = Math.floor((o.t - L) / DAY); if (d < days) per[d] += x.q; if (o.t - L < 3 * DAY) u72 += x.q; }); });
    per.forEach(v => { s += v; cum.push(s); });
    const oh = dr.p.reduce((a, id) => a + PX[id].sizes.reduce((b, z) => b + UMB.stock(id, z), 0), 0);
    return { dr, L, cum, rev, u72, st: sold / (sold + oh), sold };
  });
  return `<div class="card" style="--k:0"><div class="ch"><div><h3>Launch curves</h3><p>Units sold in each drop’s first two weeks, counted from launch at noon.</p></div><div class="legend">${D.map((d, i) => `<span><i style="background:${i === 3 ? 'var(--ink)' : ['#B9BBB2', '#9C9E95', '#6F716A'][i]};${i === 3 ? 'height:3px' : ''}"></i>Drop 0${d.dr.n}</span>`).join('')}</div></div><div class="chart" id="cDrops"></div></div>

function nextPayday() { const anchor = new Date(2026, 0, 2).getTime(), t0 = d0(Date.now()); let k = Math.ceil((t0 - anchor) / (14 * DAY)); return addDays(anchor, k * 14); }

  const days = (Math.min(b, now) - a) / DAY, mdays = new Date(new Date(a).getFullYear(), new Date(a).getMonth() + 1, 0).getDate();
  const l = within(a, b), sales = l.reduce((s, o) => s + o.sub, 0), shipIn = l.reduce((s, o) => s + o.ship, 0), tax = l.reduce((s, o) => s + o.tax, 0), cg = l.reduce((s, o) => s + cogs(o), 0);

  const pd = nextPayday(), ps = addDays(pd, -13), elapsed = Math.min(14, Math.max(1, (now - ps) / DAY + 1)) / 14;

  return `<div class="row r-21" style="--k:0">

  $('#oDrawer').classList.add('on');
}
function closeDrawer() { OWN.dw = null; $('#oDrawer').classList.remove('on'); }

/* ---------- render ---------- */
OWN.render = function (keepScroll) {
  if (!OWN.shown) return;
  const sec = OWN.sec, now = Date.now(), act = UMB.orders().slice(-400).filter(o => needsAction(o, now)).length;
  $('#oNav').innerHTML = NAV.map(([k, l, ic]) => `<button type="button" data-sec="${k}" aria-current="${k === sec}"><svg viewBox="0 0 20 20">${ic}</svg>${l}${k === 'orders' && act ? `<em>${act}</em>` : ''}</button>`).join('');
  const rng = ['today', 'products', 'customers'].includes(sec);
  const stk = { today: 'Drop 04 live', orders: act ? act + ' to pack' : 'All packed', products: P.length + ' pieces', drops: 'Drop 05 next' }[sec];
  $('#oHead').innerHTML = `<div><h1>${TITLE[sec]}${stk ? `<span class="stk">${stk}</span>` : ''}</h1><p>${WDL[new Date(now).getDay()]}, ${dateS(now)} · ${clock(now)}</p></div>
    <div class="oh-r">${rng ? `<div class="seg" id="rSeg"><i></i>${[['today', 'Today'], ['7d', '7 days'], ['30d', '30 days']].map(([k, l]) => `<button type="button" data-range="${k}" aria-pressed="${OWN.range === k}">${l}</button>`).join('')}</div>` : ''}<span class="sync hide-s"><span class="dot pulse"></span><span id="syncTx">Synced just now</span></span></div>`;
  const main = $('#oMain'), y = main.scrollTop;
  $('#oSec').innerHTML = ({ today: secToday, orders: secOrders, products: secProducts, inventory: secInventory, customers: secCustomers, drops: secDrops, books: secBooks })[sec]();
  if (keepScroll) { $('#oSec').querySelectorAll('.osec > *, #oSec > *').forEach(e => e.style.animation = 'none'); main.scrollTop = y; }
  document.querySelectorAll('#oHead .seg, #mSeg').forEach(placeSeg);
  if (sec === 'today') mainChart(); if (sec === 'customers') custChart(); if (sec === 'drops') dropChart();
  if (keepScroll) $('#oSec').querySelectorAll('.draw,.area-in,.pop,.bar i,.bg').forEach(e => e.style.animation = 'none');
  $('#oSrc').innerHTML = `<span class="lbl">Feeding UMB</span>` + [['Soft Riot app', LIVE.mode === 'db' ? 'live' : 'device'], ['Web store', 'live'], ['Square POS', ago(OWN.syncAt - 90e3).replace(' ago', '')], ['Bank feed', '6:02a']].map(([n, s]) => `<div><span class="dot"></span>${n}<span>${s}</span></div>`).join('');
  OWN.w = $('#oSec').clientWidth;
};
OWN.show = function () { if (!OWN.shown) { OWN.shown = true; OWN.render(); } else OWN.resize(); };
OWN.resize = function () { if (!OWN.shown || SH.view === 'app') return; const w = $('#oSec').clientWidth; if (Math.abs(w - OWN.w) > 4) { OWN.w = w; mainChart(); custChart(); dropChart(); document.querySelectorAll('#oHead .seg, #mSeg').forEach(placeSeg); } };
OWN.onLive = function (ev) {
  UMB.dirty();
  const ids = ev.type === 'add' ? [ev.id] : ev.type === 'snap' ? ev.added : ev.type === 'sim' ? [ev.id] : [];
  ids.forEach(id => { OWN.fresh.add(id); setTimeout(() => OWN.fresh.delete(id), 6000); });
  OWN.syncAt = Date.now();
  if (OWN.shown && SH.view !== 'app') {
    OWN.render(true);
    const o = ids.length && UMB.orders().find(x => x.id === ids[ids.length - 1]);
    if (o && o.ch === 'app') { const c = UMB.customer(o), t = $('#oToast'); t.dataset.order = o.id; t.innerHTML = `<span class="th">${pic(o.items[0].p, 'f', '', o.items[0].c | 0)}</span><div><b>New app order · ${esc(c ? c.name : 'Customer')}<em>${money(o.total, 2)}</em></b><span>${o.no} · ${o.items.map(x => esc(PX[x.p].name) + ' ' + x.s).join(', ')}</span></div>`; t.classList.add('on'); clearTimeout(OWN.tt); OWN.tt = setTimeout(() => t.classList.remove('on'), 6000); }
    if (OWN.dw) openDrawer(OWN.dw);
  }
};
function bindOwner() {
  $('#paneOwn').addEventListener('click', e => {
    const t = e.target; let b;
    if ((b = t.closest('[data-sec]'))) { OWN.sec = b.dataset.sec; closeDrawer(); OWN.render(); $('#oMain').scrollTop = 0; return; }
    if ((b = t.closest('[data-range]'))) { OWN.range = b.dataset.range; OWN.render(); return; }
    if ((b = t.closest('[data-month]'))) { OWN.month = b.dataset.month; OWN.render(true); return; }
    if ((b = t.closest('[data-of]'))) { OWN.of = b.dataset.of; OWN.render(true); return; }
    if ((b = t.closest('[data-adv]'))) { const [id, s] = b.dataset.adv.split(':'); LIVE.advance(id, Number(s)); return; }
    if (t.closest('#dwX')) { closeDrawer(); return; }
    if ((b = t.closest('[data-order]'))) { $('#oToast').classList.remove('on'); openDrawer(b.dataset.order); return; }
  });
}
function ownTick() {
  const s = $('#syncTx'); if (s) s.textContent = 'Synced ' + ago(OWN.syncAt);
  if (Date.now() - OWN.syncAt > 15e3) OWN.syncAt = Date.now() - 1000;
}

/* ---------- boot ---------- */
(function boot() {
  document.documentElement.style.setProperty('--grain', `url(${noiseURL(140, 70, 26)})`);
  SH.mob = innerWidth <= 600; document.body.classList.toggle('mob', SH.mob);
  bindApp(); bindOwner(); renderShop(); setBadge();
  $('#viewSeg').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view, true); });
  SH.view = location.hash.slice(1) || (innerWidth >= 1200 ? 'both' : 'app');
  buildSeg(); setView(SH.view);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
  addEventListener('hashchange', () => setView(location.hash.slice(1)));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placeSeg($('#viewSeg')); document.querySelectorAll('#oHead .seg, #mSeg, #pdSeg').forEach(placeSeg); });
  LIVE.on(ev => {
    UMB.dirty();
    if (A.tab === 'orders' && !A.over && ev.type !== 'add') renderOrders();
    OWN.onLive(ev);
  });
  LIVE.init();
  let n = 0;
  setInterval(() => { appTick(); ownTick(); if (++n % 30 === 0 && OWN.shown && SH.view !== 'app') OWN.render(true); }, 1000);
  (function sim() { setTimeout(() => { simStoreSale(); sim(); }, 45e3 + Math.random() * 60e3); })();
})();

</script>

</body></html>
