<style>
:root{

.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;height:40px;box-sizing:border-box}
.qty button{appearance:none;border:0;background:transparent;color:var(--cream);width:40px;height:38px;font:600 18px/1 var(--body);cursor:pointer;border-radius:11px}
.qty button:hover{background:rgba(243,236,223,.07)}
.qty b{min-width:28px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.lines{list-style:none;margin:8px 0 0;padding:0}
.lines li{display:grid;grid-template-columns:40px minmax(0,1fr) auto 32px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lines .sw{width:40px;height:40px;border-width:3px}
.lines .sw.food{border-radius:12px}
.lines b{display:block;font-size:14px;font-weight:700;line-height:1.2}
.lines small{display:block;margin-top:4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lines em{font-style:normal;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.rm{appearance:none;border:0;background:transparent;color:var(--muted);width:32px;height:32px;padding:0;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.rm:hover{color:var(--cream);background:rgba(243,236,223,.07)}
.rm svg{width:15px;height:15px}
.more{appearance:none;border:0;background:transparent;color:var(--gold);font:700 13px/1 var(--body);height:40px;padding:0;margin-top:4px;cursor:pointer}
.field{display:block;margin-top:16px}
.field input{display:block;width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(243,236,223,.05);color:var(--cream);font:600 15px/1 var(--body);padding:0 14px;outline:none;transition:border-color .3s}
.field input::placeholder{color:rgba(243,236,223,.35)}
.field input:focus{border-color:var(--gold)}
.sum{margin-top:18px;display:grid;gap:9px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.sum .tot{color:var(--cream);font-weight:800;font-size:15px;padding-top:11px;border-top:1px solid var(--line)}
.sh-foot{padding:14px 16px 16px;border-top:1px solid var(--line)}
.sh-foot:empty{display:none}
.go{appearance:none;border:0;width:100%;height:52px;border-radius:14px;background:var(--gold);color:var(--ink);font:800 15px/1 var(--body);display:flex;align-items:center;justify-content:space-between;padding:0 20px;cursor:pointer;transition:opacity .3s}
.go:disabled{opacity:.4;cursor:default}
.go span:last-child{font-variant-numeric:tabular-nums}
#fade{position:fixed;inset:0;background:#0d0f1c;opacity:0;pointer-events:none;transition:opacity .45s ease}
@media (max-width:1240px){.stat span{display:none}}
@media (max-width:1180px){.toggle button{padding:0 11px}.toggle button span{display:none}}
@media (max-width:1100px){.nav .zoom{display:none}}
@media (max-width:1000px){.stats{display:none}}
@media (max-width:900px){

  #hud{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 272px;row-gap:12px}
  .brand{padding:0 8px 0 10px;gap:9px}
  .word strong{font-size:17px}
  .word span{letter-spacing:.28em}
  .mark{width:26px;height:26px}
  .brand .sep,#clock{display:none}
  .tune{margin-left:-4px}
  #btnTune{width:30px;height:30px}
  .dock{display:contents}
  .toggle{grid-row:1;grid-column:1;justify-self:end;align-self:start;height:var(--bar);box-sizing:border-box}
  .toggle button{height:38px;padding:0 10px;gap:6px;font-size:12px}
  .toggle button span{display:inline}
  .toggle svg{width:15px;height:15px}
  .nav{grid-row:2;grid-column:1;justify-self:start;align-self:end;height:var(--bar);box-sizing:border-box}
  .nav button{width:38px;height:38px}
  .nav .zoom{display:none}
  .cta{grid-row:2;grid-column:1;justify-self:end;align-self:end;height:var(--bar);font-size:13px;padding:0 18px 0 15px}
  .queue{grid-column:1;grid-row:3;padding-top:14px}
  .pipe{margin:14px 0 10px;padding-bottom:12px}
  .pipe b{font-size:17px}
  .queue.has-mine .pipe{display:none}
  .mine{margin:12px 0 10px}
  .sheet{left:0;right:0;bottom:0;width:auto;max-width:640px;margin:0 auto;height:min(88dvh,720px);border-radius:22px 22px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(calc(100% + 24px))}
  .sheet.open{transform:translateY(0)}
}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}.card{min-height:84px}}
@media (max-width:370px){.toggle button span{display:none}.toggle button{padding:0 10px}}
@media (prefers-reduced-motion:reduce){.live i,.cta .dot,#pin i{animation:none}.row{transition:opacity .3s}.sheet,.sheet.open{transition:visibility 0s}}
@media (max-width:420px){.brand{gap:7px;padding:0 6px 0 10px}.word strong{font-size:16px}.toggle button{padding:0 9px;gap:5px}}

    [[1568, 0], [2093, 0.09]].forEach(([f, d]) => { const o = ctx.createOscillator(), g = gain(0); o.frequency.value = f; chain(o, g, AU.fx); g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(0.035, t + d + 0.01); g.gain.linearRampToValueAtTime(0, t + d + 0.08); o.start(t + d); o.stop(t + d + 0.1); });
  } else if (type === 'clink') clink(0.05);
  else if (type === 'ding') [[2637, 0], [2093, 0.16]].forEach(([f, d]) => { const o = ctx.createOscillator(), g = gain(0); o.frequency.value = f; chain(o, g, AU.fx); g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(0.03, t + d + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.9); o.start(t + d); o.stop(t + d + 1); });
}
function duck(on) { if (!AU.ctx) return; AU.bed.gain.setTargetAtTime(on ? 0.4 : 1, AU.ctx.currentTime, on ? 0.12 : 0.6); }
function setMuted(m) {
  AU.muted = m; try { localStorage.setItem('lunas-sound', m ? 'off' : 'on'); } catch (e) {}
  btnSound.setAttribute('aria-pressed', String(!m)); showVol();
  if (m) {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (AU.ctx) { AU.master.gain.setTargetAtTime(0, AU.ctx.currentTime, 0.08); clearTimeout(AU.susT); AU.susT = setTimeout(() => { if (AU.muted) AU.ctx.suspend(); }, 500); }
  } else if (!AU.ctx) audioStart();
  else { clearTimeout(AU.susT); AU.ctx.resume(); AU.master.gain.setTargetAtTime(0.9, AU.ctx.currentTime, 0.25); }
}
btnSound.addEventListener('click', () => setMuted(!AU.muted));
addEventListener('pointerdown', audioStart, true);
addEventListener('keydown', audioStart, true);
document.addEventListener('visibilitychange', () => { if (!AU.ctx) return; if (document.hidden) AU.ctx.suspend(); else if (!AU.muted) AU.ctx.resume(); });

/* ---------- loop ---------- */
let spawnT = 6, last = performance.now(), monT = 0;
function step(dt) {
  T0 += dt; simSec = clockNow();
  spawnT -= dt;
  if (spawnT <= 0) { if (queue.length < 2) spawnCustomer(); spawnT = rand(7, 11); }
  for (const b of [ana, ben, cleo, dee]) { b.actT += dt; runAgent(b, dt); }
  for (const c of [...customers]) custUpdate(c, dt);
  for (const s of seated) seatedUpdate(s, dt);
  if (oven.state === 'baking') { oven.t -= dt; if (oven.t <= 0) { oven.state = 'ready'; sfx('ding'); } }
  ovenWin.emissiveIntensity = damp(ovenWin.emissiveIntensity, oven.state === 'baking' ? 1.5 + Math.sin(T0 * 2.2) * 0.15 : oven.state === 'ready' ? 0.9 : 0.25, 2, dt);
  for (const a of agents) { moveAgent(a, dt); poseAgent(a, dt, T0); }
  for (let i = orders.length - 1; i >= 0; i--) if (orders[i].stage === 4 && T0 - orders[i].doneT > 7) { orders.splice(i, 1); boardDirty = true; }
  shotT -= dt; shot.visible = ana.act === 'pull' && ana.actT > 1.1;
  binFills.forEach((f, i) => f.scale.y = Math.max(0.02, (beans.level + [0.04, -0.03, 0.01][i]) * 0.66));
  youRing.position.set(player.pos.x, 0.03, player.pos.z); youRing.scale.setScalar(player.grow);
  emitters(dt); updateSteam(dt);
}
// pre-roll so the scene opens mid-motion
for (let i = 0; i < 60; i++) step(1 / 30);
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt);
  updateCamera(dt, T0);
  monT -= dt; if (boardDirty && monT <= 0) { monitors.forEach(drawMonitor); boardDirty = false; monT = 0.25; }
  updateGlow(dt);
  renderer.render(scene, camera);
  updateHUD(dt); updateTags(); updatePin(); updateBubbles(now);
  requestAnimationFrame(frame);
}
monitors.forEach(drawMonitor);
requestAnimationFrame(t => { last = t; frame(t); });
</script>
