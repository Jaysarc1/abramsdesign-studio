<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rail Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Kaushan+Script&display=swap">
<style>
/* Layout: a store wall. The bag receipt hangs from a wire in the left column; logo, rail and caption share one axis, centred on the stage rather than the window. */
:root{
  --wall:#E6E7E1; --wall-hi:#F5F5F1; --wall-lo:#D2D3CB;
  --ink:#10110E; --ink-2:#54564E; --ink-3:#8C8E85; --rule:rgba(16,17,14,.14);
  --lime:#43E61F; --paper:#FBFAF5;
  --f-disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --col:248px; --gap:32px; --top:68px; --mq:34px; --gut:28px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--f-disp);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:999px}
.app{position:relative;height:100%;display:grid;grid-template-rows:var(--top) minmax(0,1fr) var(--mq);
  background:radial-gradient(90% 80% at 58% 34%,var(--wall-hi) 0%,var(--wall) 48%,var(--wall-lo) 100%);overflow:hidden}
.app::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.32;mix-blend-mode:multiply;pointer-events:none;z-index:0}
.bgword{position:absolute;left:var(--sx,50%);top:var(--sy,50%);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:0;animation:bgIn 1.6s var(--ease) .2s both}
.bgword span{font:900 clamp(90px,13vw,250px)/.82 var(--f-disp);font-stretch:125%;letter-spacing:-.02em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1px rgba(16,17,14,.035);white-space:nowrap}
@keyframes bgIn{from{opacity:0}}

/* header */
.top,.main{display:grid;grid-template-columns:var(--col) minmax(0,1fr);column-gap:var(--gap);position:relative;box-sizing:border-box;width:100%;max-width:var(--frame,100%);margin-inline:auto;
  padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.top{align-items:center;z-index:6}
.main{z-index:2}
.lbl{font:500 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.hl{display:flex;align-items:center;justify-content:center}
.hl .lbl{display:none}
.o-lbl{margin:0 0 40px;padding-left:.16em;text-align:center}
.hl .lbl b{color:var(--ink);font-weight:600}
.bagbtn{display:none}
/* logo, rack and caption share one axis: the centre of the stage column */
.hc{grid-area:1/2;justify-self:center;display:flex}
.logo{width:124px;height:42px;display:block;border-radius:999px}
.logo svg{width:100%;height:100%;overflow:visible;transition:transform .6s var(--ease)}
.logo:hover svg{transform:rotate(-3deg) scale(1.04)}
/* the mark: a tight pill, and a word too big for it. Inside the pill the letters are ink; where they break out they carry the lime with them */
.logo .push{transform-box:view-box;transform-origin:66px 22px}
.hr{grid-area:1/2;justify-self:start;margin-left:var(--al,0px);display:flex;align-items:center;gap:10px}
/* wide desktop: the logo sits on the page centre, the nav pair centres over the info column */
.sym .hc{grid-column:1/-1}
/* the top row drops onto the SS26 label's line */
.hc,.hr{translate:0 var(--hy,0px)}
.sym .hr{grid-area:auto;position:absolute;top:50%;left:var(--nx);margin:0;transform:translate(-50%,-50%);transition:left .9s var(--ease)}
.sym.is-focus .hr{left:var(--nxF)}
/* back / forward, as in the app: one word shows, the other side is just its arrow; hovering a usable side hands it the word */
.hist{display:flex;align-items:center;height:44px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);background:rgba(251,250,245,.35);animation:navIn .6s var(--ease) both}
.navb{display:flex;align-items:center;height:44px;padding:0 15px;border-radius:999px;font:600 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;transition:background .3s,opacity .35s,padding .7s var(--ease)}
.navb .lb{display:block;overflow:hidden;white-space:nowrap;max-width:0;opacity:0;margin:0;transition:max-width .7s var(--ease),opacity .45s,margin .7s var(--ease)}
#btnShop:not(:disabled){padding:0 16px 0 14px}#btnShop:not(:disabled) .lb{max-width:7.2em;opacity:1;margin-left:8px}
#btnShop:disabled~#btnLast:not(:disabled),#btnLast:not(:disabled):hover{padding:0 14px 0 16px}
#btnShop:disabled~#btnLast:not(:disabled) .lb,#btnLast:not(:disabled):hover .lb{max-width:7.2em;opacity:1;margin-right:8px}
.hist:has(#btnLast:not(:disabled):hover) #btnShop{padding:0 15px}
.hist:has(#btnLast:not(:disabled):hover) #btnShop .lb{max-width:0;opacity:0;margin:0}
.navb:hover:not(:disabled){background:rgba(251,250,245,.9)}
.navb:disabled{opacity:.3;cursor:default}
.navb svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.7;fill:none;transition:transform .5s var(--ease)}
#btnShop:hover:not(:disabled) svg{transform:translateX(-3px)}#btnLast:hover:not(:disabled) svg{transform:translateX(3px)}
.hist i{width:1px;height:16px;background:var(--rule);flex:none}
@keyframes navIn{from{opacity:0;transform:translateX(-6px)}}

/* audio pill */
.audio{position:relative;display:flex;align-items:center;height:44px;padding:0 4px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--rule);background:rgba(251,250,245,.35)}
.mute{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .3s}
.mute:hover{background:rgba(16,17,14,.06)}
.mute svg{width:20px;height:20px;overflow:visible}
.mute svg path{stroke:var(--ink)}
.spk .w{opacity:.3;transition:opacity .6s}
.audio.playing .spk .w1{animation:wv 1.6s ease-in-out infinite}
.audio.playing .spk .w2{animation:wv 1.6s ease-in-out .25s infinite}
@keyframes wv{0%,100%{opacity:.3}50%{opacity:1}}
.mute .off{display:none}
.audio.muted .mute .spk{display:none}.audio.muted .mute .off{display:block}
.vol{display:flex;align-items:center;width:0;overflow:hidden;opacity:0;transition:width .55s var(--ease),opacity .4s,padding .55s var(--ease)}
.audio:hover .vol,.audio:focus-within .vol,.audio.open .vol{width:118px;padding:0 14px 0 8px;opacity:1}
.vol input{-webkit-appearance:none;appearance:none;width:96px;height:18px;margin:0;background:transparent;cursor:pointer;touch-action:none}
.vol input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--ink) var(--v,70%),rgba(16,17,14,.16) 0)}
.vol input::-moz-range-track{height:3px;border-radius:3px;background:rgba(16,17,14,.16)}
.vol input::-moz-range-progress{height:3px;border-radius:3px;background:var(--ink)}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;border-radius:50%;background:var(--ink);border:2px solid var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.vol input::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--paper)}
.audio.muted .vol input{opacity:.35}

/* main + bag */
.main{min-height:0;padding-block:6px 18px}
.orders{position:relative;display:flex;flex-direction:column;min-height:0;margin-top:var(--oy,0px)}
.o-wire{height:1px;margin-top:2px;background:linear-gradient(90deg,rgba(16,17,14,.5),rgba(16,17,14,.22));box-shadow:0 1px 0 rgba(255,255,255,.7)}
.receipt{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.r-in{position:relative;padding-top:34px;min-height:0;display:flex;flex-direction:column;filter:drop-shadow(0 14px 20px rgba(20,22,15,.14)) drop-shadow(0 1px 1px rgba(20,22,15,.12));transform-origin:50% 0}
.clip{position:absolute;top:0;left:50%;width:46px;height:50px;margin-left:-23px;z-index:2;overflow:visible;transform-origin:50% 30%;transition:transform .7s var(--ease)}
.orders:hover .clip{transform:rotate(-4deg)}
.r-paper{position:relative;background:var(--paper);padding:18px 16px 26px;display:flex;flex-direction:column;gap:12px;min-height:0;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/11px 7px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/11px 7px repeat-x}
.ln{animation:prt .36s steps(5,end) both;animation-delay:calc(var(--i,0) * 110ms + 160ms)}
@keyframes prt{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.r-brand{display:flex;justify-content:space-between;font:500 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.r-head{display:flex;justify-content:space-between;align-items:flex-end}
.r-title{font-weight:900;font-stretch:125%;font-size:30px;line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
.r-count{font:600 11px/1 var(--f-mono);letter-spacing:.1em;font-variant-numeric:tabular-nums;padding:5px 7px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ink);transition:background .4s}
.r-count.bump{animation:bump .6s var(--ease)}
@keyframes bump{40%{transform:scale(1.25);background:var(--lime)}}
.r-meta{font:400 11px/1.4 var(--f-mono);color:var(--ink-2);letter-spacing:.04em}
.r-rule{height:0;border-top:1px dashed rgba(16,17,14,.26);flex:none}
.r-lines{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;margin-right:-6px;padding-right:6px;scrollbar-width:thin}
.r-empty{margin:4px 0;font:500 11px/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.bl{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start}
.bl-th{width:30px;height:42px}
.bl-th img{display:block;width:100%;height:100%;object-fit:contain}
.bl-th svg{width:100%;height:100%;overflow:visible}
.bl-tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.bl-tx b{font-weight:700;font-size:12.5px;line-height:1.15}
.bl-tx span{font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.qty{display:flex;align-items:center;gap:2px;margin-top:2px}
.qty button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:500 13px/1 var(--f-mono);transition:background .3s}
.qty button:hover{background:rgba(16,17,14,.08)}
.qty i{font:600 11px/1 var(--f-mono);font-style:normal;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
.bl-pr{font:600 12px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.r-row{display:flex;align-items:baseline;gap:8px;font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.r-row span:nth-child(2){flex:1;border-bottom:1px dotted rgba(16,17,14,.3);transform:translateY(-3px)}
.r-row b{font-weight:600;font-variant-numeric:tabular-nums}
.r-total{display:flex;justify-content:space-between;align-items:baseline}
.r-total span{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase}
.r-total b{font-weight:800;font-stretch:115%;font-size:26px;font-variant-numeric:tabular-nums}
.go{height:46px;flex:none;border-radius:999px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:10px;font:700 12px/1 var(--f-disp);letter-spacing:.16em;text-transform:uppercase;transition:background .35s,color .35s,transform .5s var(--ease),opacity .4s}
.go:hover{background:var(--lime);color:var(--ink)}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.3;pointer-events:none}
.go svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none}
.r-stamp{position:absolute;right:16px;top:58px;font:800 18px/1 var(--f-disp);font-stretch:118%;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border:2px solid var(--ink);border-radius:4px;background:var(--lime);mix-blend-mode:multiply;transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both .9s}
@keyframes stamp{from{opacity:0;transform:rotate(-12deg) scale(1.9)}to{opacity:.94;transform:rotate(-12deg) scale(1)}}

/* stage + rail */
.stage{position:relative;min-width:0;min-height:0}
.rail{position:absolute;left:calc(50% + var(--cx,0px));top:calc(var(--ry) + var(--rd,0px));width:var(--bw);margin-left:calc(var(--bw) / -2);transition:opacity .7s,filter .8s}
.is-focus .rail{opacity:0;filter:blur(16px);pointer-events:none}
.bar{position:relative;height:var(--bt);border-radius:var(--bt);background:linear-gradient(180deg,#fbfbf9 0%,#c4c6bf 38%,#8b8d86 62%,#d9dad5 100%);box-shadow:0 2px 3px rgba(16,17,14,.18),0 10px 22px rgba(16,17,14,.06)}
/* each end bends back into the wall and is screwed to it on a round plate */
.mt{position:absolute;top:calc(var(--bt) * -1);width:calc(var(--bt) * 6);height:calc(var(--bt) * 8);overflow:visible;pointer-events:none}
.mt.r{left:calc(100% - var(--bt) * 4)}.mt.l{left:calc(var(--bt) * -2);transform:scaleX(-1)}
.items{position:absolute;left:50%;top:calc(var(--bt) / 2 - var(--rh) * .018);display:flex;padding-left:calc(var(--rw) * .3);transform:translateX(-50%)}
.ri{position:relative;z-index:var(--z,1);width:var(--rw);height:var(--rh);margin-left:calc(var(--rw) * -.3);transform:translateX(var(--x,0px)) scale(calc(var(--s,1) * var(--b,1)));transform-origin:50% 1.8%;transition:transform .9s var(--ease)}
.ri.hov{z-index:30}
.ri:focus-visible{outline:none}
.drop,.sway{display:block;position:absolute;inset:0;transform-origin:50% 1.8%}
.sway{animation:sway var(--sw,6s) ease-in-out var(--d,0s) infinite alternate}
@keyframes sway{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
.c3{position:absolute;inset:0}
.face{position:absolute;top:0;left:0;width:100%;height:100%;visibility:hidden;will-change:transform}
.face.on{visibility:visible}
.face.f,.face.b{left:-50%;width:200%}
.face img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none;filter:drop-shadow(calc(var(--rh) * .005) calc(var(--rh) * .014) calc(var(--rh) * .016) rgba(16,17,14,.24)) drop-shadow(calc(var(--rh) * .018) calc(var(--rh) * .055) calc(var(--rh) * .07) rgba(16,17,14,.2))}
.layer img{width:100%;height:100%;display:block;-webkit-user-drag:none;user-select:none}
.ri.gone .drop{opacity:0}
/* keep shopping down the rack */
.rk{position:absolute;top:calc(var(--rh) * .44);width:var(--ak);height:var(--ak);margin-top:calc(var(--ak) / -2);border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(16,17,14,.28);background:rgba(255,255,255,.22);z-index:40;transition:background .35s,box-shadow .35s}
.rk.l{left:calc(var(--az) / -2 - var(--ak) / 2)}.rk.r{right:calc(var(--az) / -2 - var(--ak) / 2)}
.rk svg{width:34%;height:34%;stroke:var(--ink);stroke-width:1.3;fill:none;transition:transform .5s var(--ease)}
.rk:hover{background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--ink)}
.rk.l:hover svg{transform:translateX(-3px)}.rk.r:hover svg{transform:translateX(3px)}
.rk:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* caption under the rail */
.cap{position:absolute;left:50%;top:calc(var(--rh) * 1.1 + clamp(14px,2.6vh,30px) - var(--rd,0px));width:min(86vw,820px);margin-left:max(-43vw,-410px);display:grid}
.cb{grid-area:1/1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.cb > *{transition:opacity .45s,transform .7s var(--ease)}
.cb.out > *{opacity:0;transform:translateY(-8px)}
.cb.in > *{animation:rise .8s var(--ease) both}
.cb.in > :nth-child(2){animation-delay:.07s}.cb.in > :nth-child(3){animation-delay:.14s}.cb.in > :nth-child(4){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.c-eye{margin:0 0 16px;padding-left:.22em;font:500 11px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:14px;align-items:center}
.c-eye i{width:28px;height:1px;background:var(--ink-3)}
.c-name{position:relative;margin:0;font-weight:900;font-stretch:122%;font-size:clamp(26px,3.1vw,46px);line-height:.95;letter-spacing:-.015em;text-transform:uppercase;text-wrap:balance}
.c-price{position:absolute;left:100%;top:-.62em;margin-left:-.32em;font:800 15px/1 var(--f-disp);font-stretch:112%;letter-spacing:.02em;padding:6px 10px 5px;background:var(--lime);border-radius:999px;box-shadow:0 0 0 1.5px var(--ink);transform:rotate(-7deg);white-space:nowrap}
.c-story{margin:14px 0 0;font:400 16px/1.5 var(--f-disp);color:var(--ink-2);max-width:none;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{margin:20px 0 0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chips span{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:11px 16px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(16,17,14,.22);background:rgba(251,250,245,.4)}

/* product page */
.pv{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,25vw,360px);column-gap:clamp(32px,3vw,56px);pointer-events:none}
.is-focus .pv{pointer-events:auto}
.pane{position:relative;min-width:0;min-height:0}
.pane.zoomed{overflow:hidden;cursor:zoom-out;touch-action:none}
.fg{position:absolute;left:var(--fx,50%);top:var(--ft);width:var(--fw);height:var(--fh);margin-left:calc(var(--fw) / -2);visibility:hidden;cursor:zoom-in}
.pane.zoomed .fg{cursor:inherit}
.fg.on{visibility:visible}
.zm{position:absolute;left:0;top:0;width:100%;height:100%}
.flip,.layer{position:absolute;inset:0}
.layer.wipe{clip-path:inset(0 0 100% 0)}
.hs{position:absolute;inset:0;transition:opacity .4s}
.pane.zoomed .hs,.flipping .hs{opacity:0;pointer-events:none}
.hot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:opacity .5s,transform .7s var(--ease)}
.is-focus .hot{opacity:1;transform:none;transition-delay:calc(var(--k) * 90ms + 900ms)}
.hot::before{content:"";position:absolute;inset:7px;border-radius:50%;background:rgba(251,250,245,.92);box-shadow:0 0 0 1px rgba(16,17,14,.35),0 3px 8px rgba(0,0,0,.18)}
.hot::after{content:"";position:absolute;inset:3px;border-radius:50%;box-shadow:0 0 0 1px rgba(251,250,245,.8);animation:hp 2.6s ease-out infinite;animation-delay:calc(var(--k) * .4s)}
@keyframes hp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.hot svg{position:relative;width:9px;height:9px;stroke:var(--ink);stroke-width:1.6}
.hot span{position:absolute;left:calc(100% + 4px);top:50%;transform:translate(-4px,-50%);white-space:nowrap;font:600 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:6px 8px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.hot:hover span,.hot:focus-visible span{opacity:1;transform:translate(0,-50%)}
.tags{position:absolute;left:var(--tl);top:calc(var(--ft) + var(--fh) * .02 - var(--lift,20px));display:flex;gap:16px;align-items:flex-start;transition:opacity .4s}
.pane.zoomed .tags,.pane.zoomed .ctrl{opacity:0;pointer-events:none}
.tag{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;opacity:0;transform:translateY(-30px);transition:opacity .5s,transform .8s var(--ease)}

  // pieces arrive the way a new one loads from the rack arrows: a short slide in from the right as it fades up
  const L = itemsEl.children.length, step = DIM.rw * .7;
  [...itemsEl.children].forEach((el, i) => {
    el.querySelector('.drop').animate([{ transform: `translateX(${step * .9}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: D(820), delay: D(1250 + posOf(i) * 150), easing: 'cubic-bezier(.22,.8,.3,1)', fill: bk });
  });
  const late = D(1250 + (L - 1) * 150 + 600);
  receiptEl.querySelector('.r-in').animate([{ transform: 'translateY(-30px) rotate(-2deg)', opacity: 0 }, { transform: 'rotate(.8deg)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { duration: D(1100), delay: D(1700), easing: 'cubic-bezier(.3,.7,.3,1)', fill: bk });
  // opacity only: the nav and arrows carry their own positioning transforms
  document.querySelectorAll('.mt').forEach(m => m.animate([{ opacity: 0 }, { opacity: 1 }], { duration: D(700), delay: D(1250), easing: ez, fill: bk }));
  ['.o-lbl', '.hr', '#rkL', '#rkR', '#d05'].forEach((q, k) => { const e = $(q); if (e) e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: D(900), delay: late + D(k * 90), easing: ez, fill: bk }); });
  setTimeout(() => { if (capKey === null) setCap(-1); }, late);
}

/* ---------- boot ---------- */
function boot() {
  document.documentElement.style.setProperty('--grain', `url(${noiseURL(180, 70, 40)})`);
  buildRail(); applyOrder();
  const words = ['New drops', 'Soft Riot', 'Never still', 'Drop 04', 'Free shipping over $150', 'SS26'];
  const run = words.map(w => `<span>${w}</span><span>✦</span>`).join('');
  $('#mq').innerHTML = run.repeat(4) + run.repeat(4);
  audioUI(); layout();
  renderBag('print');
  entrance();
  if (document.fonts) document.fonts.ready.then(layout);
}
boot();
